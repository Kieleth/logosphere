id: https://logosphere.dev/voyager/chargen
name: voyager_chargen
title: Voyager — what a character is before a career starts
description: >-
  The one pack this game owns. It declares the SHAPE of the three
  things a character-creation slice needs and nothing else: the person
  being made, the characteristics the book rolls for them, and the
  careers the book offers.

  THE RULE THIS FILE EXISTS TO KEEP. What the book fixes lives in the
  graph and is read from where it is used. So this pack declares no
  characteristic; it declares what a Characteristic IS, and the six
  instances arrive from the extractor as data cited to the page that
  prints them. The C++ never names one. Adding a seventh is a row in
  the graph, and the screen grows a line without a recompile — which
  is the property test_characteristics_from_graph measures rather than
  asserts by inspection.

  Everything mechanical is the engine's already: a throw is a
  rulebook TaskCheck, a number the book fixes is a RuleConstant, an
  ordered walk is a Procedure of ProcedureSteps, and a question a rule
  left open with the answer somebody gave it is an ArbiterDecision.
  None of that is redeclared here.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  voyager: https://logosphere.dev/voyager/
  logosphere: https://logosphere.dev/schema/

imports:
  - linkml:types
  - logosphere
  - rulebook

enums:
  MomentKindKey:
    description: >-
      The closed set of kinds a moment can be, exactly as Chapter One
      of the Voyager book fixes it [01-the-shape-of-a-career.md "The
      kinds of moments"]. Closed on purpose: the list is the game's
      ethos, and an open string here would let a seed invent a sixth
      kind no chapter ever wrote. Lower case, case sensitive, because
      that is what the seeds say and folding case would accept the
      typo the enum exists to refuse.
    permissible_values:
      violence:
      judgment:
      discovery:
      standing:
      loss:

  SeasonModeKey:
    description: >-
      The three ways a season is spent [01-the-shape-of-a-career.md
      "Seasons"]. Closed for the same reason as MomentKindKey.
    permissible_values:
      preparation:
      pursuit:
      quiet:

  VoyagerLifeRelationType:
    description: Typed links from a character to what their life holds.
    permissible_values:
      LIVED:

classes:
  Character:
    is_a: LivingEntity
    description: >-
      The person being made. Its characteristic scores are ORDINARY
      PROPERTIES named by the graph: a Characteristic entity carries
      the slot it writes to in attribute_ref, and every reader — the
      roller, the screen, the referee's brief — goes through that
      indirection. Nothing in the C++ says "strength".

      Not Cited. A character is a player's, not the book's. Only the
      SLOTS below are the book's, and each cites the page that names
      it.

      strength is a class-local attribute rather than a shared slot
      because the malleus root already declares a `strength` slot
      meaning relation confidence, and one name cannot mean two things
      in one merged registry.
    attributes:
      strength:
        range: integer
        minimum_value: 0
        maximum_value: 33
        description: >-
          Str, position 1 of the UPP
          [book1/character-creation.md "The Explanation"].
    slots:
      - dexterity
      - endurance
      - intelligence
      - education
      - social_standing
      - psionic_strength
      - age_years
      - chosen_career
      - career_decision

  Characteristic:
    is_a: Entity
    mixins:
      - Cited
    description: >-
      One characteristic the book names, in the order the book prints
      it [book1/character-creation.md "The Explanation"]. It is the
      whole of what the C++ knows about characteristics: which slot on
      Character holds the score (attribute_ref), what to call it on
      screen (characteristic_abbreviation), and where it sits in the
      profile (characteristic_index).

      Cited, because its instances come out of the book. The book
      prints seven and character creation rolls six; the seventh,
      Psionic Strength, is not rolled at creation, so the extractor
      does not seed it. Nothing in the C++ knows either number.

      characteristic_index is a printing position in a fixed profile,
      not a rung of a ladder: nothing advances along it and nothing
      adds one to it, so it does not have the shape that made rank an
      arithmetic bug.
    annotations:
      facets: rulebook
    slot_usage:
      attribute_ref:
        required: true
      characteristic_abbreviation:
        required: true
      characteristic_index:
        required: true
      characteristic_dice:
        required: true
    slots:
      - attribute_ref
      - characteristic_abbreviation
      - characteristic_index
      - characteristic_dice

  Career:
    is_a: Entity
    mixins:
      - Cited
    description: >-
      One career the book offers, with the two throws this slice needs
      [book1/character-creation.md "Career Descriptions", "Career
      Tables"]. Each throw is its own TaskCheck so it can cite the cell
      it was printed in; one entity carrying both numbers could only
      ever prove one of them.

      career_summary is the book's own description sentence, kept
      because it is what makes a referee's narrowing about the career
      rather than about its name.
    annotations:
      facets: rulebook
    slot_usage:
      qualification_check:
        required: true
      survival_check:
        required: true
    slots:
      - qualification_check
      - survival_check
      - career_summary

  CharacteristicModifierEntry:
    is_a: LookupEntry
    description: >-
      One row of the Characteristic Modifier by Score Range table
      [book1/character-creation.md "Characteristic Modifiers"]. The
      inherited key band is the score range; the one result column is
      the modifier that score contributes to a throw.

      It is here because the ontology will not let a throw name a
      characteristic without also naming the lookup that turns a score
      into a modifier: "a throw is modified by a characteristic through
      a lookup, or by neither". Which is correct, and it is also what
      lets the screen and the referee's brief state the odds rather
      than the raw score. Both read this table; neither computes the
      arithmetic the book prints beside it.
    annotations:
      facets: rulebook
    slot_usage:
      characteristic_modifier:
        required: true
    slots:
      - characteristic_modifier

  Narration:
    is_a: Entity
    description: >-
      Prose a referee wrote about a character, held by the character it
      is about (HAS_PART).

      NOT Cited, and for the same reason SkillRating is not: the rule
      is the book's, what happened is not. It exists so the screen can
      be a view. A background sentence held only in a C++ member is a
      second copy of state that can drift from the graph, and this
      module has already paid for three of those.
    annotations:
      facets: rulebook
    slot_usage:
      narration_text:
        required: true
    slots:
      - narration_text

  MomentKind:
    is_a: Entity
    mixins:
      - Cited
    description: >-
      One kind of moment, as the Voyager book defines it
      [01-the-shape-of-a-career.md "The kinds of moments"]. The enum
      closes the vocabulary; this entity carries the book's own
      defining paragraph, cited to its bytes, because a referee will
      narrate kinds and must narrate from the book rather than from a
      model's private idea of the word.
    annotations:
      facets: voyager-book
    slot_usage:
      moment_kind_key:
        required: true
    slots:
      - moment_kind_key

  SeasonMode:
    is_a: Entity
    mixins:
      - Cited
    description: >-
      One of the three ways a season is spent
      [01-the-shape-of-a-career.md "Seasons"], cited to the sentence
      that fixes all three.
    annotations:
      facets: voyager-book
    slot_usage:
      season_mode_key:
        required: true
    slots:
      - season_mode_key

  SeasonLived:
    is_a: Event
    description: >-
      One season spent, as the character spent it: which of the three
      ways, and the year of the life it occupied. The record IS the
      choice's provenance; the sheet's age is derived through the
      season_standard_years constant, never written as a literal
      [02-seasons-and-moments-in-play.md "What a season costs"].
    annotations:
      facets: voyager-book
    slot_usage:
      event_type:
        equals_string: SEASON_LIVED
      season_mode:
        required: true
      lived_year:
        required: true
    slots:
      - season_mode
      - lived_year

  MomentFaced:
    is_a: Event
    description: >-
      One moment faced, exactly as the book requires it recorded: "its
      kind, the chance as it was stated, what was drawn, and what it
      did" [02-seasons-and-moments-in-play.md "What a moment risks"].

      This record is also what stage IS: stage is never stored, it is
      counted, kind by kind, from these
      [02-seasons-and-moments-in-play.md "What stage is"]. A stored
      stage would be a second copy that can drift; a counted one
      cannot.
    annotations:
      facets: voyager-book
    slot_usage:
      event_type:
        equals_string: MOMENT_FACED
      moment_kind:
        required: true
      moment_chance:
        required: true
      moment_draw:
        required: true
      moment_went_against:
        required: true
      moment_situation:
        required: true
      moment_outcome:
        required: true
    slots:
      - moment_kind
      - moment_chance
      - moment_draw
      - moment_went_against
      - moment_situation
      - moment_outcome

  LivedRelation:
    is_a: Relation
    description: >-
      A character LIVED an event: a season spent, a moment faced. The
      generic part-of link accepts entities and these records are
      EVENTS, which is correct twice over: a moment is not a part of a
      person, it is something that happened to one, and the stage
      query counts what happened, never what is attached. One relation
      name, target range Event, so the next kind of lived record is a
      row in the graph rather than a new link type.
    slot_usage:
      relation_type:
        range: VoyagerLifeRelationType
        required: true
        equals_string: LIVED
      source_id:
        range: Character
      target_id:
        range: Event

  UnsettledQuestion:
    is_a: Entity
    mixins:
      - Cited
    description: >-
      A question the book leaves open on purpose, cited to its entry
      under "Unsettled" [01-the-shape-of-a-career.md "Unsettled"].
      Absence with an address: an undecided rule and a nonexistent
      rule look identical from inside a graph, so the book's own open
      questions load as records the machinery can count and surface,
      instead of as silence.
    annotations:
      facets: voyager-book
    slot_usage:
      question_text:
        required: true
    slots:
      - question_text

slots:
  # The characteristic score slots. Each is cited in its description to
  # the ordered list the book prints under "The Explanation"; the
  # Characteristic instances in the graph are what point at them.
  # 2D6 at creation, and a player-character score "may not typically
  # exceed a maximum of 15" — but the modifier table the book prints
  # runs to 33 and beyond, so the slot range is the table's, not the
  # cap's.
  dexterity:
    range: integer
    minimum_value: 0
    maximum_value: 33
    description: Dex, position 2 of the UPP.
  endurance:
    range: integer
    minimum_value: 0
    maximum_value: 33
    description: End, position 3 of the UPP.
  intelligence:
    range: integer
    minimum_value: 0
    maximum_value: 33
    description: Int, position 4 of the UPP.
  education:
    range: integer
    minimum_value: 0
    maximum_value: 33
    description: Edu, position 5 of the UPP.
  social_standing:
    range: integer
    minimum_value: 0
    maximum_value: 33
    description: Soc, position 6 of the UPP.
  psionic_strength:
    range: integer
    minimum_value: 0
    maximum_value: 33
    description: >-
      Psi, position 7 of the UPP. The book prints it in the same
      ordered list as the other six and then says it "cannot be rolled
      or bought during character creation without the Referee's
      permission" [book1/character-creation.md "Psionic Strength, the
      Seventh Characteristic"], so this slice never rolls it.

      It is declared anyway, and that is deliberate. The ontology says
      what MAY exist; the graph says what DOES. A seventh characteristic
      is one row away, and the test that proves the screen reads the
      graph adds exactly that row.
  age_years:
    range: integer
    minimum_value: 0
    description: >-
      How old the character is. Set from the age-of-majority
      RuleConstant, read where it is used, never written as a literal.
  chosen_career:
    range: Career
    description: >-
      The career this character entered. An entity reference, so the
      set of legal values is the set of careers in the graph and a
      career the rules never issued cannot be written here.
  career_decision:
    range: ArbiterDecision
    description: >-
      The record of the choice that put this character in that career:
      what was asked, everything that was on offer, what was taken and
      who took it.

      It points from the state to the event that produced it, which is
      the direction that can be checked. A decision entity with nothing
      pointing at it is a record nobody can find from the thing it
      explains, and every other value on this sheet traces to a rule
      and a roll.
  characteristic_abbreviation:
    range: string
    description: >-
      What the book calls this characteristic in short — "Str", "Soc",
      "Psi" — printed in the same parentheses that name it. It is what
      the screen writes, so the screen has no list of its own.
  characteristic_index:
    range: integer
    minimum_value: 1
    description: >-
      Position in the profile the book prints, 1-based, as the numbered
      list under "The Explanation" states it.
  qualification_check:
    range: TaskCheck
    description: >-
      The throw to enter this career
      [book1/character-creation.md "Career Tables", Qualifications row].
  survival_check:
    range: TaskCheck
    description: >-
      The throw to survive a term in it
      [book1/character-creation.md "Career Tables", Survival row].
  career_summary:
    range: string
    description: >-
      What the book says this career is, in the book's own sentence
      [book1/character-creation.md "Career Descriptions"].
  characteristic_dice:
    range: DiceExpression
    description: >-
      What this characteristic is rolled with: "Roll your six
      characteristics using 2D6"
      [book1/character-creation.md "Generating Characteristic Scores"].

      It lives on the characteristic rather than on the step so the step
      does not have to assume the graph holds exactly one dice
      expression, which is the kind of assumption that is silently true
      until it is silently wrong. A book that rolls one characteristic
      differently from the rest needs no code change.

      A note on its provenance, because it is worth arguing with. The
      entity is cited to the numbered list that names it, and that list
      says nothing about dice; the dice come from the sentence that says
      what to roll, two sections earlier. An entity reference carries no
      number for the value check to prove either way. The alternative
      was a uniqueness assumption living in a primitive, unstated and
      unproven, and this is the smaller debt of the two.
  characteristic_modifier:
    range: integer
    description: >-
      The modifier a score in this row contributes to a throw
      [book1/character-creation.md "Characteristic Modifiers"].
  narration_text:
    range: string
    description: The prose, as the referee wrote it.
  moment_kind_key:
    range: MomentKindKey
    description: >-
      Which kind this is. The membership check is the schema's, so a
      kind no chapter wrote cannot load.
  season_mode_key:
    range: SeasonModeKey
    description: Which of the three ways of spending a season this is.
  question_text:
    range: string
    description: The open question, in the book's own words.
  season_mode:
    range: SeasonMode
    description: >-
      Which of the three ways this season was spent. An entity
      reference, so a way the book never wrote cannot be recorded.
  lived_year:
    range: integer
    minimum_value: 0
    description: The age this season completed at.
  moment_kind:
    range: MomentKind
    description: >-
      Which kind this moment was. An entity reference, so a kind the
      book never defined cannot be recorded.
  moment_chance:
    range: float
    minimum_value: 0
    maximum_value: 1
    description: >-
      The probability of the moment going against the character, as
      the referee stated it. The book's own bounds (tighter than this
      slot's) are RuleConstants read where the chance is accepted
      [02-seasons-and-moments-in-play.md "What a moment risks"].
  moment_draw:
    range: float
    minimum_value: 0
    maximum_value: 1
    description: What the engine drew against that chance.
  moment_went_against:
    range: boolean
    description: Whether the draw went against the character.
  moment_situation:
    range: string
    description: The situation, as the referee described it.
  moment_outcome:
    range: string
    description: What it did, as the referee told it afterwards.
