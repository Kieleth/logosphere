    <text y="420" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">Player O, enter row col:</tspan><tspan fill="#d2a8ff" xml:space="preserve"> 1 1</tspan></text>
