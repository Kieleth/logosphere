    <text y="800" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">--+---+--</tspan></text>
    <text y="820" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#79c0ff" x="16" xml:space="preserve">O</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | </tspan><tspan fill="#79c0ff" xml:space="preserve">O</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | .</tspan></text>
    <text y="840" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">--+---+--</tspan></text>
    <text y="860" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">. | . | .</tspan></text>
    <text y="900" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">Player X, enter row col:</tspan><tspan fill="#d2a8ff" xml:space="preserve"> 0 2</tspan></text>
    <text y="920" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#8b949e" x="16" xml:space="preserve">[event] move recorded: entity 12 OCCUPIES entity 5</tspan></text>
    <text y="940" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#f78166" x="16" xml:space="preserve">X</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | </tspan><tspan fill="#f78166" xml:space="preserve">X</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | </tspan><tspan fill="#f78166" xml:space="preserve">X</tspan></text>
    <text y="960" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">--+---+--</tspan></text>
    <text y="980" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#79c0ff" x="16" xml:space="preserve">O</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | </tspan><tspan fill="#79c0ff" xml:space="preserve">O</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | .</tspan></text>
    <text y="1000" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">--+---+--</tspan></text>
