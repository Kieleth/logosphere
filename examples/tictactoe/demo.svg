    <text y="660" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">. | </tspan><tspan fill="#79c0ff" xml:space="preserve">O</tspan><tspan fill="#c9d1d9" xml:space="preserve"> | .</tspan></text>
    <text y="680" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14"><tspan fill="#c9d1d9" x="16" xml:space="preserve">--+---+--</tspan></text>
