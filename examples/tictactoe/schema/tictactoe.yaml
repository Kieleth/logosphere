id: https://logosphere.dev/tictactoe/schema
name: tictactoe
title: Tic-Tac-Toe on Logosphere
description: >-
  Game ontology for a headless tic-tac-toe example, extending
  Logosphere's base types with a 3x3 board, cells, and players.

  Relations: this schema declares no new relation types on purpose.
  scripts/generate_registry.py derives the registry's relation set
  exclusively from the engine's WorldRelationType enum, so a
  game-declared relation enum would generate nothing (see
  examples/eden/schema/eden.yaml, whose EdenRelationType is decorative).
  The game therefore reuses the engine's own relations, as logotron does:
    HAS_PART - the board owns its nine cells
    MANAGES  - a player claims the cell they have marked

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  tictactoe: https://logosphere.dev/tictactoe/schema/
  logosphere: https://logosphere.dev/schema/

imports:
  - linkml:types
  - logosphere

# -------------------------------------------------------------------
# Enums
# -------------------------------------------------------------------

enums:
  TicTacToeEventType:
    description: Tic-tac-toe specific event types.
    permissible_values:
      MOVE_MADE:
        description: A player marked a cell
      GAME_WON:
        description: A player completed a winning line
      GAME_DRAWN:
        description: The board filled with no winner

# -------------------------------------------------------------------
# Entity types
# -------------------------------------------------------------------

classes:
  Board:
    is_a: WorldEntity
    description: The 3x3 tic-tac-toe board. Singleton per game.

  Cell:
    is_a: WorldEntity
    description: A single square of the board.
    slots:
      - row
      - col
      - mark

  Player:
    is_a: Entity
    description: A tic-tac-toe player ("X" or "O").
    slots:
      - symbol
      - player_name

# -------------------------------------------------------------------
# Tic-tac-toe events
# -------------------------------------------------------------------

  TicTacToeEvent:
    is_a: Event
    description: Tic-tac-toe narrative event (move, win, draw).
    slot_usage:
      event_type:
        range: TicTacToeEventType

# -------------------------------------------------------------------
# Slots
# -------------------------------------------------------------------

slots:
  row:
    range: integer
    description: Zero-based row index (0-2) of a cell.
  col:
    range: integer
    description: Zero-based column index (0-2) of a cell.
  mark:
    range: string
    description: Current mark on a cell -- "", "X", or "O".
  symbol:
    range: string
    description: The player's mark -- "X" or "O".
  player_name:
    range: string
    description: Display name of the player.
