id: https://logosphere.dev/logogenesis/schema
name: logogenesis
title: Logogenesis — conversational world creation
description: >-
  Game ontology for Logogenesis: you stand in the construct (black
  void, phosphor grid), type
  what you want to exist, and an LLM makes it so through the KG-ops
  grammar. The LLM authors SEED entities (creation requests carrying
  the full spec as validated properties); the host materializer reads
  each seed, grows the real thing through the engine's worldgen
  generators (Tree / GrassPatch / Rock), and destroys the seed. The
  ontology below IS the LLM's creative vocabulary: every slot range
  the validator enforces is a promise the prompt can rely on.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  logogenesis: https://logosphere.dev/logogenesis/schema/
  logosphere: https://logosphere.dev/schema/
  malleus: https://malleus.dev/schema/

imports:
  - linkml:types
  - logosphere
  # Earth-like vocabulary (trees, grass, rock, small fauna) is a
  # SETTING PACK, not core. This game grows things, so it asks.
  - earth
  # Celestial vocabulary (Sky, CelestialBody, Planet) is a SETTING
  # PACK, not core. Logogenesis makes worlds and skies, so it asks
  # for it; a game with no sky simply does not, and those types stay
  # unknown to its knowledge graph.
  - space

# -------------------------------------------------------------------
# Enums
# -------------------------------------------------------------------

enums:
  SerpentKind:
    description: The serpent's build; each kind carries its own
      proportions and palette, tunable with the color slots.
    permissible_values:
      GARDEN:
        description: A slender green garden snake, half a meter of
          quiet rustle. The default.
      PYTHON:
        description: A thick constrictor, meters long, slow and
          heavy. For wishes with weight.
      CORAL:
        description: Banded and bright, small and vivid. For wishes
          with color.
  DeadwoodKind:
    description: What kind of fallen wood rests on the ground.
    permissible_values:
      TRUNK:
        description: A whole fallen tree, meters of it. A landmark.
      LOG:
        description: A log section, bench-sized.
      BRANCH:
        description: A fallen branch. The default; scatter a few.
      TWIG:
        description: Twig debris, small strokes of texture.
  GrassSpread:
    description: The shape of a grass dab.
    permissible_values:
      SOFT:
        description: >-
          A painter's dab: round splat, dense center, feathered
          edge. The default; sprinkle several like brush strokes.
      SQUARE:
        description: Even rectangular fill, hard edges. For lawns
          and field blocks.

# -------------------------------------------------------------------
# Classes — the creation requests the LLM may author. World concepts
# (Sky, TreeSpecies, TerrainKind, tree anatomy, moon vocabulary) live
# in logosphere's base schema; this file holds only the WISH GRAMMAR.
# -------------------------------------------------------------------

classes:
  SunSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for the real sun: a celestial body that arcs across
      the sky with game time, warm at dawn and dusk, white at noon,
      gone at night. Creates the Sky entity. One sun only; prefer it
      over LightSeeds for any outdoor scene. Give time_of_day and
      the world BEGINS at that hour instantly ("golden hour with a
      sun" = one SunSeed with time_of_day 18.2). Later hour changes
      via the Sky play as an accelerated journey. Three faint fixed
      stars come with the sun so night is never pitch black.
    slots:
      - time_of_day
      - sun_distance

  MoonSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a moon. The sun brings Earth's silver moon by
      default; MoonSeeds add EXOTIC ones — blood red, viridian,
      sapphire, brighter or paler, up to three in the night sky.
      Omit colors for another Earth-like moon.
    slots:
      - moon_r
      - moon_g
      - moon_b
      - moon_brightness
      - moon_size

  ButterflySeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for living butterflies fluttering near (x, y). They
      fly on their own. Omit wing colors for natural variety
      (monarch orange, morpho blue); set them for a themed flock.
    slots:
      - x
      - y
      - count
      - wing_span
      - wing_r
      - wing_g
      - wing_b

  GroundSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for ground centered at (x, y). THE VOID HAS NO FLOOR:
      anything placed without ground beneath it has nothing to stand
      on (gravity exists). Default terrain LAYERED is real earth:
      huge bonded bedrock slabs, rubble filler, loose topsoil clods,
      poured in and settled live; it craters under impacts. SLAB is
      one cheap flat box for pure backdrops. Ground color tints the
      topsoil — a green ground reads as a lawn from above.
    slots:
      - x
      - y
      - ground_width
      - ground_depth
      - ground_r
      - ground_g
      - ground_b
      - terrain

  LightSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a light at (x, y), floating at light_height. THE
      VOID BEGINS UNLIT: nothing you create is visible until at least
      one light exists. Create light first.
    slots:
      - x
      - y
      - light_height
      - brightness
      - light_radius
      - light_r
      - light_g
      - light_b

  TreeSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request to grow a tree at (x, y). species is one of OAK, PINE,
      WILLOW, PALM, BAOBAB, REDWOOD (the engine's TreeSpecies
      archetypes; OAK when omitted). The materializer maps it to a
      TreeSpec preset, applies the overrides below, grows the tree
      via space colonization, then destroys this seed.
    slots:
      - x
      - y
      - species
      - tree_height
      - crown_radius
      - canopy_start
      - canopy_density
      - lower_branches
      - grow_seconds
      - trunk_r
      - trunk_g
      - trunk_b
      - leaf_r
      - leaf_g
      - leaf_b

  HumanoidSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a person at (x, y). They come alive and WANDER the
      scene on foot: strolling to a spot, lingering, moving on.
      Clothing color is their visible identity. One seed = one
      person; several seeds = a village.
    slots:
      - x
      - y
      - cloth_r
      - cloth_g
      - cloth_b

  GrassSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a grass patch centered at (x, y). Blade colors
      default to living green; tint them for effect ("red tones
      below the redwood").
    slots:
      - x
      - y
      - patch_width
      - patch_depth
      - blade_count
      - spread
      - organic
      - blade_r
      - blade_g
      - blade_b

  RockSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a rock at (x, y). With drop_height it becomes a
      BOULDER FALLING FROM THE SKY: born high, it plummets, and on
      LAYERED ground the impact shoves the topsoil aside.
    slots:
      - x
      - y
      - rock_size
      - rock_r
      - rock_g
      - rock_b
      - drop_height

  OrbitSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request to orbit the camera around the scene: the isometric
      view swings around the world like a slow drone shot. The world
      does not move; only the eye does. Use when the human asks to
      look around, orbit, spin the view, or see it from all sides.
      One full revolution ends exactly where it began.
    slots:
      - revolutions
      - duration_seconds

  SerpentSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a living serpent: a segmented body that rests in
      the grass, head raised. Wishes about snakes, serpents, or
      something alive on the ground land here. Place it near cover
      (grass, a fallen log) for the garden to read as inhabited.
    slots:
      - x
      - y
      - serpent_kind
      - serpent_length
      - scale_r
      - scale_g
      - scale_b

  FallenTreeSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for deadwood: a fallen trunk, log, branch, or twigs
      resting on the ground. The fastest way to age a scene; a
      forest without deadwood looks like a showroom. Scatter a
      branch or two beside living trees.
    slots:
      - x
      - y
      - deadwood_kind
      - deadwood_length
      - bark_r
      - bark_g
      - bark_b

  TotemSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a carved wooden totem: stacked trunks standing on
      end, a made thing among grown things. Use it to mark a place -
      a clearing's center, a path's turn, a grave, a shrine.
    slots:
      - x
      - y
      - totem_size
      - totem_r
      - totem_g
      - totem_b

  PlanetSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for a small planet: a rust-warm sphere of bonded
      stones floating in the dark, the Little Prince's asteroid.
      This is the grandest wish in the vocabulary; grant it whole.
      with_rose plants a single red-crowned tree at the north pole;
      with_prince stands a small wanderer at the apex beside it.
      The void suits it: no ground needed, just a light to see by.
    slots:
      - x
      - y
      - planet_radius
      - planet_altitude
      - crust_r
      - crust_g
      - crust_b
      - with_rose
      - with_prince

  StarfieldSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for stars: points of light scattered through the dark
      around whatever exists. They glow without illuminating
      anything, so hundreds cost only pixels. Reach for this when
      the human asks for stars, a night sky, or space - and note
      the void does NOT come with them; they must be wished for.
    slots:
      - star_count
      - sky_distance
      - star_brightness

  DistantWorldSeed:
    is_a: WorldEntity
    annotations:
      facets: request
    description: >-
      Request for another world hanging in the distance: a coloured
      sphere too far to visit, for company in an empty sky. One
      particle each, so several make a crowded heaven. Give it a
      bearing with x and y, a height with world_height.
    slots:
      - x
      - y
      - world_height
      - world_size
      - world_r
      - world_g
      - world_b

# -------------------------------------------------------------------
# Slots
# -------------------------------------------------------------------

slots:
  sun_distance:
    range: float
    minimum_value: 40.0
    maximum_value: 400.0
    description: >-
      How far the sun stands, in meters. The view is orthographic, so
      distance decides whether it is ON SCREEN at all: the default 300
      is outside any frame, 45-70 puts the disc in view beside what
      you have made. Its apparent size and the light it casts do not
      change with distance - only whether the human can see it.
  star_count:
    range: integer
    minimum_value: 10
    maximum_value: 600
    description: >-
      How many stars. 150 reads as a good night; 500 as the desert
      sky you only get far from cities.
  sky_distance:
    range: float
    minimum_value: 15.0
    maximum_value: 140.0
    description: >-
      How far out the stars sit, in meters. The view is orthographic,
      so this is a REAL distance and not an infinite backdrop: past
      about 140 m they leave the frame entirely. 60 keeps them
      around whatever else exists.
  star_brightness:
    range: float
    minimum_value: 0.2
    maximum_value: 3.0
    description: Star glow. 1 is a clear night; 3 is a fairy tale.
  world_height:
    range: float
    minimum_value: -40.0
    maximum_value: 90.0
    description: Height of a distant world above the floor, in meters.
  world_size:
    range: float
    minimum_value: 0.5
    maximum_value: 15.0
    description: >-
      Radius of a distant world in meters. Read against its distance:
      3 at 60 m away is a moon, 12 is a neighbour that fills the sky.
  world_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Distant world colour, red channel (0..1).
  world_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Distant world colour, green channel (0..1).
  world_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Distant world colour, blue channel (0..1).
  planet_altitude:
    range: float
    minimum_value: 2.0
    maximum_value: 40.0
    description: >-
      Height of the planet's center above the void floor. Omit and
      it floats at radius + 2.5, clear of everything.
  crust_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Crust stone color, red channel (0..1). Omit for
      rust-warm earth.
  crust_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Crust stone color, green channel (0..1).
  crust_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Crust stone color, blue channel (0..1).
  with_rose:
    range: boolean
    description: Plant the single radiant flower at the north pole.
  with_prince:
    range: boolean
    description: Stand the small dreamer at the apex, beside his
      rose.
  serpent_kind:
    range: SerpentKind
    description: Which serpent. Omit for a garden snake.
  serpent_length:
    range: float
    minimum_value: 0.5
    maximum_value: 6.0
    description: >-
      Head-to-tail length in meters. Garden snakes read true at
      0.5-1; a python earns 3-6.
  scale_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Scale color, red channel (0..1). Omit for the
      kind's natural palette.
  scale_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Scale color, green channel (0..1).
  scale_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Scale color, blue channel (0..1).
  deadwood_kind:
    range: DeadwoodKind
    description: Trunk, log, branch, or twigs. Omit for a branch.
  deadwood_length:
    range: float
    minimum_value: 0.1
    maximum_value: 8.0
    description: Length along the ground in meters.
  bark_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Bark color, red channel (0..1). Omit for brown.
  bark_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Bark color, green channel (0..1).
  bark_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Bark color, blue channel (0..1).
  totem_size:
    range: float
    minimum_value: 0.4
    maximum_value: 2.0
    description: Base trunk size in meters; the stack scales with it.
  totem_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Wood color, red channel (0..1). Omit for dark wood.
  totem_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Wood color, green channel (0..1).
  totem_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Wood color, blue channel (0..1).
  revolutions:
    range: float
    minimum_value: 0.25
    maximum_value: 3.0
    description: >-
      Full turns of the view. 1 is a complete lap ending where it
      began; 0.5 shows the far side and stays there.
  duration_seconds:
    range: float
    minimum_value: 2.0
    maximum_value: 60.0
    description: >-
      How long the whole orbit takes. 12 reads cinematic; under 5
      feels like a whip.
  count:
    range: integer
    minimum_value: 1
    maximum_value: 12
    description: How many butterflies in this flock.
  wing_span:
    range: float
    minimum_value: 0.2
    maximum_value: 2.0
    description: Wingspan in meters. 0.5 is natural; 2.0 is a dream.
  wing_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Wing color, red channel (0..1). Omit for variety.
  wing_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Wing color, green channel (0..1).
  wing_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Wing color, blue channel (0..1).
  ground_width:
    range: float
    minimum_value: 2.0
    maximum_value: 200.0
    description: Ground slab width in meters (east-west).
  ground_depth:
    range: float
    minimum_value: 2.0
    maximum_value: 200.0
    description: Ground slab depth in meters (north-south).
  ground_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Ground color, red channel (0..1).
  ground_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Ground color, green channel (0..1).
  ground_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Ground color, blue channel (0..1).
  light_height:
    range: float
    minimum_value: 2.0
    maximum_value: 80.0
    description: >-
      Height of the light above the floor (m). Default 38 — above
      any canopy. Trees reach 30: keep lights higher or offset so
      the light disc never perches on a crown.
  brightness:
    range: float
    minimum_value: 0.05
    maximum_value: 1.0
    description: >-
      Relative brightness. 0.3 is a soft lamp over a corner; 0.8
      floods the whole stage. The host maps this to physical lumens.
  light_radius:
    range: float
    minimum_value: 10.0
    maximum_value: 500.0
    description: Light reach in meters. 300 covers the stage.
  light_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Light color, red channel (0..1). Default warm white.
  light_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Light color, green channel (0..1).
  light_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Light color, blue channel (0..1).
  x:
    range: float
    description: World-x position (m). Stage center is 0.
  y:
    range: float
    description: World-y position (m). Stage center is 0.
  grow_seconds:
    range: float
    minimum_value: 0.0
    maximum_value: 120.0
    description: >-
      0 (default) = the tree appears full-grown. Positive = a growth
      time-lapse; the tree rises from sapling to full height over
      this many seconds. 8-15 reads well on screen.
  trunk_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Trunk/bark color, red channel (0..1).
  trunk_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Trunk/bark color, green channel (0..1).
  trunk_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Trunk/bark color, blue channel (0..1).
  leaf_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Foliage color, red channel (0..1).
  leaf_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Foliage color, green channel (0..1).
  leaf_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Foliage color, blue channel (0..1).
  patch_width:
    range: float
    minimum_value: 0.5
    maximum_value: 30.0
    description: Grass patch width in meters (east-west extent).
  patch_depth:
    range: float
    minimum_value: 0.5
    maximum_value: 30.0
    description: Grass patch depth in meters (north-south extent).
  blade_count:
    range: integer
    minimum_value: 5
    maximum_value: 1000
    description: >-
      Number of grass blades in the patch. Bounded: enough for a
      lush patch, not enough to melt the frame budget.
  spread:
    range: GrassSpread
    description: Dab shape. SOFT (default) is the painter's splat.
  drop_height:
    range: float
    minimum_value: 0.0
    maximum_value: 60.0
    description: >-
      0 (default) = the rock rests where placed. Positive = the rock
      is BORN that many meters up and FALLS — impact shoves loose
      ground aside on layered terrain. 20-40 reads dramatic.
  blade_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Blade foliage color, red channel (0..1).
  blade_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Blade foliage color, green channel (0..1).
  blade_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Blade foliage color, blue channel (0..1).
  rock_size:
    range: float
    minimum_value: 0.2
    maximum_value: 6.0
    description: Rock characteristic size in meters.
  cloth_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Clothing color, red channel (0..1).
  cloth_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Clothing color, green channel (0..1).
  cloth_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Clothing color, blue channel (0..1).
  rock_r:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Rock base color, red channel (0..1).
  rock_g:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Rock base color, green channel (0..1).
  rock_b:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Rock base color, blue channel (0..1).
