id: https://logosphere.dev/eden/schema
name: eden
title: Eden - The Knowledge Garden
description: >-
  Game ontology for Eden, extending Logosphere's base types
  with narrative entities and mythological relationships.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  eden: https://logosphere.dev/eden/schema/
  logosphere: https://logosphere.dev/schema/
  malleus: https://malleus.dev/schema/

imports:
  - linkml:types
  - logosphere
  # Earth-like vocabulary (trees, grass, rock, small fauna) is a
  # SETTING PACK, not core. This game grows things, so it asks.
  - earth

# -------------------------------------------------------------------
# Enums
# -------------------------------------------------------------------

enums:
  EdenRelationType:
    description: Eden-specific relation types.
    permissible_values:
      BEARS:
        description: Tree bears fruit
      TEMPTS:
        description: Agent tempts another agent
      FOLLOWS:
        description: Agent follows another agent
      FORBIDS:
        description: Entity forbids an action or knowledge
      DESIRES:
        description: Agent desires entity or knowledge

  EdenEventType:
    description: Eden-specific event types.
    permissible_values:
      TEMPTATION:
        description: A temptation event occurs
      FALL:
        description: Loss of innocence
      EXPULSION:
        description: Exile from the garden

# -------------------------------------------------------------------
# Entity types
# -------------------------------------------------------------------

classes:
  Human:
    is_a: Humanoid
    description: A human being in the garden.
    slots:
      - innocence

  Serpent:
    is_a: Creature
    description: The serpent, agent of temptation.

  SerpentSegment:
    is_a: WorldEntity
    description: Individual body segment of a serpent chain.

  Fruit:
    is_a: WorldEntity
    description: Fruit borne by a tree.

  KnowledgeTree:
    is_a: Tree
    description: The tree of knowledge, bearing forbidden fruit.

  Knowledge:
    is_a: Entity
    description: Abstract knowledge entity.

  Garden:
    is_a: WorldEntity
    description: The garden location.

  RoomBlock:
    is_a: Structure
    description: Structural block forming a room.

  Cube:
    is_a: WorldEntity
    description: Simple test cube entity.
    mixins:
      - HasMaterial
      - HasSimpleAppearance

# -------------------------------------------------------------------
# Eden relations
# -------------------------------------------------------------------

  EdenRelation:
    abstract: true
    is_a: Relation
    description: >-
      Abstract parent of Eden's relations. One concrete subclass per
      member of EdenRelationType, each pinning its predicate. A game
      schema declares these the same way the engine root does: a
      relation class that leaves relation_type open across an enum is a
      family and not a relation, and its endpoints cannot be checked.
    slot_usage:
      relation_type:
        range: EdenRelationType

  # Endpoints stay at Entity. Eden creates three of these five, all in
  # one place (main.cpp), and the classes on either side are engine
  # types rather than Eden types, so there is nothing Eden-specific to
  # narrow to. FORBIDS and DESIRES have no creation site at all.

  BearsRelation:
    is_a: EdenRelation
    description: A tree bears fruit.
    slot_usage:
      relation_type:
        range: EdenRelationType
        required: true
        equals_string: BEARS

  TemptsRelation:
    is_a: EdenRelation
    description: An agent tempts another agent.
    slot_usage:
      relation_type:
        range: EdenRelationType
        required: true
        equals_string: TEMPTS

  FollowsRelation:
    is_a: EdenRelation
    description: An agent follows another agent.
    slot_usage:
      relation_type:
        range: EdenRelationType
        required: true
        equals_string: FOLLOWS

  ForbidsRelation:
    is_a: EdenRelation
    description: An entity forbids an action or knowledge.
    slot_usage:
      relation_type:
        range: EdenRelationType
        required: true
        equals_string: FORBIDS

  DesiresRelation:
    is_a: EdenRelation
    description: An agent desires an entity or knowledge.
    slot_usage:
      relation_type:
        range: EdenRelationType
        required: true
        equals_string: DESIRES

# -------------------------------------------------------------------
# Eden events
# -------------------------------------------------------------------

  EdenEvent:
    is_a: Event
    description: Eden narrative event.
    slot_usage:
      event_type:
        range: EdenEventType

# -------------------------------------------------------------------
# Slots
# -------------------------------------------------------------------

slots:
  innocence:
    range: float
    description: Level of innocence (1.0 = pure, 0.0 = fallen).
