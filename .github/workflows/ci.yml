name: CI

on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------------------
  # Linux: headless-physics profile (core + physics + dynamics + worldgen,
  # no rendering / GLFW / Metal). Builds the solver, gluons, locomotion and
  # runs the physics smoke tests on every PR — the engine's hardest-won
  # correctness, previously guarded only by manual macOS runs.
  # ---------------------------------------------------------------------------
  physics-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure (headless-physics)
        run: |
          cmake -S . -B build -G Ninja \
            -DLOGOSPHERE_PROFILE=physics \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build core + physics + dynamics + worldgen
        run: cmake --build build -j $(nproc)

      - name: Run physics smoke tests
        run: |
          set -e
          for t in test_humanoid_headless test_pin_gluon_lifecycle; do
            echo "=== $t ==="
            ./build/$t
          done

      - name: Run locomotion guard suite (render-free Engine)
        run: ./build/logosphere-physics-guards

      - name: Run engine-infra regressions
        run: ./build/test_deep_probe_halt

  # ---------------------------------------------------------------------------
  # Linux: all CTest-registered headless tests. This is the gating CI for PRs.
  # ---------------------------------------------------------------------------
  headless-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure (headless-only)
        run: |
          cmake -S . -B build -G Ninja \
            -DLOGOSPHERE_HEADLESS_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build logosphere_core + headless tests
        run: cmake --build build -j $(nproc)

      # Every test registered in this profile, through ctest.
      # Deliberately NOT a hand-maintained list: the list this replaced
      # had gone stale, so tests added after it was written were built
      # but never run and the gate silently checked compilation alone.
      # A new add_headless_test() is gated the moment it exists.
      - name: Run headless test suite
        working-directory: build
        run: ctest --output-on-failure -j $(nproc)

      - name: Install package to a prefix
        run: cmake --install build --prefix "$PWD/_install"

      - name: Build + run external consumer against the install
        run: |
          cmake -S examples/consumer-smoke -B build-consumer \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/_install" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer
          ./build-consumer/consumer-smoke

  # ---------------------------------------------------------------------------
  # macOS: full engine (Metal, GLFW, physics, examples). Free on public
  # repositories; advisory (not merge-blocking) while runtimes settle.
  # ---------------------------------------------------------------------------
  full-macos:
    if: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with: { environment-file: environment.yml }

      - name: Install system libraries
        run: brew install glfw

      - name: CMake configure & build
        run: |
          cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES="arm64"
          cmake --build build --config Release

      - name: Run unit tests
        timeout-minutes: 1
        run: ./build/logosphere-tests --test

  # ---------------------------------------------------------------------------
  # Windows: headless subset under MSVC. Verifies the core profile is the
  # portable C++17 it claims to be (issue #7). Advisory: not merge-blocking
  # until it has a green track record.
  # ---------------------------------------------------------------------------
  headless-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (headless-only, MSVC)
        run: cmake -S . -B build -DLOGOSPHERE_HEADLESS_ONLY=ON

      - name: Build logosphere_core + headless tests
        run: cmake --build build --config Release -j 4

      - name: Run headless test suite
        run: ctest --test-dir build -C Release --output-on-failure
