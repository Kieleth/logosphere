name: CI

# Pull requests are the gate, so the matrix runs on the PR ref. Pushes are
# only watched on main, which keeps the release branch guarded without
# firing a second identical matrix for every branch push behind a PR.
#
# NOT EVERY JOB RUNS ON EVERY EVENT, and the split is measured rather than
# felt. Seven jobs used to run on every pull request and two of them gate a
# merge. The required gate took 26.5 minutes and the three advisory lanes
# were the reason:
#
#   headless-windows   25-28 min   advisory
#   sanitizers-linux   17-26 min   advisory
#   full-macos         10-13 min   advisory
#
# They now run on main and on a nightly, where a finding is exactly as loud
# and blocks nobody's merge. Each job carries the `if:` that says so, next
# to the reason.
on:
  push:
    branches: [main]
  pull_request:
  # Nightly, for headless-windows specifically. It has the strongest
  # measured case for existing and the weakest case for standing in front
  # of a merge: in a ten-day window it went red 67 times across six
  # distinct root causes, and on 51 of the 53 test-class failures
  # headless-linux was GREEN on the same commit. It sees what nothing else
  # sees. It does not need to see it before a merge.
  schedule:
    - cron: '17 4 * * *'

# One live run per PR (or per main push). A force-push supersedes its own
# earlier run instead of leaving it to burn a runner to completion. main is
# exempt from cancellation: every commit that lands there keeps its own
# verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Git integration policy. The only lane here that is not about whether the
  # code works: it is about whether the branch is honest about what it changes.
  #
  # A branch that reverts main still compiles and its tests still pass, so
  # every other job in this file stays green while merged work is being
  # deleted. That happened here: three merged pull requests were undone by a
  # rebased branch and nothing in CI noticed. This job is the thing that
  # notices.
  # ---------------------------------------------------------------------------
  merge-policy:
    # Everything except the nightly, which exists for headless-windows.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A hook without the executable bit is silently ignored by git. That
      # is a failure mode with no symptom, so it gets a test.
      - name: Hooks are present and executable
        run: |
          set -e
          for h in .githooks/pre-rebase .githooks/pre-push; do
            test -f "$h" || { echo "MISSING $h"; exit 1; }
            test -x "$h" || { echo "NOT EXECUTABLE (git will ignore it): $h"; exit 1; }
          done
          test -x scripts/check-merged-work-deletion.sh
          test -x scripts/install-git-hooks.sh
          test -x scripts/test-merged-work-deletion.sh
          test -x scripts/test-pre-push-hook.sh
          test -x scripts/check-signoff.sh
          test -x scripts/test-signoff-on-main.sh
          test -x scripts/test-posix-portability.sh
          test -x scripts/test-sanitizer-audit.sh
          # And it refuses. An unconditional hook that returns 0 is a decoration.
          if .githooks/pre-rebase origin/main test-branch >/dev/null 2>&1; then
            echo "pre-rebase exited 0. It must refuse unconditionally."
            exit 1
          fi
          echo "hooks present, executable, and refusing"

      # A guard that never fires and a guard that always fires are the same
      # colour in CI. This builds a throwaway repo and asserts both
      # directions, control included.
      - name: The merged-work detector is not vacuous
        run: ./scripts/test-merged-work-deletion.sh

      # And the hook that calls it actually refuses a real `git push` to a
      # real remote: push to main, force-push, and a stale branch that
      # reverts main. The last one got through the first version of the
      # hook, so it has a permanent case here.
      - name: The pre-push hook refuses what it claims to
        run: ./scripts/test-pre-push-hook.sh

      # The sign-off gate moved off pull requests and onto main (see
      # .github/workflows/dco.yml for why). It therefore no longer runs on
      # anything a contributor can see before merging, which makes it
      # exactly the kind of check that can rot unnoticed. This is the lane
      # that keeps it honest: twelve cases in a throwaway repository,
      # accept and refuse both asserted, including the case the gate
      # exists for (a squash message hand-edited in the merge box, with
      # the trailer deleted along with the commit log).
      - name: The sign-off gate is not vacuous
        run: ./scripts/test-signoff-on-main.sh

      - name: This branch deletes no work merged after it started
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          ./scripts/check-merged-work-deletion.sh \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      # ---------------------------------------------------------------------
      # The half of headless-windows that does not need Windows.
      #
      # That lane came off pull requests because it costs 25 to 28 minutes
      # (see the `on:` block). Four of the six root causes it found in ten
      # days were not behaviour differences at all — they were constructs
      # MSVC does not ship, sitting in the source: <execinfo.h>,
      # setenv/unsetenv, <sys/wait.h> with fork(), and a literal "/tmp"
      # path in a test. Each took a full Windows run to surface and a
      # second to see once seen.
      #
      # This is that second, on every pull request. It scans exactly the
      # translation units the `core` profile configures plus every in-repo
      # header they reach, taken from compile_commands.json so it cannot go
      # stale, and it reports only UNGUARDED uses: __has_include and the
      # POSIX side of a _WIN32 conditional are the fixes, not findings.
      #
      # It is not a replacement. The other two root causes were real
      # behaviour differences (a destroyed small string MSVC zeroes and
      # libc++ does not, and a timeout) and no static check can see those.
      # ---------------------------------------------------------------------
      - name: The POSIX-portability gate is not vacuous
        run: ./scripts/test-posix-portability.sh

      # The sanitizer lane's "red means new" gate lives on a lane that
      # only runs on main, so its proof lives here, where every pull
      # request sees it. Six cases against the shipped audit file,
      # including the two that matter: a tenth red must fire, and an
      # audited red that goes quiet must fire too.
      - name: The sanitizer audit is not vacuous
        run: ./scripts/test-sanitizer-audit.sh

      - name: Core-profile sources carry no unguarded POSIX-only construct
        run: |
          set -e
          command -v cmake >/dev/null || {
            sudo apt-get update && sudo apt-get install -y cmake g++
          }
          cmake -S . -B build-portability \
            -DLOGOSPHERE_PROFILE=core \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON >/dev/null
          python3 scripts/check-posix-portability.py \
            --compile-commands build-portability/compile_commands.json

  # ---------------------------------------------------------------------------
  # Ontology generation: schema import safety, vendored generator integrity,
  # and committed-output drift. Uses the same pinned environment developers use.
  # ---------------------------------------------------------------------------
  ontology-generation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up generator environment
        uses: conda-incubator/setup-miniconda@v3
        with: { environment-file: environment.yml }

      # The generator now refuses to run outside the environment this
      # file declares (scripts/env_gate.py). That gate stands in front of
      # the step that writes committed source, so a false refusal would
      # stop this lane: it is asserted in both directions, on the exact
      # version string the dev machine reported while the drift was live.
      # The wiring case matters most — a gate generate_ontology.py stops
      # calling would pass every other test and protect nothing.
      - name: The declared-environment gate is not vacuous
        run: python -m unittest scripts/test_env_gate.py

      - name: Run generator contract tests
        run: python -m unittest scripts/test_generate_registry.py

      # The schema contracts malleus cannot check for us. Its rites ask
      # two of these three questions and ask them well, but only of
      # schemas its inspector can LOAD, and this repo's packs import by
      # bare name so several need an explicit import map and had never
      # been judged at all. ServiceTerm sat in exactly that gap with an
      # open event_type. This audit reads the YAML directly and asks
      # every schema, loadable or not.
      - name: Run schema contract audit
        run: python -m unittest scripts/test_schema_contracts.py

      # The seed extractors have contract tests too, and nothing ran
      # them. Written when the career extractor was, never wired up.
      - name: Run seed extractor contract tests (logovger)
        run: python -m unittest discover -s examples/logovger/tools -p 'test_*.py'

      # A corpus belongs to no game, so neither does the check that its
      # bytes survive a checkout. It used to live in one game's tools/.
      - name: Vendored corpora keep their Git object line endings
        run: python -m unittest scripts/test_corpus_checkout_contract.py

      # A game compiles its own files, the engine's, and the corpora it
      # declares. Nothing else. Cepheus chargen is frozen and its
      # successor is written beside it, so an include reaching across
      # has to fail somewhere; here is somewhere. The text half runs
      # in this lane because it needs no build. The half that reads what
      # the COMPILER opens runs in headless-linux, where one exists.
      - name: No game reads another game's files (text)
        run: python scripts/check_game_isolation.py

      # A gate nobody has watched fail is a gate nobody knows is
      # connected. This breaks each rule in a scratch repository and
      # requires a refusal, including the case where the checker sees no
      # translation unit at all and would otherwise pass for the wrong
      # reason.
      - name: The isolation gate is not vacuous
        run: python -m unittest scripts/test_check_game_isolation.py

      - name: Regenerate ontology outputs
        run: python scripts/generate_ontology.py

      # The same gate, for the other family of generated files. Seeds
      # marked "generated_by" are their extractor's output; two PRs
      # hand-edited one because nothing said so and nothing checked.
      # Regenerating it would have dropped fifteen ops in silence.
      - name: Regenerate rule seeds from the vendored SRD (logovger)
        run: ./examples/logovger/tools/regenerate_seeds.sh

      # Same gate, second game. A generated seed that no lane
      # regenerates is a generated seed nobody can tell has been hand
      # edited, and the rule is about generated seeds rather than about
      # the game that happened to have one first.
      - name: Regenerate rule seeds from the vendored SRD (voyager)
        run: ./examples/voyager/tools/regenerate_seeds.sh

      # `git diff` is blind to files that did not exist before it ran, so
      # a NEW schema emits new generated output and this step stays green
      # while that output sits uncommitted. Measured on a fresh pack:
      # `git diff --exit-code` returned 0 with three untracked generated
      # files present. The untracked check is the half that catches it.
      - name: Reject generated-output drift
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain -uall)" ]; then
            echo "generated output is untracked or unstaged:"
            git status --porcelain -uall
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Linux: headless-physics profile (core + physics + dynamics + worldgen,
  # no rendering / GLFW / Metal). Builds the solver, gluons, locomotion and
  # runs the physics smoke tests on every PR — the engine's hardest-won
  # correctness, previously guarded only by manual macOS runs.
  # ---------------------------------------------------------------------------
  physics-linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure (headless-physics)
        run: |
          cmake -S . -B build -G Ninja \
            -DLOGOSPHERE_PROFILE=physics \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build core + physics + dynamics + worldgen
        run: cmake --build build -j $(nproc)

      - name: Run physics smoke tests
        timeout-minutes: 10
        run: |
          set -e
          for t in test_humanoid_headless test_pin_gluon_lifecycle \
                   test_refused_momentum_ledger \
                   test_orientation_truth test_angular_dissipation; do
            echo "=== $t ==="
            ./build/$t
          done

      # Born-red ladders, tracked in BOTH directions. Red is the audited
      # state (TEST_AUDIT expect=fail): a ladder that silently goes GREEN
      # means either a mechanism landed without moving it to the smoke
      # list above, or someone weakened an assertion. Both fail CI loudly.
      - name: Run physics ladders (born-red, direction-locked)
        timeout-minutes: 10
        run: |
          # test_inv6_gravity_blindness: audited expect=fail since
          # 2026-08-26 (a G-48 flip mole: per-axis press asymmetries
          # under item 6's default torque; the cure exists behind the
          # statics levers, direction-locked on the deferred flip
          # ruling). It moves back to the smoke list when the flip
          # lands and TEST_AUDIT says pass again.
          for t in test_cube_drop_ladder test_ramp_race \
                   test_inv6_gravity_blindness; do
            echo "=== $t (audited: expect RED) ==="
            if ./build/$t; then
              echo "::error::$t went GREEN but TEST_AUDIT says expect=fail."
              echo "If the mechanism landed: update tests/invariants/TEST_AUDIT.jsonl"
              echo "and promote the test to the smoke list. If not: an assertion"
              echo "was weakened, which the ladder discipline forbids."
              exit 1
            fi
          done

      - name: Run locomotion guard suite (render-free Engine)
        run: ./build/logosphere-physics-guards

      - name: Run engine-infra regressions
        run: ./build/test_deep_probe_halt

  # ---------------------------------------------------------------------------
  # Linux: all CTest-registered headless tests. This is the gating CI for PRs.
  # ---------------------------------------------------------------------------
  headless-linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure (headless-only)
        run: |
          # compile_commands.json so the isolation gate can ask the
          # compiler what each game's translation units actually open,
          # rather than asking the source what it claims.
          cmake -S . -B build -G Ninja \
            -DLOGOSPHERE_HEADLESS_ONLY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build logosphere_core + headless tests
        run: cmake --build build -j $(nproc)

      # The strong half of the isolation gate: every translation unit
      # under examples/ re-run through the preprocessor's dependency
      # mode, with the rule that its header closure may not contain
      # another game's file, and that it may not even carry an include
      # path into one. Repo-wide and unregistered: a game added tomorrow
      # is covered the moment it has a translation unit.
      - name: No game compiles another game's files
        run: |
          python3 scripts/check_game_isolation.py \
            --compile-commands build/compile_commands.json

      # Every test registered in this profile, through ctest.
      # Deliberately NOT a hand-maintained list: the list this replaced
      # had gone stale, so tests added after it was written were built
      # but never run and the gate silently checked compilation alone.
      # A new add_headless_test() is gated the moment it exists.
      - name: Run headless test suite
      # Raised with the Windows cap and for the same measured reason: the
      # exact-evidence migration multiplied seed volume and test_chargen
      # went 109s -> 275s on the dev machine. This step was killed at
      # exactly 10:12 against a 10 minute cap with the build green, which
      # is indistinguishable in CI from a real failure.
        timeout-minutes: 30
        working-directory: build
        run: ctest --output-on-failure -j $(nproc)

      # ctest proves the rules behave. It does not prove the binary that
      # plays them can finish a life. Those are different failures: a
      # driver that leaves a rule's printed fork unanswered ends the run
      # right there, and 19 seeds in 200 did exactly that while every
      # test stayed green. Only a sweep sees it.
      # SIXTY, and the number is argued rather than picked. Each life is
      # its own process and reloads and re-verifies the whole rule graph,
      # so a life costs about 1.5s: 200 of them ran past a five-minute
      # cap on the dev machine before CI's slower hardware was even
      # involved, which is how this step first failed.
      #
      # Sixty is enough because of what this gate is FOR. It proves the
      # BINARY and its driver wiring can carry a life to the end. It is
      # not the rule-space sweep; test_chargen already plays 288 lives
      # in-process, loading the graph once. Against the 9.5% abort rate
      # this was built to catch, sixty lives miss it 0.25% of the time,
      # and a rarer failure is the in-process sweep's job to find.
      - name: Play 60 lives end to end
      # Each life reloads and re-verifies the whole rule graph, and the
      # graph is what just grew, so this scales with the same factor.
        timeout-minutes: 20
        run: |
          # In parallel, because each life is its OWN PROCESS and they
          # share nothing: a seed decides the whole run, and the tape and
          # transcript are named after it. Serial, this was the single
          # most expensive step in the gating lane. Measured on the dev
          # machine after the digest fix: 190s serial, 99s at -P2 (a CI
          # runner's core count), 31s at -P8.
          #
          # Each life writes its OWN transcript. It used to write them all
          # to one /tmp/life.txt, which was harmless while this ran one at
          # a time and would have interleaved sixty processes into garbage
          # the moment it did not.
          failed=$(seq 1 60 | xargs -P "$(nproc)" -I{} sh -c \
            './build/logovger-headless --random {} >/tmp/life-{}.txt 2>&1 \
             || echo {}' | sort -n | tr '\n' ' ')
          if [ -n "$failed" ]; then
            echo "lives that never finished: $failed"
            set -- $failed
            echo "--- seed $1, in full ---"
            tail -20 "/tmp/life-$1.txt"
            exit 1
          fi
          echo "60 lives, none abandoned"

      - name: Install package to a prefix
        run: cmake --install build --prefix "$PWD/_install"

      - name: Build + run external consumer against the install
        run: |
          cmake -S examples/consumer-smoke -B build-consumer \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/_install" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer
          ./build-consumer/consumer-smoke

  # ---------------------------------------------------------------------------
  # Linux: the same headless profile under AddressSanitizer and
  # UndefinedBehaviorSanitizer.
  #
  # WHY THIS LANE EXISTS. A use-after-lifetime bug shipped and sat
  # undetected on every platform CI runs. find_choice returned a pointer
  # INTO choices_, callers cleared choices_, and the answer was read
  # afterwards. libc++ and libstdc++ leave a cleared vector's bytes where
  # they were, so Linux and macOS were green for as long as those were the
  # only compilers in play; MSVC zeroes a destroyed small string, so
  # everyone who submitted to the Draft quietly became a Drifter and
  # headless-windows went red for a reason no lane could explain. Nothing
  # in this file could see it. ASan saw it in one run, as a
  # container-overflow with a line number (fixed in a7870c5, #132).
  #
  # A test suite answers "does the code do the right thing". This answers
  # "is the code allowed to do it at all", and those are different
  # questions. It is the only lane here that asks the second one.
  #
  # PROFILE: core. Two reasons, and the first is the one that matters.
  # The code that had the bug (examples/logovger/chargen) is compiled and
  # run by this profile and no other, so this is where the sanitizer's
  # value actually is. It is also the cheapest profile: no GLFW, no Metal,
  # no Objective-C++, nothing that needs a display.
  #
  # ADVISORY, not merge-blocking. It is not in the required contexts on
  # main, which is deliberate and matches full-macos: a sanitizer finding
  # should be loud and visible rather than hidden, without holding up
  # somebody else's unrelated merge.
  #
  # MEASURED COST (dev machine, AppleClang, 16 cores, against Release):
  #   build                     770s CPU / 80s wall
  #   ctest minus test_chargen  13s wall at -j4, 32s CPU
  #   12 sanitized lives        102s wall, 8.5s each
  #   test_chargen              565s, against 74s unsanitized. 7.6x.
  # The sanitizers cost between 5.5x and 7.6x here, not the 2x they are
  # usually quoted at. On the runner a life costs about 30s, so 12 of them
  # is roughly 6 minutes.
  #
  # TOOLCHAIN: clang AND libc++, both of them load-bearing, and the first
  # version of this lane had neither.
  #
  # It was written with the runner's default g++ and libstdc++, it went
  # green, and green was worth nothing: measured against both bugs this
  # lane exists to catch, that toolchain reports neither. The standard
  # library is half of ASan. Container overflow is detected through
  # annotations the library itself emits around its buffers, and libc++
  # emits them where libstdc++ does not; use-after-scope is the
  # compiler's, and clang instruments it where gcc does not, at -O0, -O1
  # and -O2 alike and with -fsanitize-address-use-after-scope passed
  # explicitly.
  #
  # Measured on the two real bugs, not on a hypothetical:
  #
  #                          | #132 container-overflow | use-after-scope
  #   gcc 13  + libstdc++    |         MISS            |     MISS
  #   clang 18 + libstdc++   |         MISS            |     CATCH
  #   clang 18 + libc++      |         CATCH           |     CATCH
  #
  # The first row is what this lane shipped as for one CI run. It built
  # 313 targets, ran 89 tests, played 12 lives, reported success, and
  # would have let #132 through exactly as every other lane did.
  # ---------------------------------------------------------------------------
  sanitizers-linux:
    # PUSHES TO MAIN ONLY. Measured 17 to 26 minutes, and it is already
    # advisory: a lane that blocks nothing has no argument for standing in
    # front of a merge. The finding still lands within minutes of the
    # squash, on the commit that caused it, which is what "loud" needed to
    # mean and did not.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # A stack trace with a line number, or the report is a puzzle.
      UBSAN_OPTIONS: print_stacktrace=1
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      # libc++ is not optional here. See the table above: with libstdc++
      # this lane does not see the bug it was built for.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev

      # RelWithDebInfo, not Debug: the reports need symbols and line
      # numbers, and the tests need to finish. -fno-sanitize-recover=all
      # makes UBSan abort on the first finding instead of printing it and
      # carrying on, which is the difference between a gate and a log.
      - name: Configure (core profile, clang + libc++, ASan + UBSan)
        run: |
          cmake -S . -B build-san -G Ninja \
            -DLOGOSPHERE_PROFILE=core \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -stdlib=libc++"

      # 15 rather than the 10 the test steps use, and the number is
      # measured: the g++ build of this same profile took 8m46s on this
      # runner, 88% of a 10-minute cap, and a build that fails on the cap
      # reports as a lane failure indistinguishable from a real finding.
      # A compile is not a test; the cap here is a runaway guard, not a
      # performance budget.
      - name: Build logosphere_core + headless tests
        timeout-minutes: 15
        run: cmake --build build-san -j $(nproc)

      # EXCLUDED, and named rather than dropped quietly: test_chargen.
      #
      # It plays 288 lives in one process and costs 565s under the
      # sanitizers against 74s without them, measured on hardware faster
      # than this runner. It would blow the 10-minute cap on its own and
      # tell us nothing the next step does not.
      #
      # What it would have covered is covered, by the step below: the
      # translation unit that had the bug is examples/logovger/chargen,
      # and logovger-headless compiles and runs the same file. A memory
      # error on the chargen path shows on the first life that walks it,
      # not on the 288th. test_chargen still runs unsanitized in
      # headless-linux, where it is the rule-space sweep it was built to
      # be.
      #
      # Everything else in the profile runs here: 97 tests, read off the
      # runs. (The comment said 89 and had been overtaken by the tests
      # added since.)
      #
      # NINE of them are red on every run and every one of them is
      # audited by name in tests/invariants/SANITIZER_AUDIT.jsonl. This
      # step is therefore NOT the verdict — the audit step at the end of
      # the job is, and it compares the failing set against the audited
      # set in both directions. `continue-on-error` rather than `|| true`:
      # the step keeps its own colour in the UI and the shell's exit code
      # is not swallowed on the way past.
      #
      # The exit code is recorded beside the log because CTest writes
      # LastTestsFailed.log ONLY when something failed. An absent log
      # therefore means one of two opposite things — everything passed, or
      # the step died before finishing — and the audit must not confuse
      # them.
      - name: Run headless test suite under the sanitizers (minus test_chargen)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: build-san
        run: |
          set +e
          ctest --output-on-failure -j $(nproc) -E '^test_chargen$'
          code=$?
          mkdir -p Testing/Temporary
          echo "$code" > Testing/Temporary/ctest.exit
          exit $code

      # TWELVE lives, and the number is argued rather than picked.
      #
      # A sanitized life costs 8.5s here against 1.5s clean, so the 60
      # that headless-linux plays would cost around 500s on this runner
      # and probably more. Twelve is what fits with room to spare.
      #
      # Twelve is enough because of what this step is FOR. It is not the
      # rule-space sweep (headless-linux plays 60 unsanitized, and
      # test_chargen plays 288 in-process); it is a walk down the chargen
      # code path with the sanitizers watching, and a lifetime error there
      # is deterministic once the path is walked at all. Measured on seeds
      # 1 through 12: three reach the Draft branch and four the Drifter
      # branch, which is both sides of the exact fork the shipped bug
      # corrupted.
      #
      # `if: always()` because without it this step is SKIPPED whenever
      # ctest above goes red, and the chargen path is then not walked at
      # all. That is how it behaved on its first red run: one failing
      # test silently took the whole reason this lane exists off the
      # board. A lane that stops reporting the moment it has something to
      # report is worse than no lane.
      - name: Play 12 lives under the sanitizers
        if: always()
        timeout-minutes: 10
        run: |
          # Parallel for the same reason as the gating lane's sixty. These
          # already wrote per-seed transcripts, so only the loop changes.
          failed=$(seq 1 12 | xargs -P "$(nproc)" -I{} sh -c \
            './build-san/logovger-headless --random {} >/tmp/life-{}.txt 2>&1 \
             || echo {}' | sort -n | tr '\n' ' ')
          if [ -n "$failed" ]; then
            echo "lives that aborted under the sanitizers: $failed"
            set -- $failed
            echo "--- seed $1, in full ---"
            cat "/tmp/life-$1.txt"
            exit 1
          fi
          echo "12 lives, none aborted"

      # ---------------------------------------------------------------------
      # THE VERDICT. Nine tests fail here on every run, and nine is not a
      # number anyone reads: a tenth appearing — the entire reason this
      # lane exists — looked exactly like the nine, because a red job is a
      # red job. This step ends that. It compares the failing set against
      # tests/invariants/SANITIZER_AUDIT.jsonl and fails on ANY difference:
      # a red with no audited entry (a new memory error), and an audited
      # entry that stopped reporting (fixed, or the test stopped running).
      #
      # The same direction-locking physics-linux applies to its born-red
      # ladders, for the same reason: a red that silently goes green is as
      # much a change as a new one.
      #
      # `if: always()` because a step that only reports when the steps
      # before it were green cannot be the verdict on a lane that is red
      # by construction.
      # ---------------------------------------------------------------------
      - name: Red means NEW — the failing set is the audited set
        if: always()
        run: |
          python3 scripts/check-sanitizer-audit.py \
            --last-failed build-san/Testing/Temporary/LastTestsFailed.log \
            --ctest-exit  build-san/Testing/Temporary/ctest.exit

  # ---------------------------------------------------------------------------
  # macOS: full engine (Metal, GLFW, physics, examples). Free on public
  # repositories; advisory (not merge-blocking) while runtimes settle.
  # ---------------------------------------------------------------------------
  full-macos:
    # PUSHES TO MAIN ONLY. 10 to 13 minutes, advisory, and expected red
    # (see the engine-tests step below): it cannot gate anything today, so
    # every minute it spent on a pull request was pure delay.
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # No conda here. setup-miniconda only puts condabin on PATH for
      # non-login shells, so the pinned env was never active for the build:
      # cmake came from the runner image and no build step runs python.
      # The ontology-generation lane (which does use the env, via a login
      # shell) still covers the generator contract.
      - name: Install system libraries
        run: brew install glfw

      - name: CMake configure & build
        run: |
          cmake -S . -B build \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(sysctl -n hw.ncpu)

      # The isolation gate again, over the WINDOWED game targets. This
      # is the only lane that compiles them, so it is the only lane that
      # can see an include reaching across there. 223 translation units
      # against headless-linux's 82, measured on the dev machine.
      - name: No game compiles another game's files (windowed targets)
        run: |
          python3 scripts/check_game_isolation.py \
            --compile-commands build/compile_commands.json

      - name: Run unit tests
        timeout-minutes: 1
        run: ./build/logosphere-tests --test

      # Engine tests that NO lane ran. They are macOS-only (Cocoa,
      # Metal, a real Engine), so this is the only lane that can, and
      # they were compiled on every build and executed by nothing. Both
      # had been failing on main for as long as anyone can tell, which
      # is what "main is green" was actually worth.
      #
      # EXPECTED RED, deliberately. test_humanoid_terrain_scenarios
      # fails three litter-underfoot cases: a walker over ground for 27%
      # to 40% of a path that should be 100%. That is locomotion and
      # belongs to whoever owns the physics work. Hiding it until they
      # get to it is exactly how it stayed hidden. This lane is advisory
      # and not a required check, so the red is loud without blocking
      # anyone's merge.
      #
      # Add tests here as they earn it. Anything macOS-only that nothing
      # else runs belongs in this list, not in a comment saying it
      # should be.
      - name: Run engine tests no other lane covers
        timeout-minutes: 15
        run: |
          failed=""
          for t in test_determinism_guards test_humanoid_terrain_scenarios; do
            echo "=== $t ==="
            ./build/$t || failed="$failed $t"
          done
          if [ -n "$failed" ]; then
            echo "engine tests failing:$failed"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Windows: headless subset under MSVC. Verifies the core profile is the
  # portable C++17 it claims to be (issue #7). Advisory: not merge-blocking
  # until it has a green track record.
  # ---------------------------------------------------------------------------
  headless-windows:
    # PUSHES TO MAIN AND THE NIGHTLY. The slowest lane in the file at 25
    # to 28 minutes and the single largest term in a 26.5 minute required
    # gate. Kept rather than dropped, and the evidence is in the `on:`
    # block: 67 reds in ten days across six root causes, with
    # headless-linux green on the same commit 51 times out of 53. What
    # changes is only WHEN it reports.
    #
    # Four of those six root causes were POSIX constructs MSVC does not
    # have, and those are now caught on every pull request by the static
    # check in merge-policy, in under a second, without a Windows runner.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (headless-only, MSVC)
        run: cmake -S . -B build -DLOGOSPHERE_HEADLESS_ONLY=ON

      - name: Build logosphere_core + headless tests
        run: cmake --build build --config Release -j 4

      - name: Run headless test suite
      # 30, and the number is measured rather than padded. The exact-evidence
      # migration multiplied the seed volume: test_chargen went from 109s to
      # 275s on the dev machine for the same suite, a 2.5x. Windows was
      # already the slowest lane at 210s for that one test, so 2.5x puts the
      # suite past a 15 minute cap. Measured: the step was killed at exactly
      # 15:00 with the build green, which reports identically to a real test
      # failure and is the reason this is a cap and not a bug.
        timeout-minutes: 30
        run: ctest --test-dir build -C Release --output-on-failure
