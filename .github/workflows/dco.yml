name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  signoff:
    name: sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "MISSING sign-off: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "All commits must be signed off (git commit -s)."
            echo "See CONTRIBUTING.md, Developer Certificate of Origin."
            exit 1
          fi
          echo "All commits signed off."
