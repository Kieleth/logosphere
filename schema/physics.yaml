id: https://logosphere.dev/schema/physics
name: physics
title: Logosphere Physics Layer Ontology
description: >-
  The physics layer described in LinkML: the concepts a reader learns the
  solver from, the invariant record format the campaign's INVARIANTS.jsonl
  rows validate against, and the constants registry that INV-29 turns into
  the engine's build-time inputs.

  STANDALONE BY DESIGN. This schema is a separate root and must NEVER be
  imported into schema/logosphere.yaml or any game schema. Nothing here is
  a KG entity type: createEntity("ContactRow") must never work. The KG
  ontology describes the world a game populates; this file describes the
  machine that simulates it. The only executable artifact generated from
  it is src/generated/physics_constants.h (constants registry, INV-29).
  It imports linkml:types only — the malleus identity/temporal mixins are
  for enduring world entities, which these concepts are not.
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  physics: https://logosphere.dev/schema/physics/

imports:
  - linkml:types

subsets:
  concept:
    description: >-
      Documentation concepts. Abstract, never instantiated, generate no
      code. Their descriptions are the deliverable: a reader who knows
      C++ but not this engine learns the physics layer from them.
  constants_registry:
    description: >-
      The INV-29 registry. Each class in this subset is a GROUP of
      engine constants; each attribute is one constant. The modeling
      convention: attribute name = constant name, ifabsent = the value,
      unit.ucum_code = the unit, description = the documentation
      (carrying the RCA where the solver comments held one), and an
      optional cpp_type annotation when the C++ type is not the natural
      mapping (float->float, integer->int, boolean->bool). The
      header-only generator mode in scripts/generate_ontology.py walks
      this subset in file order and emits every attribute as a
      constexpr in namespace PhysicsV4 in
      src/generated/physics_constants.h. Values changed here are engine
      retuning and are a separate effort from code changes (INV-29):
      never adjust a value in the same commit that touches the code
      consuming it.

# ===================================================================
# SECTION 1 — CONCEPTS
# The physics layer, one definition at a time. Bodies and state,
# constraints, contact geometry, the boundary, the processes that run
# each frame, and the instruments that watch them.
# ===================================================================

enums:
  SolverMode:
    description: >-
      Physics-layer authority over a body's integration; the C++ enum is
      ParticleSolverMode (src/particle_types.h). This is the ONLY
      category the solver reads (INV-15): game-layer ownership never
      enters src/core/physics_*.
    permissible_values:
      DYNAMIC:
        description: >-
          Physics integrates position, velocity and rotation. Gravity,
          gluons and contact impulses all apply. Default for every
          newly spawned particle.
      KINEMATIC:
        description: >-
          Infinite mass to the solver (inv_mass = 0). Position is
          written by an external owner; collisions are still detected
          and other bodies collide off it, but impulses are absorbed,
          never integrated. This is what terrain and animated rigs are.
      STATIC:
        description: >-
          Reserved. Only the turtle boundary is truly immovable, and
          the solver handles the turtle specially, not through this
          value.

  Ownership:
    description: >-
      GAME-LAYER bookkeeping of which system wrote a particle last; the
      C++ enum is ParticleOwner (src/particle_types.h). Priority
      ANIMATION > DYNAMICS > PHYSICS. The physics solver is blind to it
      by law (INV-15): an ANIMATION-owned particle is typically
      KINEMATIC, and KINEMATIC is all the solver ever needs to see.
      Seven owner reads survive today inside physics_system_v4.cpp (the
      quat-gravity exemption family), ruled a fix task (#43), not a
      sanctioned exception; test_inv15_owner_blindness counts them.
    permissible_values:
      PHYSICS:
        description: Physics owns gravity, impulses, gluons. Default.
      DYNAMICS:
        description: >-
          Dynamics owns motion; physics only detects collisions and
          emits CollisionEvents.
      ANIMATION:
        description: >-
          FK controls position via joint angles; dynamics skips shape
          maintenance. Animation must hand back DYNAMICS when done.
      STATIC:
        description: Reserved; only the turtle is truly immovable.

  Shape:
    description: >-
      A body's collision and render geometry; the C++ enum is
      ParticleShape (src/particle_types.h).
    permissible_values:
      BOX:
        description: >-
          Extents (width, height, thickness) as full spans on X/Y/Z.
          The workhorse: floors, walls, body parts.
      SPHERE:
        description: size is the diameter; radius = size/2 on all axes.
      ELLIPSOID:
        description: (width, height, thickness) are per-axis diameters.

  # --- Section 2 vocabulary (the Invariant record) ---

  InvariantKind:
    description: What sort of truth an invariant is.
    permissible_values:
      law:
        description: A root law of the engine's physics.
      corollary:
        description: >-
          A consequence of one or more laws; must cite them in
          derives_from.
      convention:
        description: >-
          A chosen contract with one documented answer (e.g. the
          contact-normal sign, INV-25). Not a law of the world; still
          binding.
      modeling-boundary:
        description: >-
          A sanctioned approximation with explicit bounds (e.g.
          split-impulse position repair, INV-21).
      architecture:
        description: >-
          A software-structure law that carries physical meaning (e.g.
          one attachment-point definition, INV-28; constants as
          inputs, INV-29).

  VerificationMode:
    description: How violations of an invariant are caught.
    permissible_values:
      runtime:
        description: Enforced or measured while the engine runs.
      static:
        description: Enforced by scanning the source tree.
      ledger:
        description: Measured by the energy ledger instrumentation.

  InvariantStatus:
    description: Whether the code honors the invariant today.
    permissible_values:
      active:
        description: Enforced now; a violation is a bug.
      aspirational:
        description: >-
          Born red (owner ruling 2026-08-13): diagnosed true, code not
          yet compliant. The sweep reports it as standing debt, never
          as a mole.

classes:
  # ----------------------------------------------------------------
  # Bodies and state
  # ----------------------------------------------------------------

  Body:
    abstract: true
    in_subset: [concept]
    description: >-
      A particle, and a particle is a body: it occupies space and
      collides, with mass computed from material density times volume
      at creation. There are no decorative particles and no visual-only
      ornament — mass, friction, contacts and constraints are the only
      mechanisms. State per body: position, velocity, half-extent
      geometry (Shape), orientation (OrientationRepresentation), rest
      flag (RestState), solver_mode (SolverMode), and game-layer owner
      (Ownership) which physics never reads. C++: struct Particle,
      src/particle_core.h.

  Material:
    abstract: true
    in_subset: [concept]
    description: >-
      What a body is made of, in two layers that must not be confused
      (src/materials.h). The solver-facing layer: density (kg/m3, mass
      = density x volume) and a per-frame contact damping fraction that
      was tuned until stacks settled. The physical layer: Young's
      modulus E, Poisson ratio nu, tensile/compressive/shear strength,
      and loss factor eta — handbook figures (with marked estimates for
      FLESH, LEAVES, SAND) that do not move when the solver changes.
      The physical layer is a DERIVATION SOURCE under INV-9: organic
      bond force laws derive from it (axial k = A/(La/Ea + Lb/Eb),
      damping from eta, bending K = E*I/L), and shear modulus is never
      declared — G = E/(2(1+nu)) — so there is no fourth place for
      three constants to disagree. The property tables stay in
      src/materials.h; this class records their schema, not their
      values.
    attributes:
      density:
        range: float
        unit: { ucum_code: kg/m3 }
        description: Mass per volume; mass is derived at creation.
      youngs_modulus:
        range: float
        unit: { ucum_code: Pa }
        description: Stress per unit strain in uniaxial tension.
      poisson_ratio:
        range: float
        unit: { ucum_code: "1" }
        description: Transverse contraction per axial extension, (-1, 0.5).
      tensile_strength:
        range: float
        unit: { ucum_code: Pa }
        description: Stress at which the material pulls apart.
      compressive_strength:
        range: float
        unit: { ucum_code: Pa }
        description: >-
          Crush limit. Brittle materials are far stronger here than in
          tension — why stone builds arches and not beams.
      shear_strength:
        range: float
        unit: { ucum_code: Pa }
        description: Sideways failure — how a bond tears rather than snaps.
      loss_factor:
        range: float
        unit: { ucum_code: "1" }
        description: >-
          Internal friction eta: fraction of strain energy dissipated
          per radian of oscillation. Steel rings (5e-4); flesh does not
          (0.3). The INV-19-legitimate source of bond damping.
      contact_damping:
        range: float
        unit: { ucum_code: "1" }
        description: >-
          Solver-tuned per-frame velocity absorption fraction. Honest
          about what it is: a settling aid, not a material constant.

  RestState:
    abstract: true
    in_subset: [concept]
    description: >-
      Sleep is a CACHE over dynamics, never immobility (INV-18). A body
      enters rest after REST_FRAMES_REQUIRED frames below
      REST_VELOCITY_THRESHOLD and wakes above WAKE_VELOCITY_THRESHOLD
      (2x hysteresis), evaluated AFTER turtle boundary enforcement so
      ground particles read their true final velocity. The coherence
      contract: a sleeping body's geometry, overlaps, bond strain and
      support are evaluated exactly as an awake body's, and every state
      change that invalidates its equilibrium is a dirty hit that wakes
      it (wake-on-strain via GLUON_WAKE_STRAIN, wake-on-contact via the
      momentum-transfer gate, wake-on-mutation at the mutators). The
      sleep law's corollary: a constraint-dissatisfied body's velocity
      is a correction in progress and the rest damper must not crush
      it. A structure held up by rest collapses the moment something
      heavy leans on it — immobility is only the turtle, anchors, or
      KINEMATIC (INV-1).

  OrientationRepresentation:
    abstract: true
    in_subset: [concept]
    description: >-
      Two representations coexist on every body: Euler angles
      (rotation_x/y/z, compass-clockwise around Z per the engine
      convention) and a quaternion (rotation_q). The is_quat_driven
      flag picks which one drives geometry and narrow phase; the
      quat-drive path applies combined poses as one Rodrigues rotation
      rather than three per-axis rows. The one-orientation-truth
      question (which representation is canonical) is an owner ruling
      DEFERRED until the rotation-ladder work forces it — see the
      ledger, 2026-08-13.

  # ----------------------------------------------------------------
  # Constraints
  # ----------------------------------------------------------------

  ConstraintRow:
    abstract: true
    in_subset: [concept]
    description: >-
      The solver's unit of work (struct Constraint,
      include/logosphere/physics/physics_solver.h): "these two bodies
      should not approach along the Jacobian." A row carries a unit
      Jacobian direction, an effective mass 1/(1/ma + 1/mb +
      compliance/dt2) priced from the LIVE immovability predicate
      (INV-8) and spent with the same model it was priced in (INV-20),
      a velocity bias for position correction, accumulated impulse for
      clamping and warm starting, and a separate pseudo-impulse
      accumulator so position repair never enters momentum (INV-21).
      Contacts clamp impulse to push-only; gluon rows may push or pull
      and break at max_impulse. Angular rows extend the same struct
      with effective inertia, a world axis (scalar or full-vector), and
      the pivot-law fields (anchor lever arms, anchor-axis inertia) that
      INV-16 is waiting on. Multi-point manifolds split effective mass
      across same-normal rows (eff_mass_share) so N rows sum to one
      correction instead of over-correcting xN.
    attributes:
      jacobian:
        description: Unit direction the constraint acts along.
      effective_mass:
        range: float
        unit: { ucum_code: kg }
        description: >-
          How impulse distributes; 0 for an immovable pair, which
          excludes the row from every stopping test (INV-23).
      bias:
        range: float
        unit: { ucum_code: m/s }
        description: Velocity-level position correction request, capped.
      accumulated_impulse:
        range: float
        unit: { ucum_code: N.s }
        description: Warm-start state and clamp basis.
      penetration:
        range: float
        unit: { ucum_code: m }
        description: >-
          Overlap at row build, MEASUREMENT ONLY: it cannot be
          recovered from bias (clamped and slop-zeroed), and a row can
          be velocity-satisfied while the bodies are still inside each
          other (measured 2026-08-02, 40% overlap at zero residual).

  Bond:
    abstract: true
    in_subset: [concept]
    description: >-
      A persistent pairwise constraint (C++ GluonConstraintBase): the
      engine's cement. A bond owns rest geometry measured
      attachment-point-to-attachment-point (INV-28), builds solver rows
      each substep against the live world, and tears only under genuine
      geometric strain at or beyond its tear ratio (INV-14) — a bond
      between two satisfied resting bodies never tears. Three kinds
      exist (NailBond, OrganicBond, ElasticBond), the same vocabulary
      the KG ontology exposes as GluonType. Bonded-structure-internal
      pairs generate no contact rows: one mechanism owns a pair
      (INV-22).

  NailBond:
    abstract: true
    is_a: Bond
    in_subset: [concept]
    description: >-
      Rigid connection holding a fixed relative pose, failing at a
      declared breaking force. The default for assembled rigs, where
      the assembler genuinely knows the joint's strength.

  OrganicBond:
    abstract: true
    is_a: Bond
    in_subset: [concept]
    description: >-
      Cohesive bond whose strength is DERIVED, never declared (INV-9):
      breaking force is contact area times material tensile strength,
      and the force law follows from material and geometry. A
      force-bounded bond with no force law refuses to build — G6 found
      28 hollow branch bonds standing a canopy on nothing. This is what
      holds grown structures (trees, grass, strata) together.

  ElasticBond:
    abstract: true
    is_a: Bond
    in_subset: [concept]
    description: >-
      Compliant connection modelling a real elastic element (tendon,
      ligament). Compliance here is a physical model, not a numerical
      patch: INV-5 forbids springs and damping as fixes, and INV-19
      admits damping only where a real dissipation process is being
      modelled and booked.

  AttachmentPoint:
    abstract: true
    in_subset: [concept]
    description: >-
      Where a bond grips a body: a local offset from the body's centre,
      rotated by that body's own FULL orientation into world space.
      INV-28's subject: exactly one definition, computed by one
      function, shared by every consumer — row build, tear measurement,
      strain energy, generation audits. Four hand-copies of this math
      existed and one disagreed: 51 bonds tore with both bodies
      stationary because rest was measured in a frame that exists
      nowhere. Shared physical definitions are shared code.

  ForceLaw:
    abstract: true
    in_subset: [concept]
    description: >-
      What an organic bond may exert, derived per INV-9 from material
      and geometry, never declared: axial stiffness k = A/(La/Ea +
      Lb/Eb) (two half-lengths in series), damping from the materials'
      loss factor, bending K = E*I/L. Derivation removes the second
      declaration that a declared constant would inevitably disagree
      with. The derivation inputs are the Material physical layer in
      src/materials.h.

  AngularDrive:
    abstract: true
    in_subset: [concept]
    description: >-
      A commanded orientation on a joint, solved as quat-drive rows: the
      pose error becomes one Rodrigues rotation applied along a
      world-space axis vector, with honest angular exits (a solve may
      only claim convergence when the last sweep's angular impulses
      moved no body faster than ANGULAR_RESIDUAL_FLOOR) and a scoped
      angular split-impulse position pass. INV-13's contract: a driven
      joint converges to its commanded pose and holds it under its own
      load, and the controller never fights a second controller — no
      integral terms stacked on drives (two attempts measured worse,
      preserved as evidence commits).

  # ----------------------------------------------------------------
  # Contact geometry
  # ----------------------------------------------------------------

  ContactManifold:
    abstract: true
    in_subset: [concept]
    description: >-
      One narrow-phase pair's contact set: up to four points sharing a
      normal, produced by reference-face clipping (src/core/
      narrow_phase.cpp). Face manifolds are preferred over edge
      contacts because they are stable frame to frame; an edge axis
      wins only when clearly smaller (EDGE_TOL, the SLOP scale). The
      solver splits the pair's effective mass across the manifold's
      same-normal rows so they sum to one correction.

  ContactPoint:
    abstract: true
    in_subset: [concept]
    description: >-
      A world-space point where two bodies touch, with a depth along
      the manifold normal. Positive depth is interpenetration; negative
      is a speculative gap within CONTACT_MARGIN, whose row bias is an
      approach-speed LIMIT, not geometry to repair (pinned in the
      characterization baseline history: zeroing it left a box resting
      on 80 mm of air).

  ContactNormal:
    abstract: true
    in_subset: [concept]
    description: >-
      The direction a contact acts along, from the bodies' actual
      oriented shapes (INV-12), never from a world-up assumption
      (INV-6). The sign contract is INV-25 and it has exactly one
      answer: every narrow-phase handler documents its production
      direction (contract table in narrow_phase.h), and every contact
      leaving physics is oriented A toward B with approach speed
      NEGATIVE while closing. A convention with two answers turns
      every consumer into a coin flip — the avoid-obstacle push that
      drove the humanoid INTO the wall.

  OrientedBox:
    abstract: true
    in_subset: [concept]
    description: >-
      A box with its rotation honored: centre, three unit axes, three
      half-extents (struct OBB, narrow_phase.cpp). The SAT narrow phase
      tests 15 axes (3+3 faces, 9 edge crosses) and clips the incident
      face against the reference face's side planes. A rotated box
      collides as a rotated box and rests flush on its true faces —
      INV-12, earned by the walk-gate snowplow and a tipped plate
      resting on 276 mm of air.

  AxisAlignedBox:
    abstract: true
    in_subset: [concept]
    description: >-
      A body's world-axis-aligned bounding extent. The broad phase's
      currency and ONLY the broad phase's: candidate discovery may
      overestimate with slabs, contact resolution may not (nothing
      collides as its bounding slab, INV-12). Unrotated boxes take a
      fast axis-aligned path; box_particle_is_rotated decides at
      BOX_ROTATION_EPS / QUAT_UNROTATED_EPS.

  ContactKey:
    abstract: true
    in_subset: [concept]
    description: >-
      A contact's identity across frames: (particle_a, particle_b,
      contact_type), hashed for the warm-start impulse cache. Resting
      contacts retain their equilibrium impulse between frames so the
      solver starts near the solution instead of rediscovering it and
      overshooting; entries unused for WARM_CACHE_AGE_LIMIT frames are
      evicted.

  # ----------------------------------------------------------------
  # The boundary
  # ----------------------------------------------------------------

  Turtle:
    abstract: true
    in_subset: [concept]
    description: >-
      The world boundary, and the ONE intrinsically immovable thing in
      the engine (INV-1). "See the TURTLE of enormous girth! On his
      shell he holds the earth." An infinite-mass collision plane at z
      = TURTLE_Z with normal +Z, zero restitution (bedrock does not
      bounce), and the particle's own friction coefficient. Everything
      else — floor tiles, strata, statues, boulders — is a body with
      mass, supported ultimately by the turtle at the bottom of the
      world; immobility elsewhere is only ever gluon anchors or
      KINEMATIC authority. In code the turtle is distributed: TURTLE_Z
      and TURTLE_RESTITUTION (physics_solver.h), the is_turtle_contact
      flag on rows (body_b ignored, impulse to body_a only),
      enforce_turtle_boundary as its own position repair (excluded from
      the row position pass so no violation is corrected twice,
      INV-22), and the assert_above_turtle doors at particle and KG
      entry (TURTLE_STRICT aborts, TURTLE_LENIENT inventories — 55
      below-turtle placements found 2026-08-10). Nothing is ever placed
      or ends below the turtle plane beyond SLOP; a body reaching
      EXPDET_ESCAPE_BELOW_Z means the boundary itself failed. This
      class is that scattered mechanism finally named as one thing.

  # ----------------------------------------------------------------
  # Processes — what runs, in pipeline order
  # ----------------------------------------------------------------

  Substep:
    abstract: true
    in_subset: [concept]
    description: >-
      The outer loop: the full pipeline (forces, broad phase, narrow
      phase, row build, solve, integrate, boundary) runs SOLVER_SUBSTEPS
      times per render frame at dt/SOLVER_SUBSTEPS each. Each substep
      rebuilds constraints against current state, so position-bias
      correction applies more authority per frame at the same BETA —
      the honest alternative to raising BETA into chain instability
      (BETA 4.0 blew up in the April rehab probes). Cost is linear.

  ForceApplication:
    abstract: true
    in_subset: [concept]
    description: >-
      External input, the only sanctioned energy source (INV-3):
      gravity on every DYNAMIC body, quadratic air drag (F = 0.5 *
      RHO_AIR * v2 * DRAG_CD * A) on all movers, and cluster-relative
      structural damping only on gluon-connected bodies' DEVIATION from
      their cluster's shared velocity — internal oscillation dies, free
      fall stays free (Galilean invariance, INV-19). Drives deposit
      commanded motion here as well.

  BroadPhase:
    abstract: true
    in_subset: [concept]
    description: >-
      Candidate discovery: which AABB pairs might touch, via BVH
      queries, plus interaction-profile filtering (a filtered pair
      emits a pass-through event instead of contacts) and the
      wake-on-contact gates for sleeping bodies (momentum-transfer for
      dynamic movers, closing-speed for KINEMATIC ones). Overestimation
      here is legal; the narrow phase owns truth.

  NarrowPhase:
    abstract: true
    in_subset: [concept]
    description: >-
      Truth about touching: OBB SAT with reference-face clipping
      (src/core/narrow_phase.cpp) produces manifolds with true-geometry
      normals (INV-12), under the one-sign contract (INV-25).
      Axis-aligned fast paths serve unrotated boxes; coplanar-tile
      merging (COPLANAR_EPS, ADJ_EPS) keeps interior seams of a tiled
      floor from producing horizontal normals.

  RowBuild:
    abstract: true
    in_subset: [concept]
    description: >-
      Manifolds and bonds become ConstraintRows: Jacobians from contact
      normals, effective masses from the live predicate, bias from
      penetration (capped at MAX_BIAS_VELOCITY), contact impulse
      budgets from approach speed plus CONTACT_CAPTURE_CUSHION
      (INV-17: a contact may stop an approach, never amplify one), and
      the manifold mass split. Bond rows add the wake-on-strain check
      (GLUON_WAKE_STRAIN) so a strained bond is never invisible to a
      sleeper (INV-18).

  RowMassRefresh:
    abstract: true
    in_subset: [concept]
    description: >-
      INV-8's mechanism: at solve start, every row's effective mass is
      refreshed SHRINK-ONLY against the live immovability predicate, so
      no row applies impulses sized for a different world than the one
      at solve time. Rows built before a wake shrink to the live state
      before solving. Earned by the 245 m/s blade and the +/-110 m/s
      heel-strike foot, both rows sized for a stale world.

  VelocityPass:
    abstract: true
    in_subset: [concept]
    description: >-
      Sequential impulse, Gauss-Seidel: iterate rows up to
      SOLVER_ITERATIONS, warm-started from the ContactKey cache, every
      velocity write passing equal-and-opposite through the one
      momentum door (INV-7). Order is part of the computation
      (LOGOSPHERE_PHYS_SHUFFLE exists to ask whether it is part of the
      answer). Exit doors are honest at every mass and both
      dimensions: absolute impulse below ABSOLUTE_THRESHOLD AND last
      sweep's angular impulses below ANGULAR_RESIDUAL_FLOOR, or a
      confirmed plateau (MIN_IMPROVEMENT_RATE over PLATEAU_CONFIRM
      iters after MIN_ITERATIONS) with the residual velocity under
      VELOCITY_PLATEAU_FLOOR — velocities, not raw impulses, because a
      raw impulse threshold means a shrug to a branch and a shove to a
      leaf (INV-10). Rows with no finite answer contribute zero and
      never hold the exit hostage (INV-23).

  PositionPass:
    abstract: true
    in_subset: [concept]
    description: >-
      Split-impulse geometric repair (INV-21): position error is
      corrected through a pseudo-velocity that is DISCARDED, never
      entering momentum, over POSITION_ITERATIONS sweeps, with SLOP and
      ANGULAR_SLOP tolerances so repair terminates at a fixed point
      (INV-24 — a tolerance-free repair chased 290 nm of float residue
      1955 times on a scene at rest, pumping potential energy uphill).
      One correction law across row types (INV-26): BETA * error / dt,
      capped by the three 4.0 caps. Turtle repair is separate and
      exclusive (INV-22).

  WakePropagation:
    abstract: true
    in_subset: [concept]
    description: >-
      A woken body's neighbors may need waking too: impacts above
      WAKE_PROPAGATION_THRESHOLD propagate through bonds with
      WAKE_ENERGY_DAMPING loss per hop, so a real strike travels
      through a structure while settling noise stays local. Direct
      wake gates are physical, not flat speed: momentum transfer
      m_active/(m_active+m_sleeper)*v for dynamic movers (a boulder
      wakes a tile, a pebble cannot wake bedrock), closing speed along
      the contact normal for KINEMATIC movers (gliding foot anchors
      stay silent, pushers close in). All of it is INV-18's dirty-hit
      invalidation.

  Tear:
    abstract: true
    in_subset: [concept]
    description: >-
      Bond failure, under INV-14's law: tears need genuine geometric
      strain, measured attachment-point-to-attachment-point against the
      bond's own rest (rotated offsets, INV-28), at or beyond the tear
      ratio. A bond between two satisfied resting bodies never tears.
      TEAR_DEBUG=1 prints frame-stamped evidence lines for every tear
      decision. Measure what the bond enforces, not a proxy — G1c.

  # ----------------------------------------------------------------
  # Instruments — always-on or env-armed observability
  # ----------------------------------------------------------------

  EnergyLedger:
    abstract: true
    in_subset: [concept]
    description: >-
      INV-3's instrument. ENERGY_LEDGER=1 measures kinetic, gravity
      (potential) and bond strain energy buckets around every pipeline
      phase and prints per-substep d_TOTAL by phase (solve, angular,
      positions, turtle, integrate). Energy is never created: a phase
      that adds total energy is a bug wherever it hides. Strain is
      measured where the bond acts — between attachment points, not
      centres (four wrong tree fixes, G1c). The first energy-neutral
      scene (d_TOTAL == 0 exact) landed with the SLOP'd position pass.
      A dissipation bucket is committed but pending (task #44).

  ExplosionDetector:
    abstract: true
    in_subset: [concept]
    description: >-
      INV-11's tripwire, always compiled in, ON by default (a tripwire
      that must be armed is not one), src/core/explosion_detector.{h,
      cpp}. Three physical signals, none game-specific: SPEED (a body
      over EXPDET_SPEED_CEILING, calibrated above every legitimate
      mechanism — canopy 1.2 m/s, bias cap 4 m/s, 50 m free fall 31
      m/s — and below the wedged-boulder bug's 72), ENERGY (total KE
      jumping by EXPDET_KE_RATIO AND EXPDET_KE_ABS_RISE AND twice the
      fastest single body's KE, so a thrown boulder is not an
      explosion but 100 tiles at 3 m/s is), ESCAPE (a body past
      EXPDET_ESCAPE_XY or below EXPDET_ESCAPE_BELOW_Z, which the
      turtle boundary should make unreachable). Warnings are
      rate-limited per class per EXPDET_WARN_EVERY_FRAMES, a first
      violation always warns immediately, and the worst body is NAMED
      — a max with no owner cannot be sanity-checked. Its warnings are
      failures, not noise.

  ParticleTracer:
    abstract: true
    in_subset: [concept]
    description: >-
      The permanent causal write tracer (src/core/particle_tracer.h):
      every instrumented write site that touches a traced particle
      emits frame-ordered records (site, field, old to new, delta),
      answering "who moved this particle, when, in what order" without
      per-bug printfs. Zero cost when idle (one branch and a hash
      lookup per site), ring buffer of 4096 records, main-thread only.
      Opt in per particle: tracer.trace(id, label).

  Canary:
    abstract: true
    in_subset: [concept]
    description: >-
      Single-particle phase-by-phase logger inside the physics update:
      CANARY_PID=<id> CANARY_FRAME_MIN/MAX bound a window, and the
      canary particle's position, velocity and rest state are printed
      at every pipeline phase of every frame in it. The coarse
      companion to ParticleTracer: the tracer answers who wrote,
      the canary shows the whole frame's shape around one body.

  EnvLever:
    abstract: true
    in_subset: [concept]
    description: >-
      Runtime switches, all read from the environment, none changing
      compiled behavior when unset. Diagnosis: ENERGY_LEDGER,
      TEAR_DEBUG, LOGOSPHERE_PHYS_TRACE(_FILE,_IDS),
      LOGOSPHERE_PHYS_RESIDUAL, LOGOSPHERE_METRICS(_EVERY),
      LOGOSPHERE_DEEP_PROBES, CANARY_PID(_FRAME_MIN,_FRAME_MAX).
      Tripwire control: LOGOSPHERE_EXPLOSION_DETECTOR,
      LOGOSPHERE_EXPLOSION_SPEED. Experiment levers:
      LOGOSPHERE_PHYS_SHUFFLE (constraint-order permutation),
      ANGULAR_EXIT_OFF (restores angular-blind exit doors for A/B).
      Leniency doors: TURTLE_STRICT / TURTLE_LENIENT (abort vs
      inventory below-turtle placements), GLUON_LENIENT (inventory
      undeclared force laws instead of refusing the bond).

# ===================================================================
# SECTION 2 — THE INVARIANT RECORD
# tests/invariants/INVARIANTS.jsonl rows validate against this class.
# The ledger (tests/invariants/LEDGER.md) is the human trail; the
# JSONL is the machine truth; this schema is its contract.
# ===================================================================

  Invariant:
    description: >-
      One row of INVARIANTS.jsonl: a law of this engine, its mechanism,
      how it is verified, and where it came from. Invariants may be
      born red (status aspirational, owner ruling 2026-08-13): the
      statement is diagnosed true and the code does not yet honor it.
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^INV-[0-9]+$"
        description: Stable id, INV-<n>. Never reused, never renumbered.
      slug:
        required: true
        description: Short kebab-case name, e.g. turtle-only-immovable.
      kind:
        required: true
        range: InvariantKind
        description: What sort of truth this is.
      derives_from:
        multivalued: true
        range: Invariant
        description: >-
          The invariants this one is a consequence of. A derived
          consequence must cite what generates it (owner ruling on
          INV-22); empty for root laws.
      statement:
        required: true
        description: The law itself, written to be falsifiable.
      mechanism:
        required: true
        description: >-
          What enforces or measures it in the tree — named functions,
          constants, tools. validate_invariants.py greps that these
          symbols still exist.
      verification:
        required: true
        range: VerificationMode
        description: How violations are caught.
      origin:
        required: true
        description: The RCA, ruling or charter line that earned it.
      status:
        required: true
        range: InvariantStatus
        description: active (enforced today) or aspirational (born red).

  InvariantRegistry:
    description: >-
      Validation container: INVARIANTS.jsonl wrapped as one object for
      linkml-validate (the JSONL-to-JSON-array shim produces
      {"invariants": [...]}).
    tree_root: true
    attributes:
      invariants:
        multivalued: true
        inlined_as_list: true
        range: Invariant

# ===================================================================
# SECTION 3 — THE CONSTANTS REGISTRY (INV-29)
# Every named physics constant is an engine INPUT declared here:
# value (ifabsent), unit (ucum_code), group (containing class), doc
# (description, carrying the RCA where the solver comments held one).
# Generated into src/generated/physics_constants.h, namespace
# PhysicsV4, by scripts/generate_ontology.py's header-only mode.
#
# THE DECREE (INV-29): constant-work and code-work are separate
# efforts. Extraction is VALUE-IDENTICAL; any value that itches goes
# to the ledger as follow-up, never changed in the extraction.
# ===================================================================

  SolverSchedule:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      How much solving happens per rendered frame. Origin:
      include/logosphere/physics/physics_solver.h.
    attributes:
      SOLVER_ITERATIONS:
        range: integer
        ifabsent: int(32)
        unit: { ucum_code: "{iteration}" }
        description: >-
          Velocity-pass sweep budget per substep. Raised to 32 for deep
          constraint chains (stacked floors); the exit doors usually
          leave earlier.
      SOLVER_SUBSTEPS:
        range: integer
        ifabsent: int(4)
        unit: { ucum_code: "1" }
        description: >-
          Outer substep count per render frame; the full pipeline runs
          this many times at dt/SOLVER_SUBSTEPS. Substepping multiplies
          position-bias authority per frame at the same BETA without
          crossing into chain instability (April rehab probes: BETA up
          to 4.0 blew up), at linear CPU cost. Motivating case: closing
          a 33 mm/frame hip-motion lag at 60 Hz.
      POSITION_ITERATIONS:
        range: integer
        ifabsent: int(8)
        unit: { ucum_code: "{iteration}" }
        description: >-
          Split-impulse position-pass sweeps. Deliberately much smaller
          than SOLVER_ITERATIONS: position repair has no momentum to
          fight. Raise only with a measurement showing residual overlap
          that more sweeps actually close.

  ConvergenceExits:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      The velocity solve's honest exit doors. Origin:
      src/core/physics_system_v4.cpp (in-function constexprs).
    attributes:
      MIN_ITERATIONS:
        range: integer
        ifabsent: int(6)
        unit: { ucum_code: "{iteration}" }
        description: Sweeps before early stopping may be considered.
      PLATEAU_CONFIRM:
        range: integer
        ifabsent: int(3)
        unit: { ucum_code: "{iteration}" }
        description: Consecutive low-improvement sweeps to confirm a plateau.
      MIN_IMPROVEMENT_RATE:
        range: float
        ifabsent: float(0.05)
        unit: { ucum_code: "1" }
        description: >-
          Below 5% improvement per sweep counts toward the plateau.
      VELOCITY_PLATEAU_FLOOR:
        range: float
        ifabsent: float(0.001)
        unit: { ucum_code: m/s }
        description: >-
          The residual velocity below which a plateau really is
          convergence. A velocity, not an impulse: the same physical
          statement at every mass (INV-10).
      ABSOLUTE_THRESHOLD:
        range: float
        ifabsent: float(0.01)
        unit: { ucum_code: N.s }
        description: >-
          Absolute-exit impulse floor. A velocity AND-term was tried
          and withdrawn twice: mass-scaled it was unreachable from the
          heavy side (58k-row Eden burned all 32 iterations, 2.5 FPS),
          velocity-only it was unreachable from the light side (1 mm/s
          on a 0.1 g grass segment is 1e-7 N*s, solver noise floor).
          The light-body residual it chased is cured at the mechanism
          (momentum-unit impulse-memory cap, derived force law), so the
          impulse threshold stands alone; the angular AND-term is
          ANGULAR_RESIDUAL_FLOOR.
      ANGULAR_RESIDUAL_FLOOR:
        range: float
        ifabsent: float(0.01)
        unit: { ucum_code: rad/s }
        description: >-
          Honest-exit twin for ANGULAR rows. The impulse door is blind
          to angular rows on light bodies: a quat-drive row holding
          delta-L ~ 1.5e-4 N*m*s sits 60x under it while imparting 6.5
          rad/s to a 2.3e-5 kg*m2 shoulder bone (measured: iters=1
          exits, shoulder converging at 1/65th of commanded rate, hold
          error 0.1368 rad against a 0.0627 budget). An exit may only
          call the solve converged when the last sweep's angular
          impulses moved no body faster than this.

  PositionCorrection:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      One correction law (INV-26): every position error, whatever row
      type carries it, corrects at BETA * error / dt bounded by a
      velocity cap. Origin: include/logosphere/physics/physics_solver.h.
    attributes:
      SLOP:
        range: float
        ifabsent: float(0.001)
        unit: { ucum_code: m }
        description: >-
          Allowed penetration (1 mm). The tolerance that makes repair
          terminate (INV-24); also the turtle-plane placement tolerance
          (INV-1).
      ANGULAR_SLOP:
        range: float
        ifabsent: float(0.001)
        unit: { ucum_code: rad }
        description: >-
          Angular twin of SLOP for the split-impulse position pass.
          Below this the "error" is float residue and a tolerance-free
          repair never terminates (the 290 nm Baumgarte ratchet,
          angular edition). 1 mrad = 0.057 deg; a settled drive joint's
          residual measures ~0.26 mrad, safely under.
      BETA:
        range: float
        ifabsent: float(0.4)
        unit: { ucum_code: "1" }
        description: >-
          Baumgarte gain: fraction of position error corrected per
          substep, 0.4 for stable stacks.
      GLUON_POSITION_BETA:
        range: float
        ifabsent: float(0.2)
        unit: { ucum_code: "1" }
        description: >-
          Bond-row Baumgarte gain. With the /dt restored (one
          correction law), 1.0 means "erase the whole error this step",
          which rings (measured: 113 swings on a bond that should sway
          once). Contacts use 0.4; bonds are softer because chains
          stack corrections.
      MAX_BIAS_VELOCITY:
        range: float
        ifabsent: float(4.0)
        unit: { ucum_code: m/s }
        description: >-
          Cap on the contact push-out speed Baumgarte may request
          (V4.14). Uncapped, a deep false penetration (SAT axis flip
          between rotated boxes) becomes a ballistic ejection — a
          wedged boulder left the world at 72 m/s. Deep overlaps
          resolve over frames (INV-2, INV-21).
      GLUON_MAX_BIAS_VELOCITY:
        range: float
        ifabsent: float(4.0)
        unit: { ucum_code: m/s }
        description: >-
          The gluon twin (MECHANISM B1, issue #47). A bond stretched to
          434 m requested a 434 m/s closing speed on a 2-gram body. A
          stretched bond pulls itself home at a bounded speed. Also the
          speed base of the impulse-memory momentum cap.
      ANGULAR_BETA:
        range: float
        ifabsent: float(0.4)
        unit: { ucum_code: "1" }
        description: >-
          Shared Baumgarte gain for all angular bias calculations, both
          the scalar Z path and the 3-axis quaternion-drive path.
      MAX_ANGULAR_BIAS_VELOCITY:
        range: float
        ifabsent: float(4.0)
        unit: { ucum_code: rad/s }
        description: >-
          The angular twin. An angle error at the pi wrap requests
          0.4*pi*120 = 151 rad/s with an infinite budget: the
          walk-through-grass gate's worst detonation measured exactly
          151.2 m/s. A joint corrects toward its target at a bounded
          rate; larger errors resolve over frames.
      ANGULAR_LIMIT_UNLIMITED:
        range: float
        ifabsent: float(3.14159)
        unit: { ucum_code: rad }
        description: >-
          A constraint row's default angular dead zone: +/- pi means no
          limit (180 deg both ways). Rows wanting a real limit set
          their own.
      CONTACT_CAPTURE_CUSHION:
        range: float
        ifabsent: float(4.0)
        unit: { ucum_code: m/s }
        description: >-
          MECHANISM A (issue #47), INV-17's number: a contact row's
          impulse budget is effective_mass * (|approach| + this),
          instead of infinity. The cushion is what sustains STATIC
          support: a resting row has zero approach but must carry
          weight; m*g*dt per tick is 0.16 m/s-equivalent, so 4.0 funds
          a ~25-body stack of equals, rebuilt fresh every frame. What
          it forbids is the measured disease: a 9 m/s footstep handing
          a 2-gram sheet an impulse worth 675 m/s. Capture-bounded,
          that row gives at most 13 m/s: carried, not fired.

  ContactGeometryTolerances:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      Where "touching" begins and which axis wins. Origin:
      physics_solver.h, physics_flags.h, src/core/narrow_phase.cpp,
      src/core/physics_system_v4.cpp.
    attributes:
      CONTACT_MARGIN:
        range: float
        ifabsent: float(0.08)
        unit: { ucum_code: m }
        description: >-
          80 mm Z margin for speculative contacts: rows exist before
          overlap so fast movers are caught. A speculative row's
          negative bias is an approach-speed LIMIT, not geometry
          (baseline 5962bcfd: zeroing it left a box resting on 80 mm
          of air).
      CONTACT_MARGIN_XY:
        range: float
        ifabsent: float(0.005)
        unit: { ucum_code: m }
        description: 5 mm XY margin preventing edge-touch jitter.
      CONTACT_PERSISTENCE_FRAMES:
        range: integer
        ifabsent: int(0)
        unit: { ucum_code: "{frame}" }
        description: >-
          Keep contacts alive N frames after separation. DISABLED (0)
          today.
      RESTING_CONTACT_TOLERANCE:
        range: float
        ifabsent: float(0.001)
        unit: { ucum_code: m }
        description: >-
          Gap within which particles count as touching (1 mm): numeric
          precision, transient timestep penetrations, rounding.
          Critical for resting contacts where v_rel = 0. Origin:
          physics_flags.h (namespace PhysicsSolver until the
          extraction).
      BOUNDARY_EPSILON:
        range: float
        ifabsent: float(0.002)
        unit: { ucum_code: m }
        description: >-
          Axis-selection alignment tolerance (narrow_phase.cpp): bounds
          within 2 mm on an axis count as aligned when scoring which
          axis carries the contact — the fix for small-on-large (foot
          on floor) and tile-boundary straddles.
      ALIGNED_PENALTY:
        range: float
        ifabsent: float(1e6)
        unit: { ucum_code: "1" }
        description: >-
          Score penalty that takes an aligned axis out of the running
          in the axis-selection metric. Effectively infinity next to
          real exit distances.
      BOX_ROTATION_EPS:
        range: float
        ifabsent: float(1e-4)
        unit: { ucum_code: rad }
        description: >-
          Euler threshold (~0.006 deg) below which a box is unrotated
          and takes the axis-aligned fast path (was the in-function EPS
          in narrow_phase.cpp box_particle_is_rotated).
      QUAT_UNROTATED_EPS:
        range: float
        ifabsent: float(1e-6)
        unit: { ucum_code: "1" }
        description: >-
          Quaternion twin: 1 - |w| threshold. 1 - |w| ~ theta^2/8, so
          1e-6 admits ~3 mrad and under as unrotated.
      SUPPORT_PATCH_BAND:
        range: float
        ifabsent: float(0.005)
        unit: { ucum_code: m }
        description: >-
          Corners of a rotated box within this height of its lowest
          corner form the turtle CONTACT PATCH: one row per corner,
          load shared, each with its own lever arm. A single support
          vertex was a step function in orientation — a tumbling cube
          landing near-flat struck one invented corner and walked out
          of its lane (measured: y -1.20 to -2.07 with no lateral
          force; the drift began exactly at turtle touchdown, frame
          135-150 of the ramp race, lane perfect for the whole descent
          before it). The patch is the same answer box-box already
          gives through manifold clipping.
      EDGE_TOL:
        range: float
        ifabsent: float(0.001)
        unit: { ucum_code: m }
        description: >-
          Face manifolds (up to 4 points, stable frame to frame) are
          preferred; an edge axis wins only when clearly smaller by
          this margin (1 mm, the SLOP scale) — sign-safe, unlike a
          relative factor, because speculative overlaps can be
          negative.
      MAX_CLIP_VERTICES:
        range: integer
        ifabsent: int(8)
        unit: { ucum_code: "1" }
        description: >-
          Clip-polygon capacity: 4 original + up to 4 from clipping.
      COPLANAR_EPS:
        range: float
        ifabsent: float(0.005)
        unit: { ucum_code: m }
        description: >-
          Tile-merge coplanarity tolerance: same Z extent within 5 mm
          lets resting tiles merge into one effective surface so
          interior seams stop producing horizontal normals.
      ADJ_EPS:
        range: float
        ifabsent: float(0.01)
        unit: { ucum_code: m }
        description: >-
          Adjacency tolerance (10 mm): tiles touching or aligned within
          this merge into a continuous surface; also the static-pair
          adjacency test in the solver diagnostics.

  TurtleBoundary:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      The one immovable thing (INV-1), as numbers. Origin:
      physics_solver.h; threshold from physics_system_v4.cpp.
    attributes:
      TURTLE_Z:
        range: float
        ifabsent: float(0.0)
        unit: { ucum_code: m }
        description: >-
          The world floor plane. Floor tiles sit ON the turtle; nothing
          is placed or ends below it beyond SLOP.
      TURTLE_RESTITUTION:
        range: float
        ifabsent: float(0.0)
        unit: { ucum_code: "1" }
        description: No bounce off bedrock.
      TURTLE_CONTACT_THRESHOLD:
        range: float
        ifabsent: float(0.003)
        unit: { ucum_code: m }
        description: >-
          Clearance (3 mm) within which a body's oriented down-reach
          earns a turtle contact row.

  GravityAndDrag:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      Sanctioned external input (INV-3) and the safety net around it.
      Origin: physics_solver.h and physics_system_v4.cpp.
    attributes:
      GRAVITY:
        range: float
        ifabsent: float(9.8)
        unit: { ucum_code: m/s2 }
        description: >-
          Gravitational acceleration magnitude the solver applies.
          NOTE, preserved as found (INV-29 extraction is
          value-identical): the energy ledger measures potential energy
          with ENERGY_LEDGER_G = 9.81 while the solver applies 9.8. Two
          declared gravities, 0.1% apart — ledger follow-up, not an
          extraction-time fix.
      ENERGY_LEDGER_G:
        range: float
        ifabsent: float(9.81)
        unit: { ucum_code: m/s2 }
        annotations:
          cpp_type: double
        description: >-
          The g the energy ledger's potential-energy bucket uses (was
          the in-function G in measure_energy). Disagrees with GRAVITY
          in the fourth significant digit; see GRAVITY's note.
      RHO_AIR:
        range: float
        ifabsent: float(1.225)
        unit: { ucum_code: kg/m3 }
        description: Air density at sea level, for quadratic drag.
      DRAG_CD:
        range: float
        ifabsent: float(1.5)
        unit: { ucum_code: "1" }
        description: >-
          Drag coefficient for blunt objects; F = 0.5 * RHO_AIR * v2 *
          DRAG_CD * A (was the in-function CD).
      MIN_DRAG_SPEED_SQ:
        range: float
        ifabsent: float(0.0001)
        unit: { ucum_code: m2/s2 }
        description: >-
          Squared speed floor (1 cm/s) below which drag and structural
          damping are skipped.
      MAX_OMEGA:
        range: float
        ifabsent: float(6.28)
        unit: { ucum_code: rad/s }
        description: >-
          Angular velocity clamp (~1 rev/s): headroom to swing a
          humanoid limb (1-3 rad/s target peaks) without being
          velocity-starved into a steady-state offset. Raise via config
          if future actors need faster rotation.
      MAX_VELOCITY:
        range: float
        ifabsent: float(100.0)
        unit: { ucum_code: m/s }
        description: >-
          V4.14 safety net: velocity clamp at 100 m/s (~360 km/h)
          preventing numerical instabilities from cascading into NaN
          propagation. The comment's own words: root cause should
          still be investigated; this prevents the cascade, it does
          not excuse it (INV-11's ceiling, 40 m/s, fires far earlier).

  RestSleepDamping:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      Rest as a cache (INV-18) and the frame-gated damper that feeds
      it. Origin: physics_solver.h and physics_system_v4.cpp
      (update_rest_state).
    attributes:
      DAMPING_VELOCITY_THRESHOLD:
        range: float
        ifabsent: float(0.4)
        unit: { ucum_code: m/s }
        description: >-
          Frames below this count toward the damping gate (V4.7:
          lowered from 0.5 to sit above the 0.1-0.35 m/s numerical
          oscillation band that never triggered it).
      DAMPING_FRAMES_REQUIRED:
        range: integer
        ifabsent: int(30)
        unit: { ucum_code: "{frame}" }
        description: >-
          Consecutive low-velocity frames (0.5 s) before damping
          engages. Real physics varies velocity and resets the
          counter; numerical oscillation stays consistently low and
          triggers it.
      DAMPING_FACTOR:
        range: float
        ifabsent: float(0.90)
        unit: { ucum_code: "1" }
        description: >-
          Per-frame velocity retention once the gate opens (10%
          reduction per frame). KNOWN INV-19 VIOLATION, task #47:
          damping on ABSOLUTE motion with no physical dissipation
          story, kept for settling. Extracted as-is by decree
          (INV-29: extraction never changes values); the fix is
          constant-work plus mechanism-work, tracked in the ledger.
          Result at introduction (test_rest_diagnostics, 5 trees, 393
          particles): 10% at rest / 0.84 m/s growing before, 98% at
          rest / 0.016 m/s stable after.
      ZERO_VELOCITY_SQ:
        range: float
        ifabsent: float(0.000001)
        unit: { ucum_code: m2/s2 }
        description: >-
          Below this squared speed (1 mm/s) a gated body's velocity is
          hard-clamped to exactly zero.
      REST_VELOCITY_THRESHOLD:
        range: float
        ifabsent: float(0.1)
        unit: { ucum_code: m/s }
        description: >-
          Enter rest below this, sustained REST_FRAMES_REQUIRED frames,
          evaluated AFTER turtle enforcement so ground particles read
          their true final velocity.
      WAKE_VELOCITY_THRESHOLD:
        range: float
        ifabsent: float(0.2)
        unit: { ucum_code: m/s }
        description: Exit rest above this (2x hysteresis).
      ANGULAR_DRAG:
        range: float
        ifabsent: float(0.95)
        unit: { ucum_code: "1" }
        description: >-
          Per-frame omega_z retention (5% loss per frame), applied to
          every spinning body as "general air resistance for rotation".
          Same INV-19 exposure as DAMPING_FACTOR: absolute-motion
          damping whose dissipation story is thin. Extracted as-is by
          decree; any retuning is ledger follow-up.
      REST_FRAMES_REQUIRED:
        range: integer
        ifabsent: int(10)
        unit: { ucum_code: "{frame}" }
        annotations:
          cpp_type: uint8_t
        description: Frames below the rest threshold before resting.

  WakePropagationConstants:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      INV-18's dirty-hit gates. Origin: physics_solver.h
      (GLUON_WAKE_STRAIN) and physics_system_v4.cpp.
    attributes:
      GLUON_WAKE_STRAIN:
        range: float
        ifabsent: float(0.02)
        unit: { ucum_code: m }
        description: >-
          Wake-on-strain: any gluon whose positional error exceeds this
          wakes both DYNAMIC endpoints at row build. Sits above
          settled-structure residuals (~6 mm on the grass-holds gate)
          so resting forests stay asleep, far below any real strain.
          Earned on rotation-ladder rung 1: a rotated KINEMATIC
          parent's sleeping child ignored the moved anchor entirely.
      WAKE_TRANSFER_SPEED:
        range: float
        ifabsent: float(1.0)
        unit: { ucum_code: m/s }
        description: >-
          Momentum-transfer wake gate for dynamic movers: wake when
          m_active/(m_active+m_sleeper) * v_active exceeds this. A
          10-tonne boulder at 19 m/s wakes a 500 kg tile (~18 m/s
          transfer); a 1 kg pebble cannot wake 45-tonne bedrock (~0);
          same-mass tiles settling at ~1 m/s transfer ~0.5 and stay
          under. Replaced the V4.7 flat 50 m/s gate that made sleeping
          tiles effectively immovable — is_at_rest is NOT immobility.
      WAKE_KINEMATIC_APPROACH:
        range: float
        ifabsent: float(0.5)
        unit: { ucum_code: m/s }
        description: >-
          KINEMATIC movers wake sleepers on CLOSING speed along the
          contact normal, not raw speed. The old 100 m/s raw gate
          protected gliding foot-plant anchors but made every sleeper
          immovable to a kinematic pusher (rung 3: a 1 m/s finger
          through a sleeping chain, 32 contacts, zero displacement).
          Closing speed keeps both honest: anchors glide (~0, silent),
          pushers close in.
      WAKE_PROPAGATION_THRESHOLD:
        range: float
        ifabsent: float(0.5)
        unit: { ucum_code: m/s }
        description: >-
          Impacts below this wake only the hit particle; above it the
          wake propagates through bonds. Small bumps don't cascade.
      WAKE_ENERGY_DAMPING:
        range: float
        ifabsent: float(0.3)
        unit: { ucum_code: "1" }
        description: >-
          Energy retained per gluon hop during wake propagation (70%
          loss per hop), so a strike travels while noise stays local.

  WarmStartMemory:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      Impulse persistence across frames: the contact warm-start cache
      and the organic-bond impulse memory. Origin:
      physics_system_v4.cpp.
    attributes:
      IMPULSE_MEMORY_DECAY:
        range: float
        ifabsent: float(0.98)
        unit: { ucum_code: "1" }
        description: >-
          Per-frame retention of an organic bond's carried impulse
          (was the in-function DECAY). The memory itself is bounded in
          MOMENTUM units: m_light * GLUON_MAX_BIAS_VELOCITY, so the
          integral can never impart more than that speed to the body
          least able to take it (a 2 g blade: 0.0095 N*s; a 5 kg arm:
          20 N*s). The previous cap, breaking_force * dt, was a
          property of how hard the bond is to SNAP: ~8 kN*s against
          0.00238 kg, and a 1.2 m/s push came back as 7.4 m/s.
      IMPULSE_MEMORY_DECAY_REVERSED:
        range: float
        ifabsent: float(0.55)
        unit: { ucum_code: "1" }
        description: >-
          Anti-windup (owner QA: the chain rang 5-8 swings): when the
          fresh impulse OPPOSES the carried load, the spring has
          crossed rest and the memory is driving the next swing —
          bleed it fast instead of carrying it through.
      WARM_CACHE_AGE_LIMIT:
        range: integer
        ifabsent: int(60)
        unit: { ucum_code: "{frame}" }
        description: >-
          Warm-start cache entries unused this long (1 s) are evicted;
          brief lift-off-and-reform oscillations keep theirs (was the
          in-function CACHE_AGE_LIMIT).

  FrictionConstants:
    abstract: true
    in_subset: [constants_registry]
    description: "Contact friction. Origin: physics_solver.h."
    attributes:
      FRICTION_COEFFICIENT:
        range: float
        ifabsent: float(0.5)
        unit: { ucum_code: "1" }
        description: >-
          Default Coulomb friction coefficient (moderate grip) where a
          pair declares none.

  SolverLevers:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      Compile-time architecture levers (if constexpr branches). Inputs
      like any other constant; kept for A/B archaeology. Origin:
      physics_solver.h.
    attributes:
      ENABLE_GLUON_POSITION_PROJECTION:
        range: boolean
        ifabsent: "boolean(false)"
        unit: { ucum_code: "1" }
        description: >-
          Hard position projection for gluons. OFF: the unified
          Jacobian path alone; projection and the velocity solver
          fighting each other was the original oscillation source.
      ENABLE_GLUON_JACOBIAN_POSITION_BIAS:
        range: boolean
        ifabsent: "boolean(true)"
        unit: { ucum_code: "1" }
        description: >-
          V4.10 unified solver: gluons enforce distance via position
          bias inside the Jacobian solve, so contacts and gluons find
          equilibrium together.
      ENABLE_WARM_STARTING:
        range: boolean
        ifabsent: "boolean(true)"
        unit: { ucum_code: "1" }
        description: >-
          V4.3: persist contact impulses across frames by ContactKey so
          resting contacts start near equilibrium instead of
          rediscovering it and overshooting (the 0.2-0.3 m/s perpetual
          oscillation). Standard Box2D/Bullet/PhysX technique.
      ENABLE_SPLIT_IMPULSE:
        range: boolean
        ifabsent: "boolean(true)"
        unit: { ucum_code: "1" }
        description: >-
          V4.4: position correction leaves the velocity solve entirely
          (INV-21). Bias is not used in contact impulse calculation;
          geometry is repaired by the position pass's discarded
          pseudo-velocity.

  ExplosionDetectorDefaults:
    abstract: true
    in_subset: [constants_registry]
    description: >-
      INV-11's tripwire calibration — defaults; speed ceiling
      overridable at runtime via LOGOSPHERE_EXPLOSION_SPEED. None of
      them is a guess pulled from air. Origin:
      src/core/explosion_detector.cpp.
    attributes:
      EXPDET_SPEED_CEILING:
        range: float
        ifabsent: float(40.0)
        unit: { ucum_code: m/s }
        description: >-
          Faster than any legitimate mechanism: a settled canopy peaks
          at 1.2 m/s, the bias cap is 4 m/s per contact, a 50 m free
          fall reaches 31 m/s. Fires only on compounding blowups (the
          wedged boulder measured 72).
      EXPDET_KE_RATIO:
        range: float
        ifabsent: float(5.0)
        unit: { ucum_code: "1" }
        annotations:
          cpp_type: double
        description: >-
          Frame-over-frame total-KE ratio; must ALSO clear the absolute
          rise, because a ratio alone fires on the first pebble in a
          quiet world.
      EXPDET_KE_ABS_RISE:
        range: float
        ifabsent: float(10000.0)
        unit: { ucum_code: J }
        annotations:
          cpp_type: double
        description: >-
          10 kJ absolute rise the KE jump must also clear (an absolute
          alone misses small scenes). The rise must additionally exceed
          twice the fastest single body's KE: a thrown boulder (39 kJ
          from nothing, measured) is a throw, not an explosion.
      EXPDET_ESCAPE_XY:
        range: float
        ifabsent: float(5000.0)
        unit: { ucum_code: m }
        description: Beyond |x| or |y| of this is nowhere the world puts things.
      EXPDET_ESCAPE_BELOW_Z:
        range: float
        ifabsent: float(-50.0)
        unit: { ucum_code: m }
        description: >-
          enforce_turtle_boundary makes this unreachable; a body here
          means the boundary itself failed.
      EXPDET_WARN_EVERY_FRAMES:
        range: integer
        ifabsent: int(60)
        unit: { ucum_code: "{frame}" }
        annotations:
          cpp_type: uint64_t
        description: >-
          Rate limit per warning class, carrying the suppressed count;
          a first violation always warns immediately (frame arithmetic
          silently ate the first 59 frames — exactly when spawn-time
          explosions happen — found by this module's own test).
