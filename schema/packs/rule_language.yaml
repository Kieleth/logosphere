id: https://logosphere.dev/packs/rule-language
name: rule_language
title: Logosphere rule-language identity and ontology reflection
description: >-
  Generic ontology vocabulary used by applications that store executable
  rules as typed KG graphs. This pack owns portable content identity,
  knowledge contexts, and immutable ontology reflection. It contains no
  tabletop-specific concepts.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  rule_language: https://logosphere.dev/packs/rule-language/
  logosphere: https://logosphere.dev/schema/

imports:
  - linkml:types
  - logosphere
  # Float64 for the property bounds below. See packs/math.yaml for why
  # a named type rather than LinkML's `double` built-in.
  - math

types:
  source_digest:
    typeof: string
    description: Lowercase hexadecimal bytes of a typed content digest.
    pattern: ^[0-9a-f]+$

enums:
  SourceMediaType:
    description: Closed media vocabulary implemented by source resolvers.
    permissible_values:
      UTF8_TEXT:
        description: UTF-8 source text addressed by byte range.

  SourceDigestAlgorithm:
    description: Closed cryptographic digest vocabulary for source bytes.
    permissible_values:
      SHA256:
        description: SHA-256, encoded as 64 lowercase hexadecimal digits.

  SourceManifestFormat:
    description: Closed canonical encoding vocabulary for source manifests.
    permissible_values:
      LENGTH_PREFIXED_V1:
        description: >-
          Source representations sorted by logical source path, encoded as
          decimal byte-length-prefixed fields in the version-one field order.

  # Both enums below are the VOCABULARY only: the set of legal
  # predicates, and the range of each relation class's relation_type
  # slot. They carried valid_source_types / valid_target_types
  # annotations until 2026-08-16, and carried `relation_type_enum:
  # true` to tell the generator to harvest them. Endpoints now live on
  # the Relation subclasses at the bottom of this file, which is where
  # malleus asks for them and where a reader looking at a relation
  # finds them. The generator reads the classes; nothing reads these
  # annotations, so they are gone rather than left to rot.

  OntologyMetaRelationType:
    description: Typed links inside the immutable ontology meta-graph.
    permissible_values:
      ONTOLOGY_META_CONTAINS:
      ONTOLOGY_CLASS_DIRECT_PARENT:
      ONTOLOGY_CLASS_HAS_FACET:
      ONTOLOGY_PROPERTY_DECLARING_CLASS:
      ONTOLOGY_PROPERTY_VALUE_KIND:
      ONTOLOGY_PROPERTY_REFERENCE_TARGET:
      ONTOLOGY_PROPERTY_ENUM_TYPE:
      ONTOLOGY_RELATION_VALID_SOURCE:
      ONTOLOGY_RELATION_VALID_TARGET:
      ONTOLOGY_ENUM_HAS_MEMBER:
      ONTOLOGY_ENUM_MEMBER_OWNER:

  RuleLanguageRelationType:
    description: Closed typed links owned by the reusable rule-language pack.
    permissible_values:
      EDITION_INCLUDES_REPRESENTATION:
      FUNCTION_SIGNATURE_HAS_PARAMETER:
      LET_EXPRESSION_HAS_BINDING:

classes:
  KnowledgeContext:
    is_a: Entity
    abstract: true
    description: Explicit scope in which knowledge originates or grows.
    slot_usage:
      context_key:
        required: true
    slots:
      - context_key

  SourceLayerContext:
    is_a: KnowledgeContext
    description: Immutable authored layer owned by seed ingestion.
    annotations:
      facets: sealed-origin, seed-owned
    slot_usage:
      source_layer:
        required: true
    slots:
      - source_layer

  SourceDocumentContext:
    is_a: KnowledgeContext
    description: Exact source document and revision represented by a seed.
    annotations:
      facets: sealed-origin, seed-owned
    slot_usage:
      source_layer:
        required: true
      source_file:
        required: true
      source_commit:
        required: true
      source_layer_context:
        required: true
    slots:
      - source_layer
      - source_file
      - source_commit
      - source_layer_context

  RuntimeContext:
    is_a: KnowledgeContext
    description: Mutable host-defined knowledge scope.
    slot_usage:
      context_kind:
        required: true
    slots:
      - context_kind

  Addressable:
    mixin: true
    abstract: true
    description: >-
      Portable immutable identity for content entities. Identity is the tuple
      of context, exact concrete type, and machine key. Display names and
      source aliases never participate in resolution.
    slot_usage:
      identity_context:
        required: true
      entity_key:
        required: true
    slots:
      - identity_context
      - entity_key

  SourceRepresentationContext:
    is_a: KnowledgeContext
    description: >-
      Exact immutable bytes of one source representation. A new byte
      sequence is a new context even when it represents the same logical
      document or edition.
    annotations:
      facets: sealed-origin, seed-owned
    slot_usage:
      source_layer:
        required: true
      source_file:
        required: true
      source_layer_context:
        required: true
      source_media_type:
        required: true
      source_digest_algorithm:
        required: true
      source_digest:
        required: true
      source_byte_length:
        required: true
    slots:
      - source_layer
      - source_file
      - source_layer_context
      - source_media_type
      - source_digest_algorithm
      - source_digest
      - source_byte_length

  SourceRevisionObservation:
    is_a: Entity
    mixins:
      - Addressable
    description: >-
      Immutable observation that one exact content-addressed representation
      occurred at one source-system revision. Each representation/revision pair
      is independent, so later observations never mutate earlier provenance.
    annotations:
      facets: append-only, seed-owned, no-instance-declared
      no_instance_reason: >-
        The engine materializer is the first writer; the legacy Logovger
        loader has not migrated to source-corpus contexts yet.
    slot_usage:
      identity_context:
        range: SourceRepresentationContext
        required: true
      entity_key:
        required: true
      source_revision:
        required: true
    slots:
      - identity_context
      - entity_key
      - source_revision

  IngestionEditionContext:
    is_a: KnowledgeContext
    description: >-
      Exact immutable source corpus used by one ingestion run. Its identity is
      the authored source layer plus the digest of its canonical manifest.
      Source revision observations carry provenance separately; revisions do not
      participate in the representation or manifest identity.
    annotations:
      facets: sealed-origin, seed-owned, no-instance-declared
      no_instance_reason: >-
        The manifest contract is proven in Phase A tests; the next real-section
        slice will create the first production ingestion edition.
    slot_usage:
      source_layer:
        required: true
      source_layer_context:
        required: true
      source_manifest_format:
        required: true
      source_manifest_digest_algorithm:
        required: true
      source_manifest_digest:
        required: true
      source_representation_count:
        required: true
    slots:
      - source_layer
      - source_layer_context
      - source_manifest_format
      - source_manifest_digest_algorithm
      - source_manifest_digest
      - source_representation_count

  SourceSelector:
    is_a: Entity
    abstract: true
    mixins:
      - Addressable
    description: >-
      Typed coordinates selecting one fragment of a source
      representation. Selector subclasses own their coordinate grammar;
      no discriminator string chooses semantics at runtime.

  ByteRangeSelector:
    is_a: SourceSelector
    description: >-
      Half-open byte range [start, end) within one immutable source
      representation. Equal bounds select an empty leaf.
    slot_usage:
      source_byte_start:
        required: true
      source_byte_end:
        required: true
    slots:
      - source_byte_start
      - source_byte_end

  TextQuoteSelector:
    is_a: SourceSelector
    description: >-
      Supporting exact text plus optional immediate context. It aids
      inspection and convergence checks but never owns leaf identity.
    slot_usage:
      source_quote_exact:
        required: true
    slots:
      - source_quote_exact
      - source_quote_prefix
      - source_quote_suffix

  SourceTarget:
    is_a: Entity
    mixins:
      - Addressable
    description: >-
      One source representation plus its canonical primary selector.
      An optional quote selector is supporting evidence and must converge
      on the same fragment.
    slot_usage:
      target_representation:
        required: true
      target_primary_selector:
        required: true
    slots:
      - target_representation
      - target_primary_selector
      - target_quote_selector

  OntologyMetaContext:
    is_a: KnowledgeContext
    description: Engine-owned scope containing one active ontology reflection.
    annotations:
      facets: ontology-meta

  OntologyMetaEntity:
    is_a: Entity
    abstract: true
    description: One canonical definition retained by OntologyRegistry.
    annotations:
      facets: ontology-meta
    slot_usage:
      qualified_key:
        required: true
      ontology_name:
        required: true
    slots:
      - qualified_key
      - ontology_name

  OntologySourcedMeta:
    mixin: true
    abstract: true
    description: Ontology definition that retains diagnostic source provenance.
    slot_usage:
      definition_source:
        required: true
    slots:
      - definition_source

  OntologyClassMeta:
    is_a: OntologyMetaEntity
    mixins:
      - OntologySourcedMeta
    slot_usage:
      class_abstract:
        required: true
      has_direct_parent:
        required: true
    slots:
      - class_abstract
      - has_direct_parent

  OntologyPropertyMeta:
    is_a: OntologyMetaEntity
    mixins:
      - OntologySourcedMeta
    slot_usage:
      property_required:
        required: true
      property_identifier:
        required: true
      property_create_only:
        required: true
      has_minimum:
        required: true
      has_maximum:
        required: true
      has_reference_target:
        required: true
      has_enum_type:
        required: true
    slots:
      - property_required
      - property_identifier
      - property_create_only
      - has_minimum
      - minimum_value
      - has_maximum
      - maximum_value
      - has_reference_target
      - has_enum_type

  OntologyRelationMeta:
    is_a: OntologyMetaEntity
    mixins:
      - OntologySourcedMeta

  OntologyFacetMeta:
    is_a: OntologyMetaEntity

  OntologyValueKindMeta:
    is_a: OntologyMetaEntity

  OntologyEnumMeta:
    is_a: OntologyMetaEntity
    mixins:
      - OntologySourcedMeta

  OntologyEnumMemberMeta:
    is_a: OntologyMetaEntity
    mixins:
      - OntologySourcedMeta

  Expression:
    is_a: Entity
    abstract: true
    description: >-
      Abstract root of pure rule-language value expressions.

      INERT. Nothing evaluates any of the classes below this one. There
      are no literal types and no operator types, so nothing could be
      built out of them yet even in principle, and there is no
      evaluator to run it if it were. A reader of this ontology must
      not conclude that the engine can compute with these.

      Said here rather than left to inference, because a formula
      written down and never executed is the fleet's most repeated
      mistake: malleus RECIPES.md recipe 4 counts five projects that
      did it before us, and this pack is the sixth. The rite that
      catches it inspects slot NAMES, which is why it never flagged
      this one: the inertia lives in class names it cannot see.

      What is blocked on it, concretely, so that the first operators
      get chosen by need rather than by taste. The Cepheus muster-out
      rule needs a rate over a filtered count, "one benefit per term
      served in which they did not lose benefits", and its extractor
      says exactly that in `unmodelled`. The injury table needs a
      clause that refers back to a choice made earlier in its own
      sequence, "reduce BOTH OTHER physical characteristics". Both are
      recorded as partial rather than pretended whole, and both are
      waiting on this.

  ScalarExpression:
    is_a: Expression
    abstract: true

  BooleanExpression:
    is_a: ScalarExpression
    abstract: true

  NumericExpression:
    is_a: ScalarExpression
    abstract: true
    description: Numeric result that may be an integer or finite float.

  IntegerExpression:
    is_a: NumericExpression
    abstract: true

  FloatExpression:
    is_a: NumericExpression
    abstract: true

  StringExpression:
    is_a: ScalarExpression
    abstract: true

  EntityExpression:
    is_a: Expression
    abstract: true
    description: Entity-valued expression refined by an ontology class.

  CollectionExpression:
    is_a: Expression
    abstract: true

  BooleanCollectionExpression:
    is_a: CollectionExpression
    abstract: true

  IntegerCollectionExpression:
    is_a: CollectionExpression
    abstract: true

  FloatCollectionExpression:
    is_a: CollectionExpression
    abstract: true

  StringCollectionExpression:
    is_a: CollectionExpression
    abstract: true

  EntityCollectionExpression:
    is_a: CollectionExpression
    abstract: true
    description: Entity collection refined by one ontology element class.

  FunctionExpression:
    is_a: Expression
    abstract: true
    description: Function value refined by a typed signature.

  OutcomePlanExpression:
    is_a: Expression
    abstract: true
    description: Pure expression producing a typed Outcome plan.

  ValueTypeDescriptor:
    is_a: Entity
    mixins:
      - Addressable
    abstract: true
    description: Closed reusable static type owned by one KnowledgeContext.

  BooleanTypeDescriptor:
    is_a: ValueTypeDescriptor

  NumericTypeDescriptor:
    is_a: ValueTypeDescriptor

  IntegerTypeDescriptor:
    is_a: ValueTypeDescriptor

  FloatTypeDescriptor:
    is_a: ValueTypeDescriptor

  StringTypeDescriptor:
    is_a: ValueTypeDescriptor

  EntityTypeDescriptor:
    is_a: ValueTypeDescriptor
    slot_usage:
      descriptor_entity_class:
        required: true
    slots:
      - descriptor_entity_class

  BooleanCollectionTypeDescriptor:
    is_a: ValueTypeDescriptor

  IntegerCollectionTypeDescriptor:
    is_a: ValueTypeDescriptor

  FloatCollectionTypeDescriptor:
    is_a: ValueTypeDescriptor

  StringCollectionTypeDescriptor:
    is_a: ValueTypeDescriptor

  EntityCollectionTypeDescriptor:
    is_a: ValueTypeDescriptor
    slot_usage:
      descriptor_element_class:
        required: true
    slots:
      - descriptor_element_class

  FunctionTypeDescriptor:
    is_a: ValueTypeDescriptor
    slot_usage:
      descriptor_function_signature:
        required: true
    slots:
      - descriptor_function_signature

  OutcomePlanTypeDescriptor:
    is_a: ValueTypeDescriptor

  FunctionSignature:
    is_a: Entity
    mixins:
      - Addressable
    description: Named non-empty parameter set and one result type.
    slot_usage:
      signature_result_type:
        required: true
    slots:
      - signature_result_type

  FunctionParameterSpec:
    is_a: Entity
    mixins:
      - Addressable
    description: One uniquely named parameter in a FunctionSignature.
    slot_usage:
      parameter_key:
        required: true
      parameter_type:
        required: true
    slots:
      - parameter_key
      - parameter_type

  ArgumentBinding:
    is_a: Entity
    description: Unordered named argument bound directly to a parameter spec.
    slot_usage:
      binding_parameter:
        required: true
      binding_argument:
        required: true
    slots:
      - binding_parameter
      - binding_argument

  ParameterReadExpression:
    mixin: true
    abstract: true
    description: Typed read of one invocation parameter specification.
    slot_usage:
      parameter_spec:
        required: true
    slots:
      - parameter_spec

  ReadParameterBooleanExpression:
    is_a: BooleanExpression
    mixins:
      - ParameterReadExpression

  ReadParameterNumericExpression:
    is_a: NumericExpression
    mixins:
      - ParameterReadExpression

  ReadParameterIntegerExpression:
    is_a: IntegerExpression
    mixins:
      - ParameterReadExpression

  ReadParameterFloatExpression:
    is_a: FloatExpression
    mixins:
      - ParameterReadExpression

  ReadParameterStringExpression:
    is_a: StringExpression
    mixins:
      - ParameterReadExpression

  ReadParameterEntityExpression:
    is_a: EntityExpression
    mixins:
      - ParameterReadExpression

  ReadParameterBooleanCollectionExpression:
    is_a: BooleanCollectionExpression
    mixins:
      - ParameterReadExpression

  ReadParameterIntegerCollectionExpression:
    is_a: IntegerCollectionExpression
    mixins:
      - ParameterReadExpression

  ReadParameterFloatCollectionExpression:
    is_a: FloatCollectionExpression
    mixins:
      - ParameterReadExpression

  ReadParameterStringCollectionExpression:
    is_a: StringCollectionExpression
    mixins:
      - ParameterReadExpression

  ReadParameterEntityCollectionExpression:
    is_a: EntityCollectionExpression
    mixins:
      - ParameterReadExpression

  ReadParameterFunctionExpression:
    is_a: FunctionExpression
    mixins:
      - ParameterReadExpression

  ReadParameterOutcomePlanExpression:
    is_a: OutcomePlanExpression
    mixins:
      - ParameterReadExpression

  LocalBinding:
    is_a: Entity
    description: Eager lexical binding with direct identity and typed value.
    slot_usage:
      binding_key:
        required: true
      binding_value:
        required: true
    slots:
      - binding_key
      - binding_value

  LocalReadExpression:
    mixin: true
    abstract: true
    description: Typed direct reference to one LocalBinding entity.
    slot_usage:
      local_binding:
        required: true
    slots:
      - local_binding

  ReadLocalBooleanExpression:
    is_a: BooleanExpression
    mixins:
      - LocalReadExpression

  ReadLocalNumericExpression:
    is_a: NumericExpression
    mixins:
      - LocalReadExpression

  ReadLocalIntegerExpression:
    is_a: IntegerExpression
    mixins:
      - LocalReadExpression

  ReadLocalFloatExpression:
    is_a: FloatExpression
    mixins:
      - LocalReadExpression

  ReadLocalStringExpression:
    is_a: StringExpression
    mixins:
      - LocalReadExpression

  ReadLocalEntityExpression:
    is_a: EntityExpression
    mixins:
      - LocalReadExpression

  ReadLocalBooleanCollectionExpression:
    is_a: BooleanCollectionExpression
    mixins:
      - LocalReadExpression

  ReadLocalIntegerCollectionExpression:
    is_a: IntegerCollectionExpression
    mixins:
      - LocalReadExpression

  ReadLocalFloatCollectionExpression:
    is_a: FloatCollectionExpression
    mixins:
      - LocalReadExpression

  ReadLocalStringCollectionExpression:
    is_a: StringCollectionExpression
    mixins:
      - LocalReadExpression

  ReadLocalEntityCollectionExpression:
    is_a: EntityCollectionExpression
    mixins:
      - LocalReadExpression

  ReadLocalFunctionExpression:
    is_a: FunctionExpression
    mixins:
      - LocalReadExpression

  ReadLocalOutcomePlanExpression:
    is_a: OutcomePlanExpression
    mixins:
      - LocalReadExpression

  LetExpression:
    mixin: true
    abstract: true
    description: Eager non-empty multi-binding lexical block marker.

  LetBooleanExpression:
    is_a: BooleanExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: BooleanExpression
        required: true
    slots:
      - let_body

  LetNumericExpression:
    is_a: NumericExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: NumericExpression
        required: true
    slots:
      - let_body

  LetIntegerExpression:
    is_a: IntegerExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: IntegerExpression
        required: true
    slots:
      - let_body

  LetFloatExpression:
    is_a: FloatExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: FloatExpression
        required: true
    slots:
      - let_body

  LetStringExpression:
    is_a: StringExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: StringExpression
        required: true
    slots:
      - let_body

  LetEntityExpression:
    is_a: EntityExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: EntityExpression
        required: true
    slots:
      - let_body

  LetBooleanCollectionExpression:
    is_a: BooleanCollectionExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: BooleanCollectionExpression
        required: true
    slots:
      - let_body

  LetIntegerCollectionExpression:
    is_a: IntegerCollectionExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: IntegerCollectionExpression
        required: true
    slots:
      - let_body

  LetFloatCollectionExpression:
    is_a: FloatCollectionExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: FloatCollectionExpression
        required: true
    slots:
      - let_body

  LetStringCollectionExpression:
    is_a: StringCollectionExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: StringCollectionExpression
        required: true
    slots:
      - let_body

  LetEntityCollectionExpression:
    is_a: EntityCollectionExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: EntityCollectionExpression
        required: true
    slots:
      - let_body

  LetFunctionExpression:
    is_a: FunctionExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: FunctionExpression
        required: true
    slots:
      - let_body

  LetOutcomePlanExpression:
    is_a: OutcomePlanExpression
    mixins:
      - LetExpression
    slot_usage:
      let_body:
        range: OutcomePlanExpression
        required: true
    slots:
      - let_body

# -------------------------------------------------------------------
# Relations
#
# One concrete class per member of the two relation enums above, each
# pinning its predicate with equals_string and declaring both
# endpoints. The endpoints were annotations on the enum members until
# 2026-08-16; they moved here because malleus asks for the contract on
# the Relation subclass, and because two declarations of one fact is
# one too many. The generator reads these.
#
# Unlike the engine root's relations, every one of these is narrow on
# both sides. These links are closed ownership edges inside the meta
# graph and inside stored rule programs, so the endpoint pair is known
# exactly rather than inferred from call sites.
# -------------------------------------------------------------------

  OntologyMetaContainsRelation:
    is_a: Relation
    description: A meta context contains a meta entity.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_META_CONTAINS
      source_id:
        range: OntologyMetaContext
      target_id:
        range: OntologyMetaEntity

  OntologyClassDirectParentRelation:
    is_a: Relation
    description: A class meta points at its direct parent class meta.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_CLASS_DIRECT_PARENT
      source_id:
        range: OntologyClassMeta
      target_id:
        range: OntologyClassMeta

  OntologyClassHasFacetRelation:
    is_a: Relation
    description: A class meta carries a facet meta.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_CLASS_HAS_FACET
      source_id:
        range: OntologyClassMeta
      target_id:
        range: OntologyFacetMeta

  OntologyPropertyDeclaringClassRelation:
    is_a: Relation
    description: A property meta points at the class that declares it.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_PROPERTY_DECLARING_CLASS
      source_id:
        range: OntologyPropertyMeta
      target_id:
        range: OntologyClassMeta

  OntologyPropertyValueKindRelation:
    is_a: Relation
    description: A property meta points at its value kind.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_PROPERTY_VALUE_KIND
      source_id:
        range: OntologyPropertyMeta
      target_id:
        range: OntologyValueKindMeta

  OntologyPropertyReferenceTargetRelation:
    is_a: Relation
    description: A reference-valued property meta names its target class.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_PROPERTY_REFERENCE_TARGET
      source_id:
        range: OntologyPropertyMeta
      target_id:
        range: OntologyClassMeta

  OntologyPropertyEnumTypeRelation:
    is_a: Relation
    description: An enum-valued property meta names its enum.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_PROPERTY_ENUM_TYPE
      source_id:
        range: OntologyPropertyMeta
      target_id:
        range: OntologyEnumMeta

  OntologyRelationValidSourceRelation:
    is_a: Relation
    description: A relation meta names a class valid as its source.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_RELATION_VALID_SOURCE
      source_id:
        range: OntologyRelationMeta
      target_id:
        range: OntologyClassMeta

  OntologyRelationValidTargetRelation:
    is_a: Relation
    description: A relation meta names a class valid as its target.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_RELATION_VALID_TARGET
      source_id:
        range: OntologyRelationMeta
      target_id:
        range: OntologyClassMeta

  OntologyEnumHasMemberRelation:
    is_a: Relation
    description: An enum meta carries a member meta.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_ENUM_HAS_MEMBER
      source_id:
        range: OntologyEnumMeta
      target_id:
        range: OntologyEnumMemberMeta

  OntologyEnumMemberOwnerRelation:
    is_a: Relation
    description: A member meta points back at the enum that owns it.
    slot_usage:
      relation_type:
        range: OntologyMetaRelationType
        required: true
        equals_string: ONTOLOGY_ENUM_MEMBER_OWNER
      source_id:
        range: OntologyEnumMemberMeta
      target_id:
        range: OntologyEnumMeta

  FunctionSignatureHasParameterRelation:
    is_a: Relation
    description: A function signature owns a typed parameter spec.
    slot_usage:
      relation_type:
        range: RuleLanguageRelationType
        required: true
        equals_string: FUNCTION_SIGNATURE_HAS_PARAMETER
      source_id:
        range: FunctionSignature
      target_id:
        range: FunctionParameterSpec

  EditionIncludesRepresentationRelation:
    is_a: Relation
    description: An ingestion edition contains one exact source representation.
    slot_usage:
      relation_type:
        range: RuleLanguageRelationType
        required: true
        equals_string: EDITION_INCLUDES_REPRESENTATION
      source_id:
        range: IngestionEditionContext
      target_id:
        range: SourceRepresentationContext

  LetExpressionHasBindingRelation:
    is_a: Relation
    description: >-
      A let expression owns a local binding.

      The source is Expression rather than LetExpression, and the
      difference is forced. LetExpression is a MIXIN marker, not an
      Entity subtype, so it cannot be an endpoint: an endpoint names a
      class instances can belong to. The thirteen classes that carry
      the marker (LetBooleanExpression through LetOutcomePlanExpression,
      one per result family) all descend from Expression, which is the
      narrowest Entity subtype that covers them. This is wider than the
      truth by exactly the non-let expressions, and it is as narrow as
      the type system permits.

      This endpoint read LetExpression until 2026-08-16 and was always
      wrong; the old enum-annotation path only checked that the name
      was a class, and a mixin is a class.
    slot_usage:
      relation_type:
        range: RuleLanguageRelationType
        required: true
        equals_string: LET_EXPRESSION_HAS_BINDING
      source_id:
        range: Expression
      target_id:
        range: LocalBinding

slots:
  context_key:
    range: string
    annotations:
      create_only: true
    description: Globally unique immutable identity of a KnowledgeContext.

  context_kind:
    range: string
    description: Host-defined runtime scope vocabulary.

  source_layer:
    range: string
    description: Authored layer declared by a seed envelope.

  source_file:
    range: string
    description: Path of the source document relative to its source root.

  source_commit:
    range: string
    description: >-
      Legacy Git commit pin of a SourceDocumentContext. New source revision
      observations use source_revision because source systems are not required
      to be Git repositories.

  source_revision:
    range: string
    description: >-
      Exact source-system revision retained in a separate provenance observation.
      Revision does not participate in content identity; exact bytes do.

  source_media_type:
    range: SourceMediaType
    description: Closed media kind governing valid primary selectors.

  source_digest_algorithm:
    range: SourceDigestAlgorithm
    description: Cryptographic algorithm used by source_digest.

  source_digest:
    range: source_digest
    description: Digest of the exact source representation bytes.

  source_manifest_format:
    range: SourceManifestFormat
    annotations:
      create_only: true
    description: Canonical encoding used to produce the source manifest digest.

  source_manifest_digest_algorithm:
    range: SourceDigestAlgorithm
    annotations:
      create_only: true
    description: Cryptographic algorithm used by source_manifest_digest.

  source_manifest_digest:
    range: source_digest
    annotations:
      create_only: true
    description: Digest of the edition's canonical source manifest.

  source_representation_count:
    range: integer
    minimum_value: 1
    annotations:
      create_only: true
    description: Exact number of representations in the source manifest.

  source_byte_length:
    range: integer
    minimum_value: 0
    description: Exact size of the source representation in bytes.

  source_byte_start:
    range: integer
    minimum_value: 0
    description: Inclusive zero-based byte position in a representation.

  source_byte_end:
    range: integer
    minimum_value: 0
    description: Exclusive zero-based byte position in a representation.

  source_quote_exact:
    range: string
    description: Exact decoded text expected at the primary selector.

  source_quote_prefix:
    range: string
    description: Optional text immediately before the selected text.

  source_quote_suffix:
    range: string
    description: Optional text immediately after the selected text.

  target_representation:
    range: SourceRepresentationContext
    annotations:
      create_only: true
    description: Exact immutable source representation being selected.

  target_primary_selector:
    range: SourceSelector
    annotations:
      create_only: true
    description: Canonical selector that owns target identity.

  target_quote_selector:
    range: TextQuoteSelector
    annotations:
      create_only: true
    description: Optional supporting quote required to match the primary.

  source_layer_context:
    range: SourceLayerContext
    annotations:
      create_only: true
    description: Immutable parent source layer of a document context.

  identity_context:
    range: KnowledgeContext
    annotations:
      create_only: true
    description: Immutable context component of portable entity identity.

  entity_key:
    range: string
    annotations:
      create_only: true
    description: Immutable machine key within a context and concrete type.

  qualified_key:
    range: string
    annotations:
      create_only: true
    description: Canonical qualified reference of a reflected definition.

  ontology_name:
    range: string
    annotations:
      create_only: true
    description: Exact registry name of a reflected definition.

  definition_source:
    range: string
    annotations:
      create_only: true
    description: Diagnostic source provenance retained by the registry.

  class_abstract:
    range: boolean
    annotations:
      create_only: true

  has_direct_parent:
    range: boolean
    annotations:
      create_only: true

  property_required:
    range: boolean
    annotations:
      create_only: true

  property_identifier:
    range: boolean
    annotations:
      create_only: true

  property_create_only:
    range: boolean
    annotations:
      create_only: true

  has_minimum:
    range: boolean
    annotations:
      create_only: true

  minimum_value:
    range: Float64
    annotations:
      create_only: true

  has_maximum:
    range: boolean
    annotations:
      create_only: true

  maximum_value:
    range: Float64
    annotations:
      create_only: true

  has_reference_target:
    range: boolean
    annotations:
      create_only: true

  has_enum_type:
    range: boolean
    annotations:
      create_only: true

  descriptor_entity_class:
    range: OntologyClassMeta
    description: Exact canonical class refinement for an Entity value.

  descriptor_element_class:
    range: OntologyClassMeta
    description: Exact canonical element refinement for an Entity collection.

  descriptor_function_signature:
    range: FunctionSignature
    description: Exact signature refinement for a Function value.

  signature_result_type:
    range: ValueTypeDescriptor
    description: Reusable static type returned by a FunctionSignature.

  parameter_key:
    range: string
    description: Non-empty diagnostic and authoring key unique per signature.

  parameter_type:
    range: ValueTypeDescriptor
    description: Reusable static type required by this named parameter.

  binding_parameter:
    range: FunctionParameterSpec
    description: Exact signature parameter supplied by an argument binding.

  binding_argument:
    range: Expression
    description: Pure expression supplying the named argument value.

  parameter_spec:
    range: FunctionParameterSpec
    description: Exact signature parameter read by this typed expression.

  binding_key:
    range: string
    description: Non-empty diagnostic key unique within one let block.

  binding_value:
    range: Expression
    description: Pure expression evaluated once for this local binding.

  local_binding:
    range: LocalBinding
    description: Direct lexical binding identity, never a string lookup.

  let_body:
    range: Expression
    description: Typed body evaluated after every eager local binding.
