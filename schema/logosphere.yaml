id: https://logosphere.dev/schema
name: logosphere
title: Logosphere Game Engine Ontology
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  logosphere: https://logosphere.dev/schema/
  malleus: https://malleus.dev/schema/

imports:
  - linkml:types
  - malleus

# -------------------------------------------------------------------
# On Signal, which this engine imports and deliberately does not use
# -------------------------------------------------------------------
# The malleus root declares five primitives. This engine extends four
# of them. Nothing here subclasses Signal, and that is a decision
# rather than an oversight, so it is written down where the next person
# reads the schema instead of being inferred from silence.
#
# The candidate is real. Capability factors are derived qualities in
# everything but name: locomotion_factor and manipulation_factor are
# aggregated across body parts, a one-armed humanoid has
# manipulation_factor 0.5, and missing parts contribute zero with no
# special cases (include/logosphere/capability/capability_profile.h).
# That is precisely what the root describes: something measurable that
# emerges from activity, inheres in a bearer, and is recomputable from
# the underlying data.
#
# It stays out of the graph because it is recomputed every frame from
# live body state. Writing it here would make the KG a cache of physics
# that is stale the instant it is read, and the engine would then have
# two answers to the same question with no rule about which wins. The
# body IS the source of truth for what a body can do.
#
# What would change this: a derived quality that outlives a frame and
# that something other than the physics loop needs to read. A
# reputation that accumulates over a session, a fatigue that persists
# across scenes. If one of those arrives, it is a Signal and it belongs
# in the graph. Until then, an unused primitive that says why is more
# honest than a subtype nobody writes to.

# -------------------------------------------------------------------
# Enums
# -------------------------------------------------------------------

enums:
  MaterialType:
    description: Physical material classification.
    permissible_values:
      FLESH:
        description: Organic living tissue
      WOOD_SOFT:
        description: Softwood (pine, cedar)
      WOOD_HARD:
        description: Hardwood (oak, mahogany)
      LEAVES:
        description: Foliage material
      STONE:
        description: Natural stone
      CONCRETE:
        description: Poured concrete
      BRICK:
        description: Fired clay brick
      SAND:
        description: Loose sand
      DIRT:
        description: Packed earth
      IRON:
        description: Ferrous metal
      STEEL:
        description: Carbon steel alloy
      ALUMINUM:
        description: Light nonferrous metal
      GOLD:
        description: Dense precious metal
      LIGHT:
        description: Massless light emitter
      HEAVY_STATIC:
        description: >-
          Deprecated, and never what its name says. It is a density of
          10000 kg/m3 and nothing else: dense is not immovable, and a
          structure held up by weight gives way once something heavy
          enough leans on it. Only the turtle boundary is intrinsically
          immovable (INV-1); to make a body genuinely immovable set
          solver_authority KINEMATIC. For floor tiles use STONE plus
          bonding, which is what the strata generator does. Marked
          deprecated in src/materials.h and due to leave the enum;
          retained so existing scenes still compile.

  GluonType:
    description: >-
      Constraint type connecting two particles. These are the three bond
      kinds the engine actually builds. The vocabulary is kept equal to
      kg::KGGluonType (include/logosphere/kg/kg_types.h), which is what
      the entity manager and every generator switch on.

      Until 2026-08-13 this enum listed five values (NAIL, JOINT, CEMENT,
      GLUE, MAGIC) that no code had ever produced or consumed, while the
      three real kinds went unnamed. A schema reader learned a bond
      palette the engine does not have, which is the failure mode the
      ontology exists to prevent.
    permissible_values:
      NAIL:
        description: >-
          Rigid connection holding a fixed relative pose, failing at a
          declared breaking force. The default for assembled rigs.
      ORGANIC:
        description: >-
          Cohesive bond whose strength is derived, never declared: the
          breaking force is contact area times material tensile strength,
          and the force law follows from material and geometry (INV-9).
          This is what holds grown structures together.
      ELASTIC:
        description: >-
          Compliant connection modelling a real elastic element (tendon,
          ligament, knee). Compliance here is a physical model, not a
          numerical patch; see INV-5.

  JointType:
    description: Anatomical joint degree-of-freedom classification.
    permissible_values:
      BALL_SOCKET:
        description: 3 DOF (shoulder, hip)
      HINGE:
        description: 1 DOF flexion (elbow, knee)
      PIVOT:
        description: 1 DOF twist (forearm, ankle)
      FIXED:
        description: 0 DOF rigid attachment

  DamageType:
    description: Classification of damage inflicted.
    permissible_values:
      BLUNT:
        description: Impact from clubs, fists, falls
      SLASH:
        description: Cutting from blades and claws
      PIERCE:
        description: Penetration from arrows and fangs
      BITE:
        description: Creature bite damage
      FIRE:
        description: Heat and flame
      COLD:
        description: Frost and cold
      POISON:
        description: Toxic damage over time
      PURE:
        description: Ignores all resistances

  OdorType:
    description: Scent types for creature perception.
    permissible_values:
      NONE:
        description: No detectable odor
      LIVING_FLESH:
        description: Living humans and animals
      FRESH_MEAT:
        description: Recently killed raw meat
      BLOOD:
        description: Open wounds, blood pools
      DECAY:
        description: Rotting organic matter
      ROTTEN:
        description: Severely decomposed matter
      SMOKE:
        description: Fire and torch smoke

  MemoryLayer:
    description: Vision memory decay states.
    permissible_values:
      ACTIVE_VISION:
        description: Currently visible, full detail
      RECENT_MEMORY:
        description: Seen 0-10 seconds ago
      SHORT_MEMORY:
        description: Seen 10-60 seconds ago
      LONG_MEMORY:
        description: Seen 60+ seconds ago, significant drift

  FloorType:
    description: Ground surface material.
    permissible_values:
      GRASS:
        description: Green grass
      SAND:
        description: Beige sand
      STONE:
        description: Gray stone
      WOOD:
        description: Wood planks
      EARTH:
        description: Brown dirt

  TerrainKind:
    description: How ground is constructed (orthogonal to FloorType,
      which is surface material).
    permissible_values:
      LAYERED:
        description: >-
          Real earth: stacked, physics-settled particle layers
          (bonded bedrock slabs, rubble filler, loose topsoil).
          Craters under impacts. See StrataGenerator.
      SLAB:
        description: One flat static box. Cheap, inert, for pure
          backdrops.

  PatternId:
    description: Procedural surface texture pattern.
    permissible_values:
      NONE:
        description: Flat color
      WOOD:
      STONE:
      LEATHER:
      LINEN:
      COTTON:
      SILK:
      EMBROIDERY:
      SKIN:
      SKIN_REPTILE:
      HAIR:

  GOAPAction:
    description: >-
      The engine's generic GOAP action vocabulary: navigation, attention
      and frustration, meaningful in a farming game and a combat game
      equally. Diet actions (EAT, GRAB_PREY) were removed with #37 item
      3; they are creature policy, and a game declares its own action
      names in its own schema (see examples/predator). GOAP actions are
      strings at the planning layer, so this enum constrains nothing at
      runtime; it is the vocabulary a schema reader (or an LLM) learns
      the engine by, which is exactly why it must not teach them that
      the engine has a mouth.
    permissible_values:
      PURSUE:
        description: Navigate to a target location
      SCAN:
        description: Look around for targets
      ESCAPE_BLOCK:
        description: Navigate around obstacle
      INVESTIGATE_SMELL:
        description: Follow odor trail
      GIVE_UP:
        description: Abandon current action

  EntityModification:
    description: Modification state of an entity.
    permissible_values:
      NONE:
      DESTROYED:
      DAMAGED:
      PRUNED:
      FROZEN:

  BodyRegion:
    description: Anatomical region for animation targeting.
    permissible_values:
      FULL_BODY:
        description: All joints
      UPPER_BODY:
        description: Shoulders, elbows, wrists, spine, neck, head
      LOWER_BODY:
        description: Hips, knees, ankles, toes

  JointTarget:
    description: How a joint's rotation is determined.
    permissible_values:
      DRIVEN:
        description: Explicit angle in local space
      DIRECTION:
        description: Point toward world-space direction
      INHERIT:
        description: Follow parent rotation
      PHYSICS:
        description: Let gluon dynamics control
      SEMANTIC:
        description: Anatomical target (flex, abduct, twist)

  SemanticChannel:
    description: Anatomical motion axis.
    permissible_values:
      FLEX:
        description: Flexion/extension
      ABDUCT:
        description: Abduction/adduction
      TWIST:
        description: Internal/external rotation

  TransformationTrigger:
    description: >-
      When an event rule fires. Event rules are PUSHED: every value here
      names a class of occurrence that the interaction system consumes
      once per episode and then discards. Contrast the capability
      response rules, which are state predicates pulled over KG state
      and safe to re-evaluate. A condition that merely holds over time
      does not belong in this enum.

      The KG stores the value as a string on a TransformationRule. The
      loader normalizes case, so "ON_CONTACT" and "on_contact" both
      resolve; an unrecognized value warns and skips the whole rule,
      because a rule that cannot say when is not a rule.
    annotations:
      # The setProperty gate and the KGOp validator honor the loader's
      # case normalization: membership is checked case-folded. Only for
      # enums whose consumers normalize on read; everything else stays
      # exact.
      case_insensitive: true
    permissible_values:
      ON_CONTACT:
        description: >-
          Two particles exchanged rigid contact. Fires once per contact
          episode, carrying the contact geometry and both participants
          resolved to their KG entities.
      ON_CONTACT_FILTERED:
        description: >-
          A broad-phase overlap was excluded from the narrow phase
          because the pair's interaction profiles decline rigid contact.
          The pass-through counterpart of ON_CONTACT.
      ON_VOLUME_ENTER:
        description: >-
          A particle entered the volume of a particle whose profile
          declares a medium.
      ON_TIMER:
        description: An armed duration elapsed.

  TransformationEffect:
    description: >-
      The engine's built-in event-rule effects. This enum is a FLOOR,
      not a closed range, which is why the `effect` slot is typed string
      and not typed to this enum: games register their own effects by
      name through the interaction effect registry, and such a name is
      an equally legal value. Declaring the range closed here would say
      something false about the slot.

      Effect syntax is "<name>" or "<name>:<args>", matching the
      capability effect registry. An effect the registry does not know
      warns and skips.

      Engine effects stay mechanism, never policy. KNOCKBACK delivers an
      impulse; what a push does to a walking creature is the game's to
      decide. Bleeding, armour absorption and their kin are game
      effects and deliberately absent here.
    permissible_values:
      SWAP_PROFILE:
        description: Write a different interaction profile onto the particle.
      FADE_OUT:
        description: Ramp alpha to zero over duration_s, then delete.
      DELETE:
        description: Queue the particle for deferred deletion.
      EMIT_EVENT:
        description: Emit a TransformationEvent naming the rule that fired.
      KNOCKBACK:
        description: >-
          Deposit an impulse along the contact normal into the
          particle's pending-impulse inbox. Does NOT move the particle:
          a KINEMATIC body's position is owned by an external writer, so
          the impulse is delivered to that owner to apply or ignore.
          Requires a contact trigger, which is where the normal comes
          from.

  WorldEventType:
    description: Classification of game world events.
    permissible_values:
      COLLISION:
      DAMAGE:
      SPAWN:
      DEATH:
      PERCEPTION:
      CONSTRAINT_BREAK:
      GROWTH:
      STATE_CHANGE:
      RELATION_CREATED:
        description: A relation was created between two entities.
      RELATION_REMOVED:
        description: A relation was removed between two entities.

  SolverAuthority:
    description: >-
      Who owns a body's position, and the ONLY way to make something
      immovable. Rest is not immobility: rest is a solver
      optimisation that a heavy enough touch undoes, so a structure
      held up by rest collapses the moment something walks on it.
      Choose authority deliberately; do not rely on stillness.
    permissible_values:
      DYNAMIC:
        description: >-
          Physics owns it. Gravity pulls it, contacts push it,
          impulses move it. The default, and right for anything
          loose, alive, or meant to be knocked about.
      KINEMATIC:
        description: >-
          An external writer owns this body's position RIGHT NOW:
          animation, locomotion, a scripted driver. Physics will not
          move it while that lasts, and it still collides, so things
          land on it.

          It is a TRANSIENT AUTHORITY, not a label. Whoever sets it
          owns releasing it: a body left KINEMATIC after its driver
          stops can never fall, tip or ragdoll again. Driving complex
          animation through physics is the thing this escape hatch
          exists to avoid - nothing else.

          NOT for scenery. Terrain, floors and worlds are not
          immovable by declaration (INV-1: the turtle boundary is the
          only intrinsically immovable thing). They rest on the
          turtle, on anchored bonds, or on the modelled EFFECT of the
          mass we choose not to simulate - which is also where
          gravity comes from. A body that should float escapes the
          field; it is not nailed to the air.

  WorldRelationType:
    description: Relation types between game world entities.
    permissible_values:
      HAS_PART:
        description: Composition (humanoid has_part torso)
      HAS_REGIONAL_PART:
        description: Spatial subdivision (arm has_regional_part forearm)
      HAS_CONSTRAINT:
        description: Physics constraint link
      CONTAINS:
        description: Spatial containment (chest contains item)
      SUPPORTS:
        description: Physical support (floor supports entity)
      ILLUMINATES:
        description: Light source reaches entity
        annotations:
          # Declared because they are KNOWN, not guessed. Only a
          # LightSource illuminates, which is what that class exists
          # for, and only something in the world can be lit.
          #
          # The rest of this enum stays at the Entity default until its
          # endpoints are evidenced the same way. HAS_PART alone has
          # 125 call sites and legitimately links a humanoid to a
          # torso, a procedure to a step and a table to a row, so it is
          # (Entity, Entity) in truth and not by neglect. SUPPORTS and
          # BURNS have no creation site anywhere in the repo, so there
          # is nothing to learn their shape from yet.
          valid_source_types: LightSource
          valid_target_types: WorldEntity
      BURNS:
        description: Fire spread between entities
      PERCEIVES:
        description: Agent perceives target entity
      MANAGES:
        description: System entity manages another entity
      BONDED_TO:
        description: >-
          Direct bond between two bodies - the engine's cement. The
          bond is a physical constraint at bond_strength; strong
          bonds make many particles behave as one rigid body, weak
          ones give under load. Use it to fix things in place
          relative to each other rather than to the world.
      SPECIALIZES:
        description: >-
          A narrower thing refines a broader one: the specialization
          points at what it specializes (Slug Rifle SPECIALIZES Gun
          Combat in a skill cascade). Generic taxonomy vocabulary,
          first used by the rulebook module's skill cascades.

# -------------------------------------------------------------------
# Mixins (cross-cutting traits for game entities)
# -------------------------------------------------------------------

classes:
  Spatial:
    mixin: true
    description: Entity with a position and orientation in 3D space.
    slots:
      - position_x
      - position_y
      - position_z
      - facing_angle
      # Legacy world-position + chunk stamps: createEntityAtPosition
      # and the generators write these keys directly. Declared so the
      # setProperty gate (Malleus H1) sees what the engine writes;
      # unifying x/y/z with position_* is tracked follow-up work.
      - x
      - y
      - z
      - chunk_x
      - chunk_y

  HasMaterial:
    mixin: true
    description: Entity made of a physical material.
    slots:
      - material_type
      - material_density
      - material_friction
      - material_strength

  HasHealth:
    mixin: true
    description: Entity that can take damage and die.
    slots:
      - health
      - max_health

  EmitsLight:
    mixin: true
    description: Entity that emits light and can be seen from a distance.
    slots:
      - emission_strength
      - emission_radius

  HasSimpleAppearance:
    mixin: true
    description: >-
      The simple-entity contract read by the engine's
      simple_entity_activator (src/entities/simple_entity.cpp): one
      particle built from a uniform size plus RGB color. Runtime keys
      are the slot names verbatim. Known drift siblings, unification
      pending an owner ruling: PhysicsRock.color_r/g/b and
      CelestialBody.moon_r/g/b.
    slots:
      - size
      - r
      - g
      - b

  HasPhysicalCapability:
    mixin: true
    description: Physical performance attributes of a body component or agent.
    slots:
      - part_strength
      - part_max_strength
      - part_flexibility
      - part_responsiveness
      - part_endurance

  HasTissue:
    mixin: true
    description: Tissue-level health tracking for body parts. Different damage types affect different tissues.
    slots:
      - muscle_health
      - nerve_health
      - tendon_health
      - bone_health

  HasOdor:
    mixin: true
    description: Entity that produces a detectable scent.
    slots:
      - odor_type

  HasSolverAuthority:
    mixin: true
    description: >-
      Carries who owns this body's position. Every body in the world
      has it, because immobility is always a choice, never an
      accident of being still.
    slots:
      - solver_authority

  Bondable:
    mixin: true
    description: >-
      Can be cemented to other bodies through a BONDED_TO relation.
      bond_strength is how much load the join carries before it
      gives.
    slots:
      - bond_strength

  Destructible:
    mixin: true
    description: Entity that can be damaged or destroyed.
    slots:
      - damage_threshold
      - modification_state

  Growable:
    mixin: true
    description: Entity that grows over time via procedural generation.
    slots:
      - growth_iteration
      - is_mature
      - species
      - growth_enabled
      - growth_time_created
      - growth_time_last_simulated
      - growth_rate_per_year
      - growth_max_iterations
      - method

# -------------------------------------------------------------------
# Entity type hierarchy
# -------------------------------------------------------------------

  WorldEntity:
    is_a: Entity
    description: Base for all entities in the game world.
    abstract: true
    mixins:
      - Statusable
      - Spatial
      - HasSolverAuthority
      - Bondable

  LivingEntity:
    is_a: WorldEntity
    description: An entity that is alive and can take damage.
    abstract: true
    annotations:
      # Open by design: CapabilityStore::write_back publishes one key
      # per game-registered capability (capability.<name>); what
      # capabilities exist is game policy, so the vocabulary cannot be
      # closed here. The five aggregates the engine itself always
      # writes are exact typed slots below, not namespace passengers.
      kg_key_namespaces: "capability."
    mixins:
      - HasHealth
      - HasMaterial
      - HasOdor
    slots:
      # Aggregated capability profile, written back to the creature
      # entity by CapabilityStore::write_back (capability_store.cpp).
      - capability_speed_cap
      - capability_locomotion
      - capability_manipulation
      - capability_rotation
      - capability_perception
      # FORGE capability aggregation, written by the generators and
      # body_plan on the creature entity. The runtime keys are dotted
      # (cap.<name>.<field>); the slot names carry the kg_key
      # annotation because dots are not legal C++ identifiers in the
      # generated header. The six capability names are the engine's
      # own; a game adding a capability declares its keys in its YAML.
      - cap_locomotion_expected_count
      - cap_locomotion_default_mode
      - cap_manipulation_expected_count
      - cap_manipulation_default_mode
      - cap_rotation_expected_count
      - cap_rotation_default_mode
      - cap_perception_expected_count
      - cap_perception_default_mode
      - cap_flight_expected_count
      - cap_flight_default_mode
      - cap_undulation_expected_count
      - cap_undulation_default_mode
      - cap_undulation_normalize
      # Rule-group gates: games bundle response rules into named groups
      # and flip them as a set (capability_profile.cpp reads
      # rule_group.0-7.{name,enabled} on the creature entity).
      - rule_group_0_name
      - rule_group_0_enabled
      - rule_group_1_name
      - rule_group_1_enabled
      - rule_group_2_name
      - rule_group_2_enabled
      - rule_group_3_name
      - rule_group_3_enabled
      - rule_group_4_name
      - rule_group_4_enabled
      - rule_group_5_name
      - rule_group_5_enabled
      - rule_group_6_name
      - rule_group_6_enabled
      - rule_group_7_name
      - rule_group_7_enabled
      # Rig anchors shared across creature kinds (humanoid, butterfly,
      # snake): stable KGParticleIDs of named body particles.
      - head_particle
      - abdomen_particle

  Humanoid:
    is_a: LivingEntity
    description: Bipedal creature with full skeletal anatomy.
    mixins:
      - Agent
    slots:
      # Body geometry + gait parameters the humanoid generator writes.
      - height
      - walk_speed
      - run_speed
      - walk_frequency
      - run_frequency
      - leg_spacing
      - shoulder_offset
      - ear_offset
      - reflexes_ms
      - grit_W
      # Rig bookkeeping: stable KGParticleIDs of named skeleton
      # particles, plus comma-separated limb chains.
      - hips_particle
      - center_particle
      - torso_particle
      - camera_follow_particle
      - neck_particle
      - left_arm_particles
      - right_arm_particles
      - left_leg_particles
      - right_leg_particles

  Creature:
    is_a: LivingEntity
    description: Non-humanoid living entity.
    abstract: true
    mixins:
      - Agent

  Structure:
    is_a: WorldEntity
    description: Built or placed structure.
    abstract: true
    mixins:
      - HasMaterial

  Wall:
    is_a: Structure
    description: Wall segment.

  WallBlock:
    is_a: Wall
    description: Individual wall block unit.

  Floor:
    is_a: Structure
    description: Floor or terrain surface.
    slots:
      - floor_type
      - terrain
      - floor_kind
      - layer_index
      - layer_name
      # Ground tint, stamped at creation by games (logogenesis) and
      # free for terrain builders to consume. Shared class, shared
      # vocabulary: every game colors its ground.
      - ground_r
      - ground_g
      - ground_b

  FloorChunk:
    is_a: Floor
    description: Chunk-sized floor region.

  FloorTile:
    is_a: Floor
    description: Individual floor tile within a chunk.

  # Celestial bodies (CelestialBody, Sky, Planet) moved to the space
  # setting pack: schema/packs/space.yaml. The core describes what the
  # engine understands and knows no astronomy; a world gains a sky by
  # asking for the pack. See docs/ONTOLOGY_LAYERS.md.
  # Earth-like life and terrain (Plant, Tree, Grass, Rock, Snake,
  # Butterfly, Totem and their vocabulary) moved to the earth setting
  # pack: schema/packs/earth.yaml. The core keeps the abstract bases
  # they hang from - LivingEntity, Creature, NaturalFormation,
  # Structure - because the engine reasons about those.
  # See docs/ONTOLOGY_LAYERS.md.
  NaturalFormation:
    is_a: WorldEntity
    description: Natural geological formation.
    abstract: true
    mixins:
      - HasMaterial
      - Destructible

  LightSource:
    is_a: WorldEntity
    description: Entity that emits light.
    mixins:
      - EmitsLight
      - HasSimpleAppearance

  BodyPart:
    is_a: WorldEntity
    description: Anatomical part of a living entity.
    abstract: true
    annotations:
      # Open by design: emit_event forwards rule.<i>.payload.* verbatim
      # as WorldEvent payload; the keys are the game's to choose. Keys
      # under these prefixes pass the setProperty gate untyped.
      kg_key_namespaces: "rule.0.payload., rule.1.payload., rule.2.payload., rule.3.payload., rule.4.payload., rule.5.payload., rule.6.payload., rule.7.payload."
    mixins:
      - HasMaterial
      - HasHealth
      - HasPhysicalCapability
      - HasTissue
    slots:
      - body_part_name
      - body_part
      # FORGE capability contribution of this part, written by the
      # generators and body_plan. Runtime keys are dotted (see the
      # kg_key note on LivingEntity).
      - cap_list
      - cap_locomotion_weight
      - cap_locomotion_side
      - cap_manipulation_weight
      - cap_manipulation_side
      - cap_rotation_weight
      - cap_rotation_side
      - cap_perception_weight
      - cap_perception_side
      - cap_flight_weight
      - cap_flight_side
      - cap_undulation_weight
      - cap_undulation_side
      - rule_0_trigger
      - rule_0_effect
      - rule_0_effect_2
      - rule_0_effect_3
      - rule_0_effect_4
      - rule_0_cascade
      - rule_0_group
      - rule_1_trigger
      - rule_1_effect
      - rule_1_effect_2
      - rule_1_effect_3
      - rule_1_effect_4
      - rule_1_cascade
      - rule_1_group
      - rule_2_trigger
      - rule_2_effect
      - rule_2_effect_2
      - rule_2_effect_3
      - rule_2_effect_4
      - rule_2_cascade
      - rule_2_group
      - rule_3_trigger
      - rule_3_effect
      - rule_3_effect_2
      - rule_3_effect_3
      - rule_3_effect_4
      - rule_3_cascade
      - rule_3_group
      - rule_4_trigger
      - rule_4_effect
      - rule_4_effect_2
      - rule_4_effect_3
      - rule_4_effect_4
      - rule_4_cascade
      - rule_4_group
      - rule_5_trigger
      - rule_5_effect
      - rule_5_effect_2
      - rule_5_effect_3
      - rule_5_effect_4
      - rule_5_cascade
      - rule_5_group
      - rule_6_trigger
      - rule_6_effect
      - rule_6_effect_2
      - rule_6_effect_3
      - rule_6_effect_4
      - rule_6_cascade
      - rule_6_group
      - rule_7_trigger
      - rule_7_effect
      - rule_7_effect_2
      - rule_7_effect_3
      - rule_7_effect_4
      - rule_7_cascade
      - rule_7_group

  Hips:
    is_a: BodyPart
    description: Pelvis/hip region.

  Torso:
    is_a: BodyPart
    description: Chest/torso region.

  Head:
    is_a: BodyPart
    description: Head region.

  Neck:
    is_a: BodyPart
    description: Cervical spine region.

  Abdomen:
    is_a: BodyPart
    description: Abdominal region.

  Arm:
    is_a: BodyPart
    description: Upper limb (shoulder to hand).

  Shoulder:
    is_a: BodyPart
    description: Glenohumeral joint region.

  UpperArm:
    is_a: BodyPart
    description: Humerus region.

  Forearm:
    is_a: BodyPart
    description: Radius/ulna region.

  Hand:
    is_a: BodyPart
    description: Terminal manipulator.

  Leg:
    is_a: BodyPart
    description: Lower limb (hip to foot).

  Thigh:
    is_a: BodyPart
    description: Femur region.

  Shin:
    is_a: BodyPart
    description: Tibia/fibula region.

  Foot:
    is_a: BodyPart
    description: Terminal support structure.

  Segment:
    is_a: BodyPart
    description: Generic body segment (serpent, worm, centipede).

  Wing:
    is_a: BodyPart
    description: Flight surface (insect, bird, bat).

  Antenna:
    is_a: BodyPart
    description: Sensory appendage (insect antennae, whiskers).

  Thorax:
    is_a: BodyPart
    description: Central body section (insect thorax, cephalothorax).

  SceneChunk:
    is_a: WorldEntity
    description: Administrative chunk for world streaming.

  AutoParticle:
    is_a: WorldEntity
    description: Automatically created particle entity for unmanaged particles.

  SystemEntity:
    is_a: Entity
    description: Administrative entity representing an engine subsystem.
    slots:
      - chunk_size
      - load_radius

  PhysicsConstants:
    is_a: Entity
    description: >-
      Singleton entity holding the global physics parameters a world is
      seeded with. These three are what KGModule::seedPhysicsConstants
      writes; they were undeclared properties until 2026-08-13. This is
      per-world KG configuration, not the solver constants registry:
      those are build-time inputs generated into the engine (INV-29),
      and the solver never reads the KG.
    slots:
      - gravity_z
      - air_resistance
      - default_friction

  Constraint:
    is_a: Entity
    description: Physics constraint between two particles.
    slots:
      - gluon_type
      - stiffness
      - damping
      - breaking_force
      # Serialized joint description the generators write (totem,
      # humanoid): endpoints, geometry and provenance.
      - particle_a
      - particle_b
      - rest_distance
      - base_stiffness
      - joint_name
      - entity_id
      - offset_a_x
      - offset_a_y
      - offset_a_z
      - offset_b_x
      - offset_b_y
      - offset_b_z

# -------------------------------------------------------------------
# Particle interaction model
# -------------------------------------------------------------------

  ParticleInteractionProfile:
    is_a: Entity
    description: >-
      Declares how particles carrying this profile interact with other
      particles: a category bit and a collides-with mask consulted at
      contact broad phase, plus optional medium parameters (drag,
      buoyancy, directional field force) applied to particles
      overlapping a filtered pair. Profile 0 is the engine default:
      collide with everything, no medium.
    slots:
      - category_bit
      - collides_with_mask
      - drag_coefficient
      - buoyancy_factor
      - field_fx
      - field_fy
      - field_fz

  TransformationRule:
    is_a: Entity
    description: >-
      A declarative EVENT rule, executed by the interaction system.
      Three separable questions, one slot each: `trigger` is which
      engine event source to listen to (closed), `condition` is whether
      this occurrence matters (open), `effect` is what to do (open).

      Event rules are pushed and fire once per episode. They are not the
      same mechanism as capability response rules, which are state
      predicates pulled over the KG and safe to re-evaluate; see
      docs/GAME_LAYER.md for when to reach for which.
    slots:
      - trigger
      - condition
      - effect
      - target_profile
      - duration_s
      - trigger_profile

# -------------------------------------------------------------------
# Event types (BFO:Occurrent / PROV-O:Activity aligned)
# -------------------------------------------------------------------

  WorldEvent:
    is_a: Event
    description: Something that happens in the game world.
    slot_usage:
      event_type:
        range: WorldEventType
    slots:
      - source_entity_id
      - target_entity_id
      - payload_keys
      - payload_values

  CollisionEvent:
    is_a: WorldEvent
    description: >-
      Two entities physically collide. Carries the contact itself, not
      just the fact of it: an event rule can only be as specific as the
      occurrence it reads, and a consequence (knockback, absorption,
      where to spawn blood) needs the geometry and the energy.

      source/target_entity_id name the two creatures; source/target_part_id
      name the body parts that actually touched, because armour and
      injury are per-part. The normal comes from contact geometry, never
      from a world-up assumption, so it is meaningful on walls, ceilings
      and in zero-g.
    slots:
      - collision_force
      - normal_x
      - normal_y
      - normal_z
      - contact_x
      - contact_y
      - contact_z
      - penetration
      - approach_speed
      - source_part_id
      - target_part_id

  DamageEvent:
    is_a: WorldEvent
    description: An entity takes damage.
    slots:
      - damage_type
      - damage_amount

  SpawnEvent:
    is_a: WorldEvent
    description: An entity is created in the world.

  DeathEvent:
    is_a: WorldEvent
    description: A living entity dies.

  PerceptionEvent:
    is_a: WorldEvent
    description: An agent perceives another entity.
    slots:
      - memory_layer

  RelationEvent:
    is_a: WorldEvent
    description: A relation between two entities was created or removed.
    slots:
      - relation_type

  ContactFilteredEvent:
    is_a: WorldEvent
    description: >-
      A particle pair overlapping in broad phase was excluded from
      narrow-phase contact by their interaction profiles (start of a
      pass-through episode).
    slots:
      - profile_a
      - profile_b

  VolumeEvent:
    is_a: WorldEvent
    description: >-
      A particle entered (entered=true) or exited (entered=false) the
      volume of a particle whose profile declares a medium.
    slots:
      - entered
      - medium_profile

  TransformationEvent:
    is_a: WorldEvent
    description: A TransformationRule fired on a particle.
    slots:
      - rule_name

  DiceRollEvent:
    is_a: WorldEvent
    description: >-
      A die roll the ENGINE performed: seeded, journaled, citable by
      id. Games and referees receive rolls as facts through this event;
      nothing outside the dice service may assert a result (see
      docs/RPG_MODULE.md, "the referee cannot roll").
    slots:
      - roll_id
      - dice_expression
      - roll_values
      - roll_total
      - roll_stream
      - roll_purpose

# -------------------------------------------------------------------
# Relation types (domain/range constrained)
# -------------------------------------------------------------------

  WorldRelation:
    is_a: Relation
    description: A typed relationship between world entities.
    slot_usage:
      relation_type:
        range: WorldRelationType

# -------------------------------------------------------------------
# Slots (properties)
# -------------------------------------------------------------------

slots:
  # --- World knowledge (promoted from Logogenesis, 2026-08-03: these
  # describe what things ARE anywhere, not how one game asks for them) ---
  organic:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: >-
      The organicalizer: how irregular an organism grows. 0 =
      uniform and tame; 1 = wild (strong per-individual size and hue
      variation, blobby silhouettes). Default 0.6.
  terrain:
    range: TerrainKind
    description: LAYERED is real settling earth; SLAB is one cheap
      flat box.

  # --- Spatial mixin ---
  # NOT required: an entity may exist before it is anywhere. A being
  # rolled up but not yet in the world, an NPC written into the story
  # before it is spawned, a design not yet placed - all are legitimate
  # KG entities. Position arrives when the entity is embodied, and
  # "is it here" is observed (has position, has particles), never
  # demanded at creation. Some entities are also spatial in a shape
  # this triple cannot express: a TrailSegment is its two endpoints.
  position_x:
    range: float
  position_y:
    range: float
  position_z:
    range: float
  facing_angle:
    range: float
    description: Direction entity faces in radians.
  x:
    range: float
    description: >-
      World-position stamp written by createEntityAtPosition and the
      generators. Legacy duplicate of position_x; declared so the
      setProperty gate can validate what the engine actually writes
      (Malleus H1). Unification with position_* is follow-up work.
  y:
    range: float
    description: World-position stamp; legacy duplicate of position_y (see x).
  z:
    range: float
    description: World-position stamp; legacy duplicate of position_z (see x).
  chunk_x:
    range: integer
    description: Chunk-grid X coordinate, floor(world_x / chunk_size).
  chunk_y:
    range: integer
    description: Chunk-grid Y coordinate, floor(world_y / chunk_size).

  # --- HasMaterial mixin ---
  material_type:
    range: MaterialType
  material_density:
    range: float
    description: Density in kg/m3.
  material_friction:
    range: float
    description: Coulomb friction coefficient.
  material_strength:
    range: float
    description: Tensile strength in Pa.

  # --- HasHealth mixin ---
  # NOT required, for the same reason, plus one of its own: not every
  # ruleset has hit points. Cepheus puts damage on the characteristics
  # themselves, so a living entity from that book has no health value
  # to give.
  health:
    range: float
  max_health:
    range: float

  # --- HasOdor mixin ---
  odor_type:
    range: OdorType

  # --- EmitsLight mixin ---
  emission_strength:
    range: float
    description: Light intensity (lux).
  emission_radius:
    range: float
    description: Maximum light reach distance.

  # --- Destructible mixin ---
  solver_authority:
    range: SolverAuthority
    description: >-
      Who owns this body's position. Omit for DYNAMIC. Set KINEMATIC
      to make something genuinely immovable - terrain, a floor, a
      world. Never try to hold a structure up by leaving it still;
      stillness is an optimisation the physics undoes on contact.
  bond_strength:
    range: float
    minimum_value: 0.0
    maximum_value: 1000000.0
    description: >-
      Load a BONDED_TO join carries before it gives, in newtons per
      metre. Around 90000 behaves as rigid cement; small values give
      under their own weight.
  damage_threshold:
    range: float
    description: Damage required to trigger destruction.
  modification_state:
    range: EntityModification

  # --- Growable mixin ---
  growth_iteration:
    range: integer
  is_mature:
    range: boolean
  species:
    range: string
  growth_enabled:
    range: boolean
    description: Whether deferred growth simulation is active for this entity.
  growth_time_created:
    range: float
    description: Game-time seconds at which the organism was created.
  growth_time_last_simulated:
    range: float
    description: Game-time seconds at which growth was last advanced.
  growth_rate_per_year:
    range: float
    description: Growth iterations accrued per game year.
  growth_max_iterations:
    range: integer
    description: Iteration count at which the organism is mature.
  method:
    range: string
    description: Generation algorithm provenance (e.g. space_colonization).

  # --- PhysicsConstants ---
  gravity_z:
    range: float
    description: >-
      Gravitational acceleration along world Z, m/s2. Negative points
      down. Earth default -9.8. The world-Z framing is legacy: this is
      a seed value for a world, not a licence for solver code to assume
      an up axis, which INV-6 forbids.
  air_resistance:
    range: float
    minimum_value: 0.0
    description: >-
      Global air drag coefficient, dimensionless. 0 disables it, which
      is the current default.
  default_friction:
    range: float
    minimum_value: 0.0
    description: >-
      Coulomb friction coefficient used where a pair declares none,
      dimensionless. Default 0.5.

  # --- Entity-specific ---
  floor_type:
    range: FloorType
  floor_kind:
    range: string
    description: >-
      Which generator produced this floor chunk: "floor" (uniform
      floor generator) or "strata" (layered settling earth). Replaces
      the undeclared `type` property stamp the two generators used to
      write (Malleus H1).
  layer_index:
    range: integer
    description: Stratum index from the bottom, for strata layer groups.
  layer_name:
    range: string
    description: Stratum name (e.g. bedrock, subsoil), for strata layer groups.
  chunk_size:
    range: float
    description: Streaming chunk edge length in meters (SystemEntity config).
  load_radius:
    range: float
    description: Chunk streaming load radius in meters (SystemEntity config).
  # --- Constraint ---
  gluon_type:
    range: GluonType
    required: true
  stiffness:
    range: float
    required: true
    description: Constraint stiffness in N/m.
  damping:
    range: float
    description: Damping coefficient in Ns/m.
  breaking_force:
    range: float
    description: Force threshold for constraint failure.
  particle_a:
    range: integer
    description: Stable KGParticleID of the first constraint endpoint.
  particle_b:
    range: integer
    description: Stable KGParticleID of the second constraint endpoint.
  rest_distance:
    range: float
    description: Rest length of the constraint in meters.
  base_stiffness:
    range: float
    description: >-
      Undamaged stiffness in N/m as serialized by the generators.
      Sibling of the required `stiffness` slot; the generators write
      this key today (schema/writer drift, noted by Malleus H1).
  joint_name:
    range: string
    description: >-
      Semantic joint name (e.g. left_hip) when the constraint is a
      skeletal joint.
  entity_id:
    range: integer
    description: >-
      Owning-entity back-reference the totem generator serializes on
      its constraints. Relation-shaped data stored as a property;
      declared as written (Malleus H1), migration to a real relation
      is follow-up work.
  offset_a_x:
    range: float
    description: Attachment offset of endpoint A, local X, meters.
  offset_a_y:
    range: float
    description: Attachment offset of endpoint A, local Y, meters.
  offset_a_z:
    range: float
    description: Attachment offset of endpoint A, local Z, meters.
  offset_b_x:
    range: float
    description: Attachment offset of endpoint B, local X, meters.
  offset_b_y:
    range: float
    description: Attachment offset of endpoint B, local Y, meters.
  offset_b_z:
    range: float
    description: Attachment offset of endpoint B, local Z, meters.

  # --- HasPhysicalCapability mixin ---
  part_strength:
    range: float
    description: Force production capacity in Newtons. 0 = non-functional.
  part_flexibility:
    range: float
    description: Range of motion ratio. 0.0 = locked, 1.0 = full ROM.
  part_responsiveness:
    range: float
    description: Neural response speed for this part in milliseconds. Lower = faster.
  part_max_strength:
    range: float
    description: Maximum force capacity ceiling in Newtons. Degrades with permanent injury.
  part_endurance:
    range: float
    description: Action cycles before fatigue. Drains with use, recovers with rest.

  # --- HasTissue mixin ---
  muscle_health:
    range: float
    description: Muscle tissue integrity 0-100. Affects power production. Damaged by CUT, CRUSH.
  nerve_health:
    range: float
    description: Nerve tissue integrity 0-100. Affects control/speed. Damaged by PIERCE, CRUSH.
  tendon_health:
    range: float
    description: Tendon integrity 0-100. At 0 = limb unusable. Damaged by CUT.
  bone_health:
    range: float
    description: Bone integrity 0-100. At 0 = fracture. Damaged by CRUSH.

  # --- BodyPart ---
  body_part_name:
    range: string
    description: Anatomical name of the body part.
  body_part:
    range: string
    description: >-
      Legacy sibling of body_part_name written by one humanoid
      generator path and read by KGModule's part lookup. Declared as
      written (Malleus H1); collapsing the two keys is follow-up work.

  # --- Floor ground tint ---
  ground_r:
    range: float
    description: Ground red tint component, 0..1.
  ground_g:
    range: float
    description: Ground green tint component, 0..1.
  ground_b:
    range: float
    description: Ground blue tint component, 0..1.

  # --- Simple-entity appearance (HasSimpleAppearance) ---
  size:
    range: float
    description: >-
      Uniform particle size in meters (width = height = thickness for
      simple entities; also the rock spec's characteristic size).
  r:
    range: float
    description: Red color component, 0..1.
  g:
    range: float
    description: Green color component, 0..1.
  b:
    range: float
    description: Blue color component, 0..1.

  # --- Aggregated capability profile (CapabilityStore::write_back) ---
  # Same dotted-key mechanism as the FORGE keys below.
  capability_speed_cap:
    range: float
    annotations:
      kg_key: capability.speed_cap
  capability_locomotion:
    range: float
    annotations:
      kg_key: capability.locomotion
  capability_manipulation:
    range: float
    annotations:
      kg_key: capability.manipulation
  capability_rotation:
    range: float
    annotations:
      kg_key: capability.rotation
  capability_perception:
    range: float
    annotations:
      kg_key: capability.perception

  # --- FORGE capability keys ---
  # The runtime keys are dotted (cap.<capability>.<field>); a dot is
  # not a legal C++ identifier, so each slot carries the real key in
  # a kg_key annotation, which generate_registry.py prefers over the
  # slot name when emitting the ontology registry. The generated C++
  # header keeps the underscored name.
  cap_list:
    range: string
    description: Comma-separated capability names this body part contributes to.
  cap_locomotion_weight:
    range: float
    annotations:
      kg_key: cap.locomotion.weight
  cap_locomotion_side:
    range: string
    annotations:
      kg_key: cap.locomotion.side
  cap_manipulation_weight:
    range: float
    annotations:
