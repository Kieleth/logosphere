  # --- Creature rig bookkeeping ---
  height:
    range: float
    description: Total height in meters.
  walk_speed:
    range: float
    description: Walking pace in m/s.
  run_speed:
    range: float
    description: Running pace in m/s.
  walk_frequency:
    range: float
    description: Walk-cycle step frequency in Hz.
  run_frequency:
    range: float
    description: Run-cycle step frequency in Hz.
  leg_spacing:
    range: float
    description: Lateral hip-to-hip leg spacing in meters.
  shoulder_offset:
    range: float
    description: Lateral shoulder offset from the spine in meters.
  ear_offset:
    range: float
    description: Lateral ear offset from the head center in meters.
  reflexes_ms:
    range: float
    description: Neural response latency in milliseconds.
  grit_W:
    range: float
    description: Sustained power output in watts.
  hips_particle:
    range: integer
    description: Stable KGParticleID of the hips particle.
  center_particle:
    range: integer
    description: Stable KGParticleID of the body-center particle.
  abdomen_particle:
    range: integer
    description: Stable KGParticleID of the abdomen particle.
  torso_particle:
    range: integer
    description: Stable KGParticleID of the torso particle.
  camera_follow_particle:
    range: integer
    description: Stable KGParticleID the camera follows.
  neck_particle:
    range: integer
    description: Stable KGParticleID of the neck particle.
  head_particle:
    range: integer
    description: Stable KGParticleID of the head particle.
  left_arm_particles:
    range: string
    description: Comma-separated KGParticleIDs of the left arm chain.
  right_arm_particles:
    range: string
    description: Comma-separated KGParticleIDs of the right arm chain.
  left_leg_particles:
    range: string
    description: Comma-separated KGParticleIDs of the left leg chain.
  right_leg_particles:
    range: string
    description: Comma-separated KGParticleIDs of the right leg chain.

  # --- Event ---
  source_entity_id:
    range: string
    description: ID of the entity that caused the event.
  target_entity_id:
    range: string
    description: ID of the entity affected by the event.
  collision_force:
    range: float
    description: Magnitude of collision impact in Newtons.
  damage_type:
    range: DamageType
  damage_amount:
    range: float
    description: Amount of damage inflicted.
  memory_layer:
    range: MemoryLayer
    description: Perception memory state at time of event.
  # --- Particle interaction ---
  category_bit:
    range: integer
    description: Which interaction category bit (0-31) this profile occupies.
  collides_with_mask:
    range: integer
    description: Bitmask of category bits this profile exchanges rigid contact with.
  drag_coefficient:
    range: float
    description: Medium drag applied to particles inside this profile's volume (0 = none).
  buoyancy_factor:
    range: float
    description: Buoyant acceleration share against gravity for intruders (0 = none, 1 = neutral).
  field_fx:
    range: float
    description: Directional field force X applied to intruders, Newtons.
  field_fy:
    range: float
    description: Directional field force Y applied to intruders, Newtons.
  field_fz:
    range: float
    description: Directional field force Z applied to intruders, Newtons.
  trigger:
    range: TransformationTrigger
    description: >-
      WHICH engine event source this rule listens to. Genuinely closed:
      each value is a queue the interaction system owns, and a game
      cannot add one without engine code. See TransformationTrigger for
      the vocabulary and the case-normalization rule.
  condition:
    range: string
    description: >-
      WHETHER this rule cares about a given occurrence, evaluated
      against the event context once the trigger has selected it. Open
      by design: engine built-ins plus anything a game registers.
      Syntax "<name>" or "<name>:<args>". Empty means unconditional.

      Engine built-ins for ON_CONTACT:
        with_type:<EntityType>   the other party resolves to this type
        impact_above:<m/s>       approach speed exceeds a threshold

      This slot generalizes trigger_profile, which is the same idea
      hardcoded to one comparison. New rules should prefer condition.
  effect:
    range: string
    description: >-
      WHAT this rule does when it fires. Open by design: the
      TransformationEffect enum lists the engine built-ins, and a
      game-registered effect name is an equally legal value here, which
      is why this slot is a string rather than typed to that enum.
  target_profile:
    range: integer
    description: Profile id the effect targets (for swap_profile).
  duration_s:
    range: float
    description: Effect duration in seconds (for timed effects).
  trigger_profile:
    range: integer
    description: >-
      Interaction profile id a volume/contact trigger binds to
      (0 = any profile fires the rule).
  profile_a:
    range: integer
    description: Interaction profile of the first particle in the filtered pair.
  profile_b:
    range: integer
    description: Interaction profile of the second particle in the filtered pair.

  # --- Contact geometry (CollisionEvent) ---
  # The normal is unit length and points from source toward target. It
  # comes from the contact manifold, so it is correct on a wall, a
  # ceiling, and in zero-g; nothing here may be derived from world up.
  normal_x:
    range: float
    description: Contact normal X, unit, pointing from source toward target.
  normal_y:
    range: float
    description: Contact normal Y, unit, pointing from source toward target.
  normal_z:
    range: float
    description: Contact normal Z, unit, pointing from source toward target.
  contact_x:
    range: float
    description: World-space contact point X.
  contact_y:
    range: float
    description: World-space contact point Y.
  contact_z:
    range: float
    description: World-space contact point Z.
  penetration:
    range: float
    description: Overlap depth at the contact, metres.
  approach_speed:
    range: float
    description: >-
      Relative velocity along the contact normal, m/s. NEGATIVE means
      the pair is approaching; positive means separating. This is the
      energy term a consequence scales with, and the sign convention is
      the solver's, not a reinterpretation.
  source_part_id:
    range: string
    description: >-
      KG EntityID of the body part on the source side, decimal string.
      Matches the source_entity_id/target_entity_id convention on
      WorldEvent rather than introducing a second id encoding.
  target_part_id:
    range: string
    description: KG EntityID of the body part on the target side, decimal string.
  entered:
    range: boolean
    description: True on volume entry, false on exit.
  medium_profile:
    range: integer
    description: Profile id of the medium volume involved.
  roll_id:
    range: integer
    description: Monotonic id of the roll, unique per session, citable.
  dice_expression:
    range: string
    description: >-
      The expression rolled, canonical form ("2D6+1"). EXECUTED, and by
      a named thing: DiceService::parse turns this string into a
      DiceExpression and DiceService::roll evaluates it
      (include/logosphere/core/dice_service.h:56,110). Recorded here
      because a formula-shaped slot is the fleet's most common way of
      writing knowledge down and never running it, and the only defence
      against that is naming the executor next to the slot. If the
      parser ever stops being the sole reader of this string, this line
      is wrong and the slot has become documentation.
  roll_values:
    range: string
    description: Individual die results, comma-separated, in roll order.
  roll_total:
    range: integer
    description: (Sum of the dice plus the modifier) times the multiplier.
  roll_stream:
    range: string
    description: >-
      Named RNG stream the roll came from (e.g. "chargen"). Streams are
      independently seeded so a session replays deterministically.
  roll_purpose:
    range: string
    description: What the roll was for, in the roller's words.
  rule_name:
    range: string
    description: Name of the transformation rule that fired.
  payload_keys:
    range: string
    multivalued: true
    description: Event payload keys (parallel to payload_values). Populated from rule.N.payload.* KG properties when emit_event fires.
  payload_values:
    range: string
    multivalued: true
    description: Event payload values (parallel to payload_keys).
