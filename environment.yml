name: logosphere
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cmake
  - ninja
  - pkg-config
  - pyyaml
  # >=1.11.0 is the first release carrying linkml.generators.cppgen
  # (upstream linkml#3332). scripts/gen_cpp_header.py imports it
  # directly; below this floor, ontology codegen cannot run.
  #
  # The pin is satisfiable and measured: `conda env create -f
  # environment.yml` resolves conda-forge's noarch linkml 1.11.1 on
  # osx-arm64 (2026-08-20) and on linux-64 (every ontology-generation
  # CI run), and the generator then leaves zero drift.
  #
  # A CAVEAT used to sit here saying the dev machine's editable
  # 1.10.0.post230.dev0+2909900a4 was code-identical and could be used
  # as-is. It could not: that env was never created, the generator ran
  # from `base` for weeks, and a comment cannot notice. The mechanism
  # that does is scripts/env_gate.py, which every run of
  # scripts/generate_ontology.py passes through before it imports
  # linkml. There is no override.
  - linkml >=1.11.0
  - pip
  - pip:
      # The malleus root ontology, which every schema here imports.
      # generate_ontology.py refuses to run without it, on purpose: it
      # compares the vendored schema/malleus.yaml against the installed
      # root byte for byte, and a check that cannot run is not a check.
      #
      # From git and pinned to a commit, for two reasons. PyPI's
      # malleus-dev is 0.1.0 and predates bundled_ontology_path
      # entirely, so `pip install malleus-dev` installs a package the
      # gate cannot use. And a branch moves, which would let the root
      # change underneath us without a diff here: the same drift this
      # dependency exists to catch.
      #
      # Re-pin deliberately: bump this SHA, rerun
      # scripts/generate_ontology.py, commit the regenerated output.
      - malleus-dev @ git+https://github.com/Kieleth/malleus-dev@a492ea8adbb622484033e2d780890c86d6beccc1
